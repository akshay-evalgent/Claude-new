<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:'Fredoka';src:url('fonts/Fredoka.ttf');font-weight:300 700}
@font-face{font-family:'Nunito';src:url('fonts/Nunito.ttf');font-weight:200 1000}
@font-face{font-family:'Bangers';src:url('fonts/Bangers.ttf')}
html,body{margin:0;background:#000;width:1920px;height:1080px;overflow:hidden}
#stage{width:1920px;height:1080px}
#stage svg{display:block}
</style></head>
<body><div id="stage"></div>
<script>var module={exports:{}};</script>
<script src="shots.js"></script>
<script>window.SHOTS=module.exports.shots;window.THUMB=module.exports.thumb;window.META=module.exports.meta;</script>
<script src="lib.js"></script>
<script>
window.TIMINGS=null;
window.setTimings=function(t){window.TIMINGS=t;};
window.renderFrame=function(i,t){
  var shot=window.SHOTS[i]; var dur=(window.TIMINGS&&window.TIMINGS.shots[i])?window.TIMINGS.shots[i].dur:8;
  document.getElementById('stage').innerHTML=window.WIG.renderShot(shot,t,dur);
  return true;
};
window.renderThumb=function(){ document.getElementById('stage').innerHTML=window.WIG.renderThumb(window.THUMB); return true; };
window.fontsReady=function(){ return Promise.all([document.fonts.load('700 100px Fredoka'),document.fonts.load('800 34px Nunito'),document.fonts.load('100px Bangers')]).then(function(){return document.fonts.status;}); };
</script>
</body></html>
