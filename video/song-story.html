<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:C;src:url(fonts/Cormorant-Regular.ttf);font-weight:400}
@font-face{font-family:C;src:url(fonts/Cormorant-Medium.ttf);font-weight:500}
@font-face{font-family:C;src:url(fonts/Cormorant-Italic.ttf);font-style:italic}
*{margin:0;box-sizing:border-box}
body{width:1080px;height:1920px;overflow:hidden;background:#070b1a;font-family:C,serif;color:#f3e9d2}
#zoom{position:absolute;inset:0;transform-origin:520px 1250px}
#zoom>*{position:absolute;left:0;top:0}
#sky{inset:0;width:1080px;height:1920px;background:radial-gradient(ellipse at 72% 18%,#2a3f7c 0%,#18244f 34%,#0a1024 78%)}
#warm{width:1080px;height:1920px;background:radial-gradient(ellipse at 50% 68%,rgba(214,140,90,.30),rgba(214,140,90,0) 55%)}
#moonglow{left:800px!important;top:340px!important;width:800px;height:800px;margin:-400px;border-radius:50%;background:radial-gradient(circle,rgba(243,233,210,.24),rgba(243,233,210,0) 62%)}
#cglow{left:525px!important;top:1210px!important;width:700px;height:700px;margin:-350px;border-radius:50%;background:radial-gradient(circle,rgba(240,190,120,.42),rgba(240,190,120,0) 60%)}
.line{position:absolute;left:80px;right:80px;top:500px;text-align:center}
.line .a{font-size:96px;font-weight:500;line-height:1.15}
.line .b{font-size:50px;font-style:italic;color:#e3c58a;letter-spacing:1px;line-height:1.3}
#qMark{position:absolute;left:0;right:0;top:1500px;text-align:center;font-size:30px;letter-spacing:14px;text-transform:uppercase}
#qFade{position:absolute;inset:0;background:#070b1a}
</style></head><body>
<div id="zoom">
<div id="sky"></div><div id="warm"></div>
<canvas id="cs" width="1080" height="1920"></canvas>
<div id="moonglow"></div>
<svg width="1080" height="1920" id="moon"><defs><mask id="mm"><rect width="1080" height="1920" fill="#fff"/><circle cx="838" cy="314" r="96" fill="#000"/></mask></defs>
<circle cx="800" cy="340" r="115" fill="#f3e9d2" mask="url(#mm)"/></svg>
<svg width="1080" height="1920"><path d="M0,1330 C150,1290 260,1310 380,1300 C560,1285 700,1300 820,1280 C930,1262 1010,1290 1080,1275 L1080,1920 L0,1920Z" fill="#101a3c"/><g id="town"></g></svg>
<div id="cglow"></div>
<svg width="1080" height="1920" id="fg">
<g fill="#050814">
<path d="M0,1440 C190,1350 370,1332 540,1340 C760,1352 910,1420 1080,1480 L1080,1920 L0,1920Z"/>
<path d="M118,1420 C124,1300 120,1180 132,1060 L160,1060 C166,1180 170,1300 186,1420Z"/>
<path d="M140,1150 C110,1110 80,1090 40,1085 M150,1120 C190,1080 220,1070 262,1066" stroke="#050814" stroke-width="14" fill="none" stroke-linecap="round"/>
<circle cx="146" cy="980" r="150"/><circle cx="40" cy="1040" r="110"/><circle cx="262" cy="1030" r="105"/><circle cx="200" cy="900" r="100"/><circle cx="70" cy="910" r="95"/>
</g>
<line id="arm" x1="500" y1="1300" x2="500" y2="1300" stroke="#050814" stroke-width="26" stroke-linecap="round"/>
<g id="boy" fill="#050814" stroke="rgba(243,233,210,.22)" stroke-width="2.5">
<path d="M-54,6 C-62,-74 -48,-134 -24,-146 L24,-146 C48,-134 62,-74 54,6Z"/>
<rect x="-13" y="-162" width="26" height="24" stroke="none"/><circle cx="0" cy="-190" r="37"/>
</g>
<g id="girl" fill="#070a18" stroke="rgba(232,196,120,.6)" stroke-width="2.5">
<path d="M-44,6 C-50,-64 -40,-120 -20,-132 L20,-132 C40,-120 50,-64 44,6Z"/>
<circle cx="0" cy="-172" r="33"/>
<path d="M-34,-180 C-44,-128 -40,-84 -28,-58 L28,-58 C40,-84 44,-128 34,-180 C30,-216 -30,-216 -34,-180Z"/></g>
</svg>
<canvas id="cp" width="1080" height="1920"></canvas>
</div>
<div id="lines"></div><div id="qMark">Calm A Sutra</div><div id="qFade"></div>
<script>
const cl=x=>Math.max(0,Math.min(1,x)),ease=x=>{x=cl(x);return x*x*(3-2*x)},lerp=(a,b,k)=>a+(b-a)*k;
const ramp=(t,a,b)=>ease((t-a)/(b-a));
let s=11;const R=()=>(s=(s*16807)%2147483647)/2147483647;
const BX=430,BY=1340,GX=628,GY=1345,SC=1.5;
const stars=[...Array(170)].map(()=>({x:R()*1080,y:R()*1280,r:.6+R()*2,p:R()*6.28,f:.4+R()*1.2,th:R()}));
const flies=[...Array(14)].map(()=>({x:R()*1080,y:1050+R()*500,p:R()*6.28,f:.15+R()*.25,a:30+R()*70}));
const lights=[...Array(46)].map(()=>{const left=R()<.5;return{x:left?R()*330:740+R()*340,y:1296+R()*30,th:R(),r:2+R()*2.2}});
town.innerHTML=lights.map((l,i)=>`<circle id="tl${i}" cx="${l.x}" cy="${l.y}" r="${l.r}" fill="#f0c27a"/>`).join('');
const parts=[...Array(230)].map(()=>{let hx,hy;const z=R();
 if(z<.3){const a=R()*6.28,q=Math.sqrt(R())*33;hx=Math.cos(a)*q;hy=-172+Math.sin(a)*q}
 else if(z<.6){hy=-180+R()*122;hx=(R()*2-1)*38}
 else{hy=-132+R()*138;hx=(R()*2-1)*(22+26*cl((hy+132)/100))}
 return{hx:GX+hx*SC,hy:GY+hy*SC,dx:120+R()*520,dy:-180-R()*760,d:R(),p:R()*6.28,r:1.6+R()*2.6}});
const cx=cs.getContext('2d'),cq=cp.getContext('2d');let D,B,T,L=[];
window.init=d=>{D=d;B=d.beats;T=d.duration;
 lines.innerHTML=d.lines.map((l,i)=>`<div class="line" id="ln${i}">${l.title?`<div class="a">${l.title}</div>`:''}${l.sub?`<div class="b">${l.sub}</div>`:''}</div>`).join('');
 L=d.lines.map((l,i)=>document.getElementById('ln'+i))};
function glowDot(c,x,y,r,a,col){const g=c.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,`rgba(${col},${a})`);g.addColorStop(1,`rgba(${col},0)`);c.fillStyle=g;c.fillRect(x-r,y-r,2*r,2*r)}
window.setT=t=>{const [b0,b1,b2,b3]=B;
 // story parameters
 const gather=ramp(t,b0+.8,b0+3.8)-ramp(t,b2+.4,b2+3.4)+ramp(t,b3+1.0,b3+3.6);
 const w=1-ramp(t,b2+.4,b2+3.2)+ramp(t,b3+1.4,b3+3.8);
 const lean=ramp(t,b1+.8,b1+3.2)-ramp(t,b2+.2,b2+1.6)+ramp(t,b3+2.8,b3+4.4);
 const townK=1-ramp(t,b1+.3,b1+4.2);
 const starK=.55+.75*ramp(t,b1+.5,b1+4)-1.1*ramp(t,b2+.6,b2+3.4)+1.1*ramp(t,b3+1.4,b3+4);
 const reach=ramp(t,b2+3.2,b2+4.6)-ramp(t,b3+3.6,b3+4.6);
 const z=1+.10*ramp(t,b0,b2)-.10*ramp(t,b2+.3,b2+3.5)+.13*ramp(t,b3+.8,T);
 zoom.style.transform=`scale(${z})`;zoom.style.filter=`saturate(${.2+.8*w}) brightness(${.72+.28*w})`;
 warm.style.opacity=w*(.35+.65*lean);cglow.style.opacity=w*lean*(.85+.15*Math.sin(t*1.3));
 moonglow.style.opacity=(.45+.55*w)*(.85+.15*Math.sin(t*.7));
 cx.clearRect(0,0,1080,1920);
 for(const o of stars){const on=cl((starK-o.th*.9)*3);cx.globalAlpha=on*(.3+.7*(.5+.5*Math.sin(o.p+t*o.f*1.6)));cx.fillStyle='#f3e9d2';cx.beginPath();cx.arc(o.x,o.y,o.r*(.8+.4*cl(starK-.6)),0,7);cx.fill()}
 cx.globalAlpha=1;
 lights.forEach((l,i)=>{document.getElementById('tl'+i).setAttribute('opacity',cl((townK-l.th*.85)*6)*(.6+.4*Math.sin(t*2+i)))});
 boy.setAttribute('transform',`translate(${BX},${BY}) rotate(${7*lean}) scale(${SC})`);
 girl.setAttribute('transform',`translate(${GX},${GY}) rotate(${-9*lean}) scale(${SC})`);
 girl.setAttribute('opacity',ramp(gather,.72,1));
 arm.setAttribute('x2',500+85*reach);arm.setAttribute('y2',1300+14*reach);arm.setAttribute('opacity',reach>0.01?1:0);
 cq.clearRect(0,0,1080,1920);
 for(const o of flies){const x=o.x+Math.sin(o.p+t*o.f)*o.a,y=o.y-t*7+Math.cos(o.p+t*o.f*1.3)*20;glowDot(cq,x,y,15,cl(.3+.4*Math.sin(o.p*3+t*1.1))*w,'232,196,120')}
 for(const o of parts){const k=ease((gather-o.d*.55)/.45),wob=1-k;
  const x=lerp(o.hx+o.dx+Math.sin(o.p+t*.8)*60,o.hx,k)+Math.sin(o.p*2+t*1.7)*10*wob;
  const y=lerp(o.hy+o.dy+Math.cos(o.p+t*.6)*50,o.hy,k)+Math.cos(o.p*3+t*1.3)*10*wob;
  const a=cl(k*2.2)*lerp(.95,.16+.12*Math.sin(o.p+t*2.2),ramp(gather,.8,1));
  if(a>.01)glowDot(cq,x,y,o.r*5,a,'240,205,130')}
 L.forEach((e,i)=>{const st=B[i],en=i<3?B[i+1]:T-1;const k=ramp(t,st+.25,st+1.25)*(1-ramp(t,en-.7,en-.05));e.style.opacity=k;e.style.transform=`translateY(${(1-ramp(t,st+.25,st+1.25))*18}px)`});
 qMark.style.opacity=.7*ramp(t,b3+2.6,b3+3.8)*(1-0);
 qFade.style.opacity=Math.max(1-ramp(t,0,1.2),ramp(t,T-.9,T));
};
</script></body></html>
