<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0}body{width:1080px;height:1920px;overflow:hidden;background:#000}
#c{position:absolute;left:0;top:0;width:1080px;height:1920px;image-rendering:pixelated}
#qMark{position:absolute;left:0;right:0;top:300px;text-align:center;font:bold 30px "DejaVu Sans Mono",monospace;letter-spacing:12px;color:#f4ead8;text-shadow:4px 4px 0 #0a0d1c}
#qFade{position:absolute;inset:0;background:#04050b}
</style></head><body><canvas id="c" width="270" height="480"></canvas><div id="qMark">CALM A SUTRA</div><div id="qFade"></div><script>
// Animated pixel-art night sky built from layers made by pixelate.py: the sky drifts, stars twinkle, meteors fall.
const W=270,H=480,cl=x=>Math.max(0,Math.min(1,x)),ease=x=>{x=cl(x);return x*x*(3-2*x)},ramp=(t,a,b)=>ease((t-a)/(b-a));
const cx=c.getContext('2d',{willReadFrequently:true});cx.imageSmoothingEnabled=false;
const load=s=>new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src=s});
let D,T,sky,fg,stars,fgA;let sd=9;const R=()=>(sd=(sd*16807)%2147483647)/2147483647;
window.init=async d=>{D=d;T=d.duration;sky=await load(d.images.sky);fg=await load(d.images.fg);
 stars=d.data.stars.map(([x,y,b,col])=>({x,y,b,col,p:R()*6.28,f:.6+R()*2.4,tw:R()}));
 cx.clearRect(0,0,W,H);cx.drawImage(fg,0,0);fgA=cx.getImageData(0,0,W,H).data};
const add=(px,x,y,r,g,b)=>{if(x<0||y<0||x>=W||y>=H)return;const i=(y*W+x)*4;if(fgA[i+3])return;px[i]=Math.min(255,px[i]+r);px[i+1]=Math.min(255,px[i+1]+g);px[i+2]=Math.min(255,px[i+2]+b)};
window.setT=t=>{const pan=D.pan||24,off=D.data.skyX+Math.round(-pan+2*pan*t/T);
 cx.drawImage(sky,-off,0);const im=cx.getImageData(0,0,W,H),px=im.data;
 for(const s of stars){const x=Math.round(s.x)-off,y=Math.round(s.y);if(x<-1||x>W)continue;
  let k=s.tw<.55?(.7+.3*Math.sin(s.p+t*s.f)):(.45+.55*Math.sin(s.p+t*s.f*1.6));k=Math.round(cl(k)*4)/4;      // stepped twinkle
  const a=s.b*k*1.25,r=s.col[0]*a+70*a,g=s.col[1]*a+70*a,b=s.col[2]*a+78*a;add(px,x,y,r,g,b);
  if(s.b>.62&&k>.5){const q=.38*k;add(px,x-1,y,r*q,g*q,b*q);add(px,x+1,y,r*q,g*q,b*q);add(px,x,y-1,r*q,g*q,b*q);add(px,x,y+1,r*q,g*q,b*q)}
  if(s.b>.9&&k>.75){const q=.16;add(px,x-2,y,r*q,g*q,b*q);add(px,x+2,y,r*q,g*q,b*q);add(px,x,y-2,r*q,g*q,b*q);add(px,x,y+2,r*q,g*q,b*q)}}
 for(const m of D.meteors){const u=(t-m.t)/m.d;if(u<0||u>1.25)continue;      // shooting stars
  for(let i=0;i<m.len;i++){const q=u-i*.012;if(q<0||q>1)continue;const x=Math.round(m.x+m.dx*q),y=Math.round(m.y+m.dy*q),a=(1-i/m.len)*Math.sin(Math.min(1,q)*3.14)*(i?150:255);add(px,x,y,a,a,a*1.05);if(!i){add(px,x+1,y,a*.4,a*.4,a*.45);add(px,x,y-1,a*.4,a*.4,a*.45)}}}
 const gl=6+5*Math.sin(t*.5);for(let y=H*.72|0;y<H;y++)for(let x=0;x<W;x++)add(px,x,y,gl*(y/H),gl*.5*(y/H),0);   // horizon glow breathes
 cx.putImageData(im,0,0);cx.drawImage(fg,0,0);
 qMark.style.opacity=ramp(t,T-4.5,T-3.3);qFade.style.opacity=Math.max(1-ramp(t,0,.9),ramp(t,T-.8,T));
};
</script></body></html>
