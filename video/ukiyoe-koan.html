// "Muddy Road" — a Zen koan as animated ukiyo-e woodblock prints.
// Every view is a printed sheet: washi paper, colour blocks (each slightly out of register, with woodgrain,
// baren rubbing and specks), a sumi key block on top, bokashi skies, paper left as the white.
// Figures step at 8 fps, rain at 12 fps, the camera moves on ones and slides between sheets like a handscroll.
const W=1080,H=1920,SW=960,SH=1420,IA={x:44,y:44,w:872,h:1332},GAP=170,ANCHOR=[540,880];
const PAL={paper:'#efe2c4',mount:'#a88d63',sumi:'#2b2621',grey:'#8d8a82',prussian:'#2d4c78',blue:'#5f86a8',pale:'#b9cfd4',
 beni:'#c0392b',ochre:'#c9964b',mud:'#a87f4a',green:'#7d9a5a',pgreen:'#b4bf86',dgreen:'#4c6a40',brown:'#6e4a2c',face:'#f3e6cb',robeT:'#3f4f63',robeE:'#6f6a5e',hat:'#c49a55'};
{const gc=HTMLCanvasElement.prototype.getContext;HTMLCanvasElement.prototype.getContext=function(k,o){return gc.call(this,k,k==='2d'?{...(o||{}),willReadFrequently:true}:o)}} // CPU canvases: far faster than emulated GPU here
const cx=c.getContext('2d');
const cl=x=>Math.max(0,Math.min(1,x)),ease=x=>{x=cl(x);return x*x*(3-2*x)},lerp=(a,b,k)=>a+(b-a)*k,ramp=(t,a,b)=>ease((t-a)/(b-a));
const st=(t,f)=>Math.floor(t*f);                                  // stepped time index (8 fps figures, 12 fps rain)
const hash=n=>{n=Math.sin(n*127.1+311.7)*43758.5453;return n-Math.floor(n)};
const h2=(x,y)=>{const n=Math.sin(x*127.1+y*311.7)*43758.5453;return n-Math.floor(n)};
const n1=x=>{const i=Math.floor(x),f=x-i,u=f*f*(3-2*f);return hash(i)*(1-u)+hash(i+1)*u};
const n2=(x,y)=>{const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
 return (h2(xi,yi)*(1-u)+h2(xi+1,yi)*u)*(1-v)+(h2(xi,yi+1)*(1-u)+h2(xi+1,yi+1)*u)*v};
let seed=7;const R=()=>(seed=(seed*16807)%2147483647)/2147483647;
const mk=(w,h)=>{const k=document.createElement('canvas');k.width=w;k.height=h;return k};
const rgb=hex=>[1,3,5].map(i=>parseInt(hex.slice(i,i+2),16));

// ---------- textures (built once) ----------
const TX={};
function textures(){
 let k=mk(SW,SH),g=k.getContext('2d');g.fillStyle=PAL.paper;g.fillRect(0,0,SW,SH);
 let id=g.getImageData(0,0,SW,SH),d=id.data;
 for(let y=0;y<SH;y++)for(let x=0;x<SW;x++){const i=(y*SW+x)*4,m=n2(x*.004,y*.004)*.6+n2(x*.03,y*.03)*.4,e=Math.min(x,y,SW-x,SH-y),age=e<70?(1-e/70)**2*22:0;
  const v=(m-.5)*12+(h2(x,y)-.5)*7-age;d[i]+=v;d[i+1]+=v;d[i+2]+=v*1.15}
 g.putImageData(id,0,0);TX.paper=k;
 k=mk(SW,SH);g=k.getContext('2d');id=g.createImageData(SW,SH);d=id.data;            // woodgrain: iso-lines of a warped noise field
 for(let y=0;y<SH;y++)for(let x=0;x<SW;x++){const v=y*.055+n2(x*.003,y*.011)*11+n2(x*.03,y*.07)*.9,f=v-Math.floor(v);
  if(f<.1){const i=(y*SW+x)*4;d[i]=40;d[i+1]=26;d[i+2]=12;d[i+3]=(1-f/.1)*120}}
 g.putImageData(id,0,0);TX.grain=k;
 k=mk(SW,SH);g=k.getContext('2d');g.filter='blur(3px)';g.strokeStyle='#000';            // baren: blurred circular arcs + zigzags
 for(let i=0;i<170;i++){g.globalAlpha=.25+R()*.5;g.lineWidth=6+R()*18;const a=R()*6.28;g.beginPath();g.arc(R()*SW,R()*SH,40+R()*190,a,a+.5+R()*2.2);g.stroke()}
 for(let i=0;i<45;i++){g.globalAlpha=.2+R()*.3;g.lineWidth=3+R()*6;g.beginPath();let x=R()*SW,y=R()*SH;g.moveTo(x,y);for(let j=0;j<8;j++){x+=20+R()*30;y+=(j%2?1:-1)*(10+R()*20);g.lineTo(x,y)}g.stroke()}
 TX.baren=k;
 k=mk(SW,SH);g=k.getContext('2d');g.fillStyle='#000';for(let i=0;i<7000;i++){g.globalAlpha=.4+R()*.6;g.beginPath();g.arc(R()*SW,R()*SH,.5+R()*1.1,0,7);g.fill()}TX.specks=k;
 k=mk(SW,SH);g=k.getContext('2d');for(let i=0;i<1300;i++){g.strokeStyle=R()<.5?'#ffffff':'#9c8460';g.lineWidth=.5+R()*.8;g.beginPath();
  let x=R()*SW,y=R()*SH,a=R()*6.28;g.moveTo(x,y);for(let j=0;j<5;j++){a+=(R()-.5)*.9;x+=Math.cos(a)*(6+R()*14);y+=Math.sin(a)*(6+R()*14);g.lineTo(x,y)}g.stroke()}TX.fibres=k;
 k=mk(2160,H);g=k.getContext('2d');g.fillStyle=PAL.mount;g.fillRect(0,0,2160,H);
 for(let i=0;i<2600;i++){g.strokeStyle=R()<.5?'rgba(255,240,210,.18)':'rgba(60,40,20,.16)';g.lineWidth=.6+R();g.beginPath();const x=R()*2160,y=R()*H;g.moveTo(x,y);g.lineTo(x+(R()-.5)*30,y+(R()-.5)*30);g.stroke()}
 TX.mount=k;
}
// ---------- drawing helpers ----------
function spline(p,k=8){const o=[];for(let i=0;i<p.length-1;i++){const p0=p[Math.max(0,i-1)],p1=p[i],p2=p[i+1],p3=p[Math.min(p.length-1,i+2)];

  .5*((2*p1[1])+(-p0[1]+p2[1])*t+(2*p0[1]-5*p1[1]+4*p2[1]-p3[1])*t2+(-p0[1]+3*p1[1]-3*p2[1]+p3[1])*t3)])}}o.push(p[p.length-1]);return o}
function ink(g,pts,w,col=PAL.sumi,sd=1,taper=1,jit=.28){       // carved line: variable width, tapered at both ends
 const P=spline(pts),n=P.length,L=[],Rr=[];
 for(let i=0;i<n;i++){const a=P[Math.max(0,i-1)],b=P[Math.min(n-1,i+1)];let dx=b[0]-a[0],dy=b[1]-a[1];const l=Math.hypot(dx,dy)||1;dx/=l;dy/=l;
  const s=i/(n-1),tp=taper?Math.pow(Math.sin(Math.PI*s),.45):1,ww=w*(.3+.7*tp)*(1+jit*(n1(sd+s*5)*2-1))/2;
  L.push([P[i][0]-dy*ww,P[i][1]+dx*ww]);Rr.push([P[i][0]+dy*ww,P[i][1]-dx*ww])}
 g.fillStyle=col;g.beginPath();L.forEach((q,i)=>i?g.lineTo(q[0],q[1]):g.moveTo(q[0],q[1]));for(let i=n-1;i>=0;i--)g.lineTo(Rr[i][0],Rr[i][1]);g.closePath();g.fill()}
function bokashi(g,x,y,w,h,hex,a0,wander,sd,up=false){ // hand-wiped gradient, per pixel, wandering edge per column
 const k=mk(w,h),kg=k.getContext('2d'),id=kg.createImageData(w,h),d=id.data,[r,gg,b]=rgb(hex);

  for(let j=0;j<h;j++){const jj=up?h-1-j:j,q=cl(1-(j+off)/(h-wander)),p=(jj*w+i)*4;d[p]=r;d[p+1]=gg;d[p+2]=b;d[p+3]=255*a0*Math.pow(q,1.25)}}

function ridge(y0,amp,f,sd,x0=IA.x-20,x1=IA.x+IA.w+20,stepx=12){const p=[];for(let x=x0;x<=x1;x+=stepx)p.push([x,y0+(n1(sd+x*f)-.5)*2*amp+(n1(sd*3.3+x*f*3.2)-.5)*amp*.35]);return p}
function fillBelow(g,p,col,bottom=IA.y+IA.h+20){g.fillStyle=col;g.beginPath();g.moveTo(p[0][0],bottom);p.forEach(q=>g.lineTo(q[0],q[1]));g.lineTo(p[p.length-1][0],bottom);g.closePath();g.fill()}
function mist(gs,y,h,x0,x1){for(const g of gs){g.save();g.globalCompositeOperation='destination-out';     // suyari-gasumi: paper left unprinted
 const gr=g.createLinearGradient(x0,0,x1,0);gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(.18,'#000');gr.addColorStop(.82,'#000');gr.addColorStop(1,'rgba(0,0,0,0)');

function erase(g,fn){g.save();g.globalCompositeOperation='destination-out';fn(g);g.restore()}
function slantLines(g,x0,y0,x1,y1,gapy,slope,col,w,clipFn){g.save();if(clipFn){clipFn(g);g.clip()}g.strokeStyle=col;g.lineWidth=w;

 B.key.lineWidth=1.3;for(let i=0;i<14;i++){const x=px-pw*.42+pw*.84*i/13,y=py+ph*.45;for(let j=-1;j<=1;j++){B.key.beginPath();B.key.moveTo(x,y-ph*.25);B.key.lineTo(x+j*7,y+ph*.12);B.key.stroke()}}}
function sealCanvas(ch,size){const k=mk(size,size),g=k.getContext('2d');g.fillStyle=PAL.beni;g.fillRect(2,2,size-4,size-4);

function poly(g,pts,fill,line=2.6,off=[1.6,1.2]){g.save();g.translate(off[0],off[1]);g.fillStyle=fill;g.beginPath();pts.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.closePath();g.fill();g.restore();

function monk(g,x,y,s,o){ // o: {pose:'walk'|'stand'|'carry'|'seated'|'gesture', f, face:1|-1, robe, hat, ghost}
 g.save();g.translate(x,y);g.scale(s*(o.face||1),s);g.lineWidth=2.6/s;const f=o.f||0,walk=o.pose==='walk'||o.pose==='carry',bob=walk?[0,-2,0,-2][f]:0,lw=2.6/s;
 if(o.pose==='seated'||o.pose==='gesture'){

  poly(g,[[-12,-56],[8,-56],[-2,-12],[-20,-14]],PAL.ochre,lw);                             // kesa
  const up=o.pose==='gesture'&&f%2===0;                                                  // the arm rises and falls at 8 fps
  if(up)poly(g,[[6,-50],[22,-58],[40,-66],[44,-58],[24,-44],[10,-38]],o.robe,lw);else poly(g,[[6,-48],[24,-30],[28,-14],[12,-12],[2,-30]],o.robe,lw);
  if(up)circ(g,46,-64,4.5,PAL.face,lw*.9);
  circ(g,2,-68,11,PAL.face,lw);g.strokeStyle=PAL.sumi;g.lineWidth=lw*.8;g.beginPath();g.moveTo(7,-70);g.lineTo(11,-70);g.stroke();
  if(o.frown){g.beginPath();g.moveTo(5,-74);g.lineTo(11,-72);g.stroke()}
  g.restore();return}
 g.translate(0,bob);feet(g,f,walk);
 poly(g,[[-17,-66],[17,-66],[24,-6],[-22,-6]],o.robe,lw);
 poly(g,[[-15,-66],[0,-66],[18,-22],[6,-18]],PAL.ochre,lw);                                // kesa across the robe
 if(o.pose==='carry'){
  poly(g,[[2,-58],[30,-52],[40,-46],[30,-40],[4,-44]],o.robe,lw);                          // arms forward
  girlCarried(g,lw,f)}
 else{const sw=walk?[2,0,-2,0][f]:0;poly(g,[[-4+sw,-62],[10+sw,-60],[16+sw,-26],[2+sw,-24]],o.robe,lw)}
 circ(g,2,-76,10,PAL.face,lw);
 if(o.hat){poly(g,[[-26,-78],[30,-78],[2,-97]],PAL.hat,lw);g.strokeStyle=PAL.sumi;g.lineWidth=lw*.7;for(let i=-2;i<=2;i++){g.beginPath();g.moveTo(2,-96);g.lineTo(2+i*11,-79);g.stroke()}}
 else{g.strokeStyle=PAL.sumi;g.lineWidth=lw*.8;g.beginPath();g.moveTo(7,-77);g.lineTo(11,-77);g.stroke()}
 g.restore()}
function girlCarried(g,lw,f){ // lying across his arms: head forward, kimono and long sleeve hanging
 poly(g,[[-14,-58],[30,-62],[38,-54],[30,-48],[-12,-44],[-22,-46]],PAL.beni,lw);
 poly(g,[[6,-48],[18,-48],[20,-26+(f%2)],[8,-26+(f%2)]],PAL.beni,lw);                        // furisode sleeve
 poly(g,[[0,-60],[8,-60],[10,-46],[2,-46]],PAL.ochre,lw);                                     // obi
 circ(g,44,-64,8,PAL.face,lw);poly(g,[[38,-70],[52,-74],[56,-64],[48,-62]],PAL.sumi,0);circ(g,52,-77,6,PAL.sumi,0);
 poly(g,[[-26,-48],[-18,-46],[-20,-40],[-28,-42]],PAL.sumi,0)}
function girl(g,x,y,s,o){ // o: {pose:'stand'|'bow'|'walk'|'ghost', f, face, a}
 g.save();g.translate(x,y);g.scale(s*(o.face||1),s);const f=o.f||0,lw=2.6/s,walk=o.pose==='walk';

  L([[-13,-62],[13,-62],[16,-2],[-16,-2]]);L([[-13,-46],[13,-46],[13,-38],[-13,-38]]);L([[-12,-60],[-24,-30],[-14,-24],[-6,-50]]);
  g.beginPath();g.arc(0,-71,8.5,0,7);g.stroke();g.beginPath();g.arc(0,-84,6.5,0,7);g.stroke();g.restore();return}
 if(walk)feet(g,f,true);else feet(g,0,false);
 g.save();if(o.pose==='bow'){g.translate(0,-30);g.rotate([0,.22,.42,.42,.42,.22,0,0][f]||0);g.translate(0,30)}
 poly(g,[[-12,-62],[12,-62],[15,-2],[-15,-2]],PAL.beni,lw);
 poly(g,[[-13,-46],[13,-46],[13,-37],[-13,-37]],PAL.ochre,lw);poly(g,[[-13,-46],[-24,-50],[-24,-34],[-13,-38]],PAL.ochre,lw);   // obi + bow at the back

// ---------- views (prints) ----------
function blocks(){const B={};for(const k of ['blue','earth','red','key']){B[k+'C']=mk(SW,SH);B[k]=B[k+'C'].getContext('2d')}return B}
function finish(B){for(const k of ['blue','earth','red','key']){const g=B[k];g.save();g.globalCompositeOperation='source-atop';
  if(k!=='key'){g.globalAlpha=.6;g.drawImage(TX.grain,0,0)}g.globalCompositeOperation='destination-out';if(k!=='key'){g.globalAlpha=.13;g.drawImage(TX.baren,0,0)}g.globalAlpha=.3;g.drawImage(TX.specks,0,0);g.restore()}
 return [{c:B.blueC,off:[2.2,-1.6]},{c:B.earthC,off:[-1.8,2]},{c:B.redC,off:[1.8,1.8]},{c:B.keyC,off:[0,0]}]}
const roadTop=x=>lerp(800,735,(x-IA.x)/IA.w),roadBot=x=>lerp(930,860,(x-IA.x)/IA.w),roadMid=x=>(roadTop(x)+roadBot(x))/2+12;
function buildRoad(night){const B=blocks(),{blue,earth,key}=B;
 if(night){blue.fillStyle='#5a7898';blue.fillRect(IA.x,IA.y,IA.w,720);bokashi(blue,IA.x,IA.y,IA.w,560,'#1b2f52',1,30,5);
  erase(blue,g=>{g.beginPath();g.arc(470,215,62,0,7);g.fill()});key.strokeStyle=PAL.grey;key.lineWidth=2;key.beginPath();key.arc(470,215,62,0,7);key.stroke()}
