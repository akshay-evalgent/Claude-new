<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0}body{width:1080px;height:1920px;overflow:hidden;background:#000}
#c{position:absolute;left:0;top:0;width:1080px;height:1920px;image-rendering:pixelated}
#qMark{position:absolute;left:0;right:0;top:300px;text-align:center;font:bold 30px "DejaVu Sans Mono",monospace;letter-spacing:12px;color:#f6ecd8;text-shadow:4px 4px 0 #0a0a14}
#qFade{position:absolute;inset:0;background:#000}
</style></head><body><canvas id="c" width="270" height="480"></canvas><div id="qMark">CALM A SUTRA</div><div id="qFade"></div><script>
// Multi-scene pixel-art story. Each scene: pixel grid (288x512) + depth map -> pixel-snapped pan & parallax,
// light flicker, and pixel particle effects. Scenes change with a 4x4 Bayer dither dissolve.
const W=270,H=480,GW=288,GH=512,cl=x=>Math.max(0,Math.min(1,x)),ease=x=>{x=cl(x);return x*x*(3-2*x)},ramp=(t,a,b)=>ease((t-a)/(b-a));
const BAY=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5].map(v=>(v+.5)/16);
const cx=c.getContext('2d');const out=cx.createImageData(W,H),O=out.data;
const load=s=>new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src=s});
const pixels=im=>{const k=document.createElement('canvas');k.width=GW;k.height=GH;const g=k.getContext('2d');g.drawImage(im,0,0,GW,GH);return g.getImageData(0,0,GW,GH).data};
const hash=(a,b)=>{let n=Math.sin(a*127.1+b*311.7)*43758.5453;return n-Math.floor(n)};
let D,T,S=[];
window.init=async d=>{D=d;T=d.duration;
 for(const s of d.scenes){const img=pixels(await load(s.image)),dep=pixels(await load(s.depth));
  const lum=new Float32Array(GW*GH),dp=new Float32Array(GW*GH);
  for(let i=0;i<GW*GH;i++){lum[i]=(img[i*4]*.3+img[i*4+1]*.55+img[i*4+2]*.15);dp[i]=dep[i*4]/255}
  // light pixels: brightest few percent, warm or not
  // light pixels = small bright points (much brighter than their 9x9 surroundings), e.g. lamps, bulbs, stars
  const box=new Float32Array(GW*GH),r=4;for(let y=0;y<GH;y++)for(let x=0;x<GW;x++){let a=0,n=0;for(let dy=-r;dy<=r;dy+=2)for(let dx=-r;dx<=r;dx+=2){const xx=x+dx,yy=y+dy;if(xx>=0&&yy>=0&&xx<GW&&yy<GH){a+=lum[yy*GW+xx];n++}}box[y*GW+x]=a/n}
  const light=new Uint8Array(GW*GH);for(let i=0;i<GW*GH;i++)light[i]=(lum[i]>(s.lightMin||120)&&lum[i]-box[i]>(s.lightContrast||28))?1:0;const th=0;
  let sd=s.seed||7;const R=()=>(sd=(sd*16807)%2147483647)/2147483647;
  const P=[...Array(s.count||140)].map(()=>({x:R(),y:R(),p:R()*6.28,f:.4+R(),r:R(),k:R()}));
  S.push({s,img,dp,lum,light,P,R})}};
function put(x,y,r,g,b,a){x|=0;y|=0;if(x<0||y<0||x>=W||y>=H)return;const i=(y*W+x)*4;O[i]+=(r-O[i])*a;O[i+1]+=(g-O[i+1])*a;O[i+2]+=(b-O[i+2])*a}
function addp(x,y,r,g,b){x|=0;y|=0;if(x<0||y<0||x>=W||y>=H)return;const i=(y*W+x)*4;O[i]=Math.min(255,O[i]+r);O[i+1]=Math.min(255,O[i+1]+g);O[i+2]=Math.min(255,O[i+2]+b)}
function draw(sc,lt,dur,mask){const {s,img,dp,lum,light}=sc,u=lt/dur;
 const px=Math.round((s.pan?s.pan[0]:9)*(1-u)+(s.pan?s.pan[2]:9)*u),py=Math.round((s.pan?s.pan[1]:16)*(1-u)+(s.pan?s.pan[3]:16)*u);
 const par=(s.parallax||4)*(u-.5),flick=.82+.18*Math.sin(lt*9.1)*Math.sin(lt*5.3+1)+.06*Math.sin(lt*23);
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){if(mask&&!mask(x,y))continue;
  let gx=x+px,gy=y+py;const d0=dp[Math.min(GH-1,gy)*GW+Math.min(GW-1,gx)];
  gx+=Math.round(par*(d0-.35));
  if(s.sway&&gy>s.sway*GH&&d0>.35)gx+=Math.round(Math.sin(lt*1.5+gy*.18)*Math.sin(lt*.7+gy*.05)*1.2*d0);
  if(s.leaves&&gy<s.leaves*GH&&d0>.55)gx+=Math.round(Math.sin(lt*2.1+gy*.3+gx*.05)*.8);
  gx=Math.max(0,Math.min(GW-1,gx));gy=Math.max(0,Math.min(GH-1,gy));const j=gy*GW+gx,i=(y*W+x)*4;
  let m=1;if(s.lights&&light[j]){const h=hash(gx>>1,gy>>1);m=s.lights==='twinkle'?(.72+.38*Math.sin(lt*(2+3*h)+h*40)):flick}
  O[i]=Math.min(255,img[j*4]*m);O[i+1]=Math.min(255,img[j*4+1]*m);O[i+2]=Math.min(255,img[j*4+2]*m);O[i+3]=255}
 fx(sc,lt,dur,mask)}
function fx(sc,lt,dur,mask){const {s,P}=sc;const ok=(x,y)=>!mask||mask(x|0,y|0);
 for(const e of s.fx||[])for(const o of P){
  if(e==='petals'&&o.k<.75){const x=((o.x*W+lt*(10+14*o.r)+Math.sin(o.p+lt*o.f*2)*8)%(W+10)+W+10)%(W+10)-5,y=((o.y*H*.9+lt*(6+8*o.r))%H);
   if(ok(x,y)){put(x,y,255,230,90,1);put(x+1,y,240,190,40,1);if(o.r>.4){put(x,y+1,230,170,30,1)}}}
  if(e==='pollen'&&o.k<.5){const x=o.x*W+Math.sin(o.p+lt*o.f)*10,y=H*.45+o.y*H*.5-lt*3*o.r,a=.5+.5*Math.sin(o.p*3+lt*2);if(ok(x,y)&&a>.4)addp(x,y,90*a,70*a,20*a)}
  if(e==='fireflies'&&o.k<.45){const x=o.x*W+Math.sin(o.p+lt*o.f*.8)*14,y=H*.35+o.y*H*.5+Math.cos(o.p+lt*o.f*.6)*10,a=.5+.5*Math.sin(o.p*5+lt*1.6);
   if(ok(x,y)&&a>.25){addp(x,y,255*a,220*a,110*a);const q=.35*a;addp(x+1,y,255*q,210*q,100*q);addp(x-1,y,255*q,210*q,100*q);addp(x,y+1,255*q,210*q,100*q);addp(x,y-1,255*q,210*q,100*q)}}
  if(e==='leaves'&&o.k<.25){const x=((o.x*W+lt*(8+6*o.r)+Math.sin(o.p+lt*1.3)*10)%W+W)%W,y=(o.y*H*.6+lt*(14+10*o.r))%H;if(ok(x,y)){put(x,y,92,128,60,1);put(x+(Math.sin(lt*4+o.p)>0?1:-1),y,70,104,48,1)}}
  if(e==='rain'){for(let r=0;r<3;r++){const q=hash(o.p*10+r,o.k*7),x=((q*W*1.3-lt*40-o.r*30)%(W+60)+W+60)%(W+60)-30,y=((o.y*H+lt*(380+120*o.r)+r*170)%(H+40))-20,a=.28+.25*o.r;
    for(let k=0;k<5+3*o.r;k++)if(ok(x-k*.3,y+k))put(x-k*.3,y+k,200,215,235,a)}
   if(o.k<.3){const sx=(o.x*W)|0,sy=(H*.82+o.y*H*.17)|0,ph=(lt*2.5+o.p)%1;if(ph<.25&&ok(sx,sy)){put(sx-1,sy,210,225,240,.5);put(sx+1,sy,210,225,240,.5);put(sx,sy-1,210,225,240,.4)}}}
  if(e==='stars'&&o.k<.7){const x=(o.x*W)|0,y=(o.y*H*(s.skyTo||.45))|0,a=.5+.5*Math.sin(o.p+lt*(1+2*o.r));if(ok(x,y)&&a>.35){addp(x,y,200*a,200*a,215*a);if(o.r>.85){const q=.4*a;addp(x+1,y,200*q,200*q,215*q);addp(x-1,y,200*q,200*q,215*q);addp(x,y+1,200*q,200*q,215*q);addp(x,y-1,200*q,200*q,215*q)}}}}
 for(const m of s.meteors||[]){const u=(lt-m.t)/m.d;if(u<0||u>1.3)continue;for(let i=0;i<18;i++){const q=u-i*.014;if(q<0||q>1)continue;const x=m.x+m.dx*q,y=m.y+m.dy*q,a=(1-i/18)*Math.sin(q*3.14)*(i?170:255);if(ok(x,y))addp(x,y,a,a,a)}}
 for(const f of s.fireworks||[]){const u=(lt-f.t)/2.6;if(u<0||u>1)continue;const col=f.c;
  if(u<.18){const y=f.y+(H*.6-f.y)*(1-u/.18);if(ok(f.x,y))addp(f.x,y,220,200,160);continue}
  const v=(u-.18)/.82;for(let k=0;k<34;k++){const a=k/34*6.283+f.x,rr=v*f.r*(.8+.2*hash(k,f.t)),x=f.x+Math.cos(a)*rr,y=f.y+Math.sin(a)*rr+v*v*10,al=(1-v)*(hash(k,lt*8|0)>.2?1:.3);
   if(ok(x,y)){const C=[col[0]*al*1.3,col[1]*al*1.3,col[2]*al*1.3];addp(x,y,...C);addp(x+1,y,...C);addp(x,y+1,...C);addp(x+1,y+1,...C);for(let k2=1;k2<4;k2++){const q=.45/k2;addp(x-Math.cos(a)*k2*2,y-Math.sin(a)*k2*2,C[0]*q,C[1]*q,C[2]*q)}}}
  if(v<.12){const g=(1-v/.12)*90;for(let dy=-3;dy<=3;dy++)for(let dx=-3;dx<=3;dx++)if(dx*dx+dy*dy<=9&&ok(f.x+dx,f.y+dy))addp(f.x+dx,f.y+dy,g,g*.9,g*.7)}}}
window.setT=t=>{const X=D.dissolve||1.0;let i=0;while(i+1<S.length&&t>=S[i+1].s.start)i++;
 const sc=S[i],end=i+1<S.length?S[i+1].s.start:T,st=sc.s.start;draw(sc,t-st,end-st+X,null);
 if(i+1<S.length&&t>end-X){const nx=S[i+1],k=(t-(end-X))/X,ne=i+2<S.length?S[i+2].s.start:T;   // Bayer dissolve into next scene
  draw(nx,t-(end-X),ne-end+X,(x,y)=>BAY[((y>>1)&3)*4+((x>>1)&3)]<k)}
 cx.putImageData(out,0,0);
 qMark.style.opacity=ramp(t,T-4.5,T-3.3);qFade.style.opacity=Math.max(1-ramp(t,0,.9),ramp(t,T-.8,T));
};
</script></body></html>
