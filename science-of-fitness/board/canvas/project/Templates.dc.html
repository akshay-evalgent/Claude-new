<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Screen templates</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#26E0C4}a:hover{color:#7FF0DD}
</style>
</helmet>
<div style="width: 1600px; height: 1100px; box-sizing: border-box; padding: 56px 64px; background: #0A0C10; color: #ECF0F4; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; gap: 26px">
  <div style="display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: center; gap: 12px; font-size: 15px; font-weight: 600; letter-spacing: 0.12em; color: #9AA3AF"><span style="width: 4px; height: 22px; background: #26E0C4"></span>SCREEN TEMPLATES · REUSED EVERY EPISODE</div>
    <h1 style="margin: 0; font-size: 48px; font-weight: 900; line-height: 1.05">Five layouts carry most of a video</h1>
    <p style="margin: 0; font-size: 18px; color: #9AA3AF">Every frame keeps the same furniture: chapter label top-left, progress dots top-right, safety tag bottom-left on exercise shots, source bottom-right on every claim.</p>
  </div>
  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; flex-grow: 1; min-height: 0">
    <figure style="margin: 0; background: #12161C; border-radius: 12px; overflow: hidden"><img src="/_blob/b59e1fe13269cf6afcdfe9b049d2f446" alt="Title card template" style="width: 100%; height: auto; display: block"><figcaption style="padding: 12px 16px; display: flex; flex-direction: column; gap: 4px"><strong style="font-size: 17px">Title card</strong><span style="font-size: 14px; color: #9AA3AF">Opens each part. One big coloured word.</span></figcaption></figure>
    <figure style="margin: 0; background: #12161C; border-radius: 12px; overflow: hidden"><img src="/_blob/bef4bd2c9fa9612dd2d2f54abca8f6e5" alt="Do and don't split template" style="width: 100%; height: auto; display: block"><figcaption style="padding: 12px 16px; display: flex; flex-direction: column; gap: 4px"><strong style="font-size: 17px">Do and don't</strong><span style="font-size: 14px; color: #9AA3AF">Teal tick against coral X. Host poses go in the boxes.</span></figcaption></figure>
    <figure style="margin: 0; background: #12161C; border-radius: 12px; overflow: hidden"><img src="/_blob/29d50e639f15deb4171059292dc50f5b" alt="Stat ring template" style="width: 100%; height: auto; display: block"><figcaption style="padding: 12px 16px; display: flex; flex-direction: column; gap: 4px"><strong style="font-size: 17px">Stat ring</strong><span style="font-size: 14px; color: #9AA3AF">Ring fills while the number counts up. Motion test exists.</span></figcaption></figure>
    <figure style="margin: 0; background: #12161C; border-radius: 12px; overflow: hidden"><img src="/_blob/094d2dd8032f4d2374e3458498e16f93" alt="Zoom ladder template" style="width: 100%; height: auto; display: block"><figcaption style="padding: 12px 16px; display: flex; flex-direction: column; gap: 4px"><strong style="font-size: 17px">Zoom ladder</strong><span style="font-size: 14px; color: #9AA3AF">Our signature move, once per episode.</span></figcaption></figure>
    <figure style="margin: 0; background: #12161C; border-radius: 12px; overflow: hidden"><img src="/_blob/6c818bab9ef2c5bafa89c35167bc61ec" alt="Nutrient card template" style="width: 100%; height: auto; display: block"><figcaption style="padding: 12px 16px; display: flex; flex-direction: column; gap: 4px"><strong style="font-size: 17px">Nutrient card</strong><span style="font-size: 14px; color: #9AA3AF">Element tile, one big number, daily needs, one food.</span></figcaption></figure>
    <figure style="margin: 0; background: #12161C; border-radius: 12px; overflow: hidden"><img src="/_blob/670080290df3f86364bbf50cc346364b" alt="Palette reference frame" style="width: 100%; height: auto; display: block"><figcaption style="padding: 12px 16px; display: flex; flex-direction: column; gap: 4px"><strong style="font-size: 17px">Palette frame</strong><span style="font-size: 14px; color: #9AA3AF">Reference for anyone making assets.</span></figcaption></figure>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1600,"height":1100}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
