<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:transparent;overflow:hidden}</style></head>
<body>
<script type="module">
// A brick-style toy figure (a parody caricature: golden swoop of hair, tan face, navy suit, long red tie), built from
// primitives. window.setPose(p) poses it and returns the head-top anchor and the scale at the head, in canvas pixels.
import * as THREE from './three.module.min.js';
const W = 760, H = 1100;
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setSize(W, H); renderer.setPixelRatio(1); renderer.setClearColor(0x000000, 0);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(22, W / H, 0.1, 100);
cam.position.set(0, 2.4, 14); cam.lookAt(0, 2.05, 0);

// soft studio reflections for the plastic
const env = new THREE.Scene();
env.add(new THREE.Mesh(new THREE.BoxGeometry(30, 30, 30), new THREE.MeshBasicMaterial({ color: 0x4a4440, side: THREE.BackSide })));
for (const [x, y, z, s, c] of [[-6, 8, 8, 9, 0xffffff], [8, 4, 6, 6, 0xfff1dc], [0, 10, -6, 10, 0xffffff], [0, -8, 4, 12, 0x8a7a68]]) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(s, s), new THREE.MeshBasicMaterial({ color: c, side: THREE.DoubleSide }));
  m.position.set(x, y, z); m.lookAt(0, 0, 0); env.add(m);
}
const pm = new THREE.PMREMGenerator(renderer);
scene.environment = pm.fromScene(env, 0.04).texture;
scene.add(new THREE.HemisphereLight(0xfff6e8, 0x5a4a3c, 0.8));
const key = new THREE.DirectionalLight(0xffffff, 2.0); key.position.set(-4, 7, 8); scene.add(key);
const fill = new THREE.DirectionalLight(0xfff0dd, 0.6); fill.position.set(6, 3, 6); scene.add(fill);
const rim = new THREE.DirectionalLight(0xffffff, 1.6); rim.position.set(3, 6, -8); scene.add(rim);

const plastic = (color, extra = {}) => new THREE.MeshPhysicalMaterial({ color, roughness: 0.3, metalness: 0, clearcoat: 0.6, clearcoatRoughness: 0.2, ...extra });
const NAVY = 0x1f2b4d, SKIN = 0xeea35c, HAIR = 0xf0c65a, BLACK = 0x161616;
const canvasTex = (w, h, draw) => { const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t; };

const fig = new THREE.Group(); scene.add(fig);
const body = new THREE.Group(); fig.add(body);

// legs + shoes (pivot at the hip)
const legs = [];
for (const sx of [-1, 1]) {
  const g = new THREE.Group(); g.position.set(0.39 * sx, 1.25, 0); body.add(g);
  const leg = new THREE.Mesh(new THREE.BoxGeometry(0.74, 1.0, 0.8), plastic(NAVY)); leg.position.y = -0.5; g.add(leg);
  const shoe = new THREE.Mesh(new THREE.BoxGeometry(0.76, 0.27, 0.86), plastic(BLACK)); shoe.position.set(0, -1.12, 0.02); g.add(shoe);
  legs.push(g);
}
const hips = new THREE.Mesh(new THREE.BoxGeometry(1.56, 0.32, 0.8), plastic(NAVY)); hips.position.y = 1.41; body.add(hips);

// torso: a trapezoid block with the suit, shirt and long red tie printed on the front
const tg = new THREE.BoxGeometry(1, 1, 1, 1, 1, 1);
const pos = tg.attributes.position;
for (let i = 0; i < pos.count; i++) {
  const y = pos.getY(i) + 0.5;
  pos.setX(i, pos.getX(i) * (1.56 + (1.14 - 1.56) * y)); pos.setZ(i, pos.getZ(i) * (0.8 + (0.64 - 0.8) * y)); pos.setY(i, pos.getY(i) * 1.3);
}
tg.computeVertexNormals();
const suitPrint = canvasTex(512, 512, (g, w, h) => {
  g.fillStyle = '#1f2b4d'; g.fillRect(0, 0, w, h);
  g.fillStyle = '#f4f2ee'; g.beginPath(); g.moveTo(w * 0.33, 0); g.lineTo(w * 0.67, 0); g.lineTo(w * 0.5, h * 0.52); g.closePath(); g.fill();
  g.strokeStyle = '#2f3f6a'; g.lineWidth = 10;                 // lapels
  g.beginPath(); g.moveTo(w * 0.3, 0); g.lineTo(w * 0.5, h * 0.56); g.lineTo(w * 0.7, 0); g.stroke();
  g.fillStyle = '#c8102e';                                      // knot + long tie
  g.beginPath(); g.moveTo(w * 0.455, h * 0.02); g.lineTo(w * 0.545, h * 0.02); g.lineTo(w * 0.53, h * 0.1); g.lineTo(w * 0.47, h * 0.1); g.closePath(); g.fill();
  g.beginPath(); g.moveTo(w * 0.47, h * 0.1); g.lineTo(w * 0.53, h * 0.1); g.lineTo(w * 0.575, h * 0.9); g.lineTo(w * 0.5, h * 0.97); g.lineTo(w * 0.425, h * 0.9); g.closePath(); g.fill();
  g.strokeStyle = 'rgba(0,0,0,0.25)'; g.lineWidth = 3;
  g.beginPath(); g.moveTo(w * 0.5, h * 0.56); g.lineTo(w * 0.5, h); g.stroke();
  g.fillStyle = '#111a30'; for (const y of [0.66, 0.8]) { g.beginPath(); g.arc(w * 0.44, h * y, 7, 0, 7); g.fill(); }
});
const navyM = plastic(NAVY);
const torso = new THREE.Mesh(tg, [navyM, navyM, navyM, navyM, plastic(0xffffff, { map: suitPrint }), navyM]);
torso.position.y = 1.57 + 0.65; body.add(torso);

// arms (pivot at the shoulder) with C-shaped hands
const arms = [];
for (const sx of [-1, 1]) {
  const piv = new THREE.Group(); piv.position.set(0.66 * sx, 2.68, 0); body.add(piv);
  const out = new THREE.Group(); out.rotation.z = 0.2 * sx; piv.add(out);
  const sleeve = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.17, 0.95, 24), plastic(NAVY)); sleeve.position.y = -0.42; out.add(sleeve);
  const cuff = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 0.16, 16), plastic(0xf4f2ee)); cuff.position.y = -0.95; out.add(cuff);
  const hand = new THREE.Mesh(new THREE.TorusGeometry(0.15, 0.075, 14, 28, Math.PI * 1.55), plastic(SKIN));
  hand.position.set(0, -1.14, 0.03); hand.rotation.set(0, Math.PI / 2, Math.PI * 0.72); out.add(hand);
  arms.push(piv);
}

// head: neck, cylinder with the face printed round it, rounded rims, swoop of hair
const headG = new THREE.Group(); headG.position.y = 2.87; body.add(headG);
const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.24, 0.12, 24), plastic(SKIN)); neck.position.y = 0.06; headG.add(neck);
function faceTex(open) {
  return canvasTex(1024, 512, (g, w, h) => {
    g.fillStyle = '#eea35c'; g.fillRect(0, 0, w, h);
    const ex = [w * 0.443, w * 0.557], ey = h * 0.42;
    g.fillStyle = '#f8d8ae'; for (const x of ex) { g.beginPath(); g.ellipse(x, ey, 50, 40, 0, 0, 7); g.fill(); }   // pale goggle tan-lines
    g.fillStyle = '#141414'; for (const x of ex) { g.beginPath(); g.ellipse(x, ey + 4, 15, 19, 0, 0, 7); g.fill(); }
    g.fillStyle = '#ffffff'; for (const x of ex) { g.beginPath(); g.arc(x - 5, ey - 3, 5, 0, 7); g.fill(); }
    g.strokeStyle = '#b8892e'; g.lineWidth = 20; g.lineCap = 'round';                                             // brows, a little cross
    g.beginPath(); g.moveTo(ex[0] - 52, ey - 52); g.lineTo(ex[0] + 30, ey - 38); g.stroke();
    g.beginPath(); g.moveTo(ex[1] + 52, ey - 52); g.lineTo(ex[1] - 30, ey - 38); g.stroke();
    g.strokeStyle = 'rgba(120,60,20,0.5)'; g.lineWidth = 7;                                                      // nose hint
    g.beginPath(); g.arc(w * 0.5, h * 0.58, 20, 0.2 * Math.PI, 0.8 * Math.PI); g.stroke();
    const my = h * 0.77;
    if (open > 0) {                                                                                                // talking
      g.fillStyle = '#4a1010'; g.beginPath(); g.ellipse(w * 0.5, my, 50, 14 + 30 * open, 0, 0, 7); g.fill();
      g.fillStyle = '#ffffff'; g.fillRect(w * 0.5 - 34, my - 14 - 30 * open + 5, 68, 10 + 4 * open);
      g.strokeStyle = '#a8433a'; g.lineWidth = 10; g.beginPath(); g.ellipse(w * 0.5, my, 53, 17 + 30 * open, 0, 0, 7); g.stroke();
    } else {                                                                                                       // the famous pout
      g.fillStyle = '#b5524a'; g.beginPath(); g.ellipse(w * 0.5, my, 40, 24, 0, 0, 7); g.fill();
      g.fillStyle = '#4a1010'; g.beginPath(); g.ellipse(w * 0.5, my, 18, 10, 0, 0, 7); g.fill();
    }
  });
}
const faces = [faceTex(0), faceTex(0.5), faceTex(1)];
const faceM = plastic(0xffffff, { map: faces[0] });
const headSide = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 0.5, 64, 1, true, Math.PI, Math.PI * 2), faceM);
headSide.position.y = 0.12 + 0.07 + 0.25; headG.add(headSide);
const rimProfile = (up) => { const pts = []; for (let i = 0; i <= 10; i++) { const a = i / 10 * Math.PI / 2; pts.push(new THREE.Vector2(0.43 + 0.07 * Math.cos(a), (up ? 1 : -1) * 0.07 * Math.sin(a))); } pts.push(new THREE.Vector2(0, (up ? 1 : -1) * 0.07)); return pts; };
const rimTop = new THREE.Mesh(new THREE.LatheGeometry(rimProfile(true), 64), plastic(SKIN, { side: THREE.DoubleSide })); rimTop.position.y = 0.12 + 0.07 + 0.5; headG.add(rimTop);
const rimBot = new THREE.Mesh(new THREE.LatheGeometry(rimProfile(false), 64), plastic(SKIN, { side: THREE.DoubleSide })); rimBot.position.y = 0.12 + 0.07; headG.add(rimBot);
const hairM = plastic(HAIR, { roughness: 0.38, clearcoat: 0.45 });
const cap = new THREE.Mesh(new THREE.SphereGeometry(0.56, 48, 24, 0, Math.PI * 2, 0, Math.PI / 2), hairM); cap.scale.set(1, 0.45, 1); cap.position.y = 0.72; headG.add(cap);
const back = new THREE.Mesh(new THREE.CylinderGeometry(0.545, 0.545, 0.36, 48, 1, true, Math.PI / 2 - 0.25, Math.PI + 0.5), hairM); back.position.y = 0.58; headG.add(back);
const swoop = new THREE.Mesh(new THREE.SphereGeometry(0.5, 48, 24), hairM); swoop.scale.set(1.18, 0.3, 0.78); swoop.position.set(0.02, 0.86, 0.14); swoop.rotation.set(0.12, 0.25, 0.1); headG.add(swoop);
const flick = new THREE.Mesh(new THREE.SphereGeometry(0.5, 32, 16), hairM); flick.scale.set(1.05, 0.24, 0.48); flick.position.set(-0.12, 0.8, 0.42); flick.rotation.set(0.35, -0.35, 0.18); headG.add(flick);
const HEAD_TOP = 0.98;   // head-group height of the top of the hair

const v = new THREE.Vector3();
const proj = (p) => { v.copy(p).project(cam); return [(v.x + 1) / 2 * W, (1 - v.y) / 2 * H]; };
window.setPose = (p = {}) => {
  fig.rotation.set(p.lean || 0, p.yaw || 0, p.roll || 0, 'YXZ');
  headG.rotation.set(p.nod || 0, p.headYaw || 0, p.headRoll || 0);
  arms[0].rotation.set(-(p.armR || 0), 0, -(p.armRz || 0));   // figure's right arm is screen-left when facing camera
  arms[1].rotation.set(-(p.armL || 0), 0, (p.armLz || 0));
  legs[0].rotation.x = p.legR || 0; legs[1].rotation.x = p.legL || 0;
  body.position.y = p.bob || 0;
  faceM.map = faces[Math.max(0, Math.min(2, Math.round((p.mouth || 0) * 2)))];
  renderer.render(scene, cam);
  fig.updateMatrixWorld(true);
  const top = headG.localToWorld(new THREE.Vector3(0, HEAD_TOP, 0));
  const c = headG.localToWorld(new THREE.Vector3(0, 0.45, 0));
  const a = proj(top), b = proj(c), b2 = proj(c.clone().add(new THREE.Vector3(1, 0, 0)));
  return { ax: a[0], ay: a[1], ppu: Math.hypot(b2[0] - b[0], b2[1] - b[1]) };
};
window.png = () => renderer.domElement.toDataURL('image/png');
window.READY = true;
</script>
</body></html>
