<!doctype html>
<!-- Mood board for a micro-course series: the same frame (episode 1's hook) drawn in five visual
     styles, so a style can be chosen from real frames rather than adjectives.
     Rendered by moodboard.cjs. window.renderStyle(canvas, n, cfg) draws one 1080x1920 frame. -->
<html><head><meta charset="utf-8">
<style>
  @font-face { font-family: 'Baloo'; src: url('../voices/video/fonts/Baloo2.ttf'); }
  @font-face { font-family: 'Kalam'; src: url('../voices/video/fonts/Kalam-Bold.ttf'); font-weight: 700; }
  @font-face { font-family: 'Kalam'; src: url('../voices/video/fonts/Kalam-Regular.ttf'); font-weight: 400; }
  html, body { margin: 0; background: #111; }
  #sheet { display: flex; gap: 24px; padding: 24px; width: max-content; }
  .card { width: 540px; }
  .card canvas { width: 540px; height: 960px; display: block; border-radius: 16px; }
  .card .label { font: 700 26px/1.2 Baloo, sans-serif; color: #fff; margin: 14px 0 0 4px; }
  .card .sub { font: 400 18px/1.3 Baloo, sans-serif; color: #aaa; margin: 2px 0 0 4px; }
  #single canvas { width: 1080px; height: 1920px; display: block; }
</style></head>
<body>
<div id="sheet"></div>
<div id="single"></div>
<script>
const W = 1080, H = 1920;

const STYLES = [
  { key: 'midnight', name: 'S1 Midnight', sub: 'Dark room, phone glow, yellow marker. Like the Shorts so far.',
    bg: ['#0f1424', '#1a2140'], ink: '#ffffff', quiet: '#9aa3b8', accent: '#f2b544', hand: 'Kalam', cap: 'Baloo',
    phone: '#0b0d14', screen: '#000000', bezel: '#2a2f45', me: '#2f7bff', them: '#2a2d36', meText: '#fff', themText: '#fff',
    drawn: false, glow: 0, texture: 'bokeh' },
  { key: 'notebook', name: 'S2 Notebook', sub: 'Cream paper, ink sketch, red marker. Looks hand-made.',
    bg: ['#f4ecd8', '#efe4cc'], ink: '#2a2420', quiet: '#7a6f66', accent: '#d9432f', hand: 'Kalam', cap: 'Kalam',
    phone: '#fbf7ee', screen: '#fffdf7', bezel: '#2a2420', me: '#cfe3ff', them: '#e8e3d9', meText: '#2a2420', themText: '#2a2420',
    drawn: true, glow: 0, texture: 'paper' },
  { key: 'clean', name: 'S3 Clean', sub: 'White, flat, coral accent. Bright and minimal.',
    bg: ['#f7f7fa', '#eef0f6'], ink: '#111111', quiet: '#6b6f7a', accent: '#ff5a5f', hand: 'Kalam', cap: 'Baloo',
    phone: '#111111', screen: '#ffffff', bezel: '#111111', me: '#1f8fff', them: '#e9e9eb', meText: '#fff', themText: '#111',
    drawn: false, glow: 0, texture: 'blob' },
  { key: 'neon', name: 'S4 Neon', sub: 'Black, cyan and pink glow. Loud and viral.',
    bg: ['#07060c', '#0d0a18'], ink: '#ffffff', quiet: '#8f93b3', accent: '#ff2d95', hand: 'Kalam', cap: 'Baloo',
    phone: '#0a0912', screen: '#05040a', bezel: '#22e3ff', me: '#0f6f86', them: '#2a1d3a', meText: '#dffcff', themText: '#fff',
    drawn: false, glow: 28, texture: 'grid' },
  { key: 'chalk', name: 'S5 Chalkboard', sub: 'Green board, chalk lines, yellow chalk. Playful teacher.',
    bg: ['#1f3b2e', '#183026'], ink: '#f2f0e6', quiet: '#b9c3b6', accent: '#ffe28a', hand: 'Kalam', cap: 'Kalam',
    phone: 'rgba(255,255,255,0.04)', screen: 'rgba(255,255,255,0.03)', bezel: '#f2f0e6', me: 'rgba(255,255,255,0.10)', them: 'rgba(255,255,255,0.06)', meText: '#f2f0e6', themText: '#f2f0e6',
    drawn: true, glow: 0, texture: 'chalk' },
];

function rng(seed) { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function roundRectPath(c, x, y, w, h, r) {
  c.beginPath(); c.moveTo(x + r, y); c.lineTo(x + w - r, y); c.quadraticCurveTo(x + w, y, x + w, y + r);
  c.lineTo(x + w, y + h - r); c.quadraticCurveTo(x + w, y + h, x + w - r, y + h); c.lineTo(x + r, y + h);
  c.quadraticCurveTo(x, y + h, x, y + h - r); c.lineTo(x, y + r); c.quadraticCurveTo(x, y, x + r, y); c.closePath();
}

// A hand-drawn version of a rounded rectangle: the outline wanders by a pixel or two.
function wobblyRect(c, x, y, w, h, r, rand, amp) {
  const pts = [];
  const steps = 120;
  for (let i = 0; i <= steps; i++) {
    const t = i / steps, p = 2 * (w + h);
    let d = t * p, px, py;
    if (d < w) { px = x + d; py = y; }
    else if (d < w + h) { px = x + w; py = y + (d - w); }
    else if (d < 2 * w + h) { px = x + w - (d - w - h); py = y + h; }
    else { px = x; py = y + h - (d - 2 * w - h); }
    // pull corners in a little toward the rounded shape
    const cx = Math.min(Math.max(px, x + r), x + w - r), cy = Math.min(Math.max(py, y + r), y + h - r);
    const dx = px - cx, dy = py - cy, len = Math.hypot(dx, dy) || 1;
    if (len > r) { px = cx + dx / len * r; py = cy + dy / len * r; }
    pts.push([px + (rand() - 0.5) * amp, py + (rand() - 0.5) * amp]);
  }
  c.beginPath(); c.moveTo(pts[0][0], pts[0][1]);
  for (const [px, py] of pts.slice(1)) c.lineTo(px, py);
  c.closePath();
}

function texture(c, s, rand) {
  if (s.texture === 'bokeh') {
    for (let i = 0; i < 26; i++) {
      const x = rand() * W, y = 150 + rand() * 700, r = 20 + rand() * 60;
      const g = c.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, 'rgba(242,181,68,0.22)'); g.addColorStop(1, 'rgba(242,181,68,0)');
      c.fillStyle = g; c.beginPath(); c.arc(x, y, r, 0, 7); c.fill();
    }
    const v = c.createRadialGradient(W / 2, H / 2, 300, W / 2, H / 2, 1300);
    v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.55)');
    c.fillStyle = v; c.fillRect(0, 0, W, H);
  } else if (s.texture === 'paper') {
    c.strokeStyle = 'rgba(90,120,170,0.18)'; c.lineWidth = 2;
    for (let y = 120; y < H; y += 56) { c.beginPath(); c.moveTo(0, y); c.lineTo(W, y); c.stroke(); }
    c.strokeStyle = 'rgba(217,67,47,0.25)'; c.beginPath(); c.moveTo(130, 0); c.lineTo(130, H); c.stroke();
    grain(c, rand, 0.06, 'rgba(60,40,20,1)');
  } else if (s.texture === 'blob') {
    const g = c.createRadialGradient(820, 260, 0, 820, 260, 520);
    g.addColorStop(0, 'rgba(255,90,95,0.18)'); g.addColorStop(1, 'rgba(255,90,95,0)');
    c.fillStyle = g; c.fillRect(0, 0, W, H);
    const g2 = c.createRadialGradient(200, 1500, 0, 200, 1500, 600);
    g2.addColorStop(0, 'rgba(31,143,255,0.14)'); g2.addColorStop(1, 'rgba(31,143,255,0)');
    c.fillStyle = g2; c.fillRect(0, 0, W, H);
  } else if (s.texture === 'grid') {
    c.strokeStyle = 'rgba(34,227,255,0.10)'; c.lineWidth = 1;
    for (let x = 0; x < W; x += 60) { c.beginPath(); c.moveTo(x, 0); c.lineTo(x, H); c.stroke(); }
    for (let y = 0; y < H; y += 60) { c.beginPath(); c.moveTo(0, y); c.lineTo(W, y); c.stroke(); }
    const g = c.createRadialGradient(900, 200, 0, 900, 200, 700);
    g.addColorStop(0, 'rgba(255,45,149,0.28)'); g.addColorStop(1, 'rgba(255,45,149,0)');
    c.fillStyle = g; c.fillRect(0, 0, W, H);
    const g2 = c.createRadialGradient(150, 1700, 0, 150, 1700, 700);
    g2.addColorStop(0, 'rgba(34,227,255,0.22)'); g2.addColorStop(1, 'rgba(34,227,255,0)');
    c.fillStyle = g2; c.fillRect(0, 0, W, H);
  } else if (s.texture === 'chalk') {
    grain(c, rand, 0.10, 'rgba(255,255,255,1)');
    for (let i = 0; i < 6; i++) {
      const x = rand() * W, y = rand() * H;
      const g = c.createRadialGradient(x, y, 0, x, y, 260);
      g.addColorStop(0, 'rgba(255,255,255,0.05)'); g.addColorStop(1, 'rgba(255,255,255,0)');
      c.fillStyle = g; c.fillRect(0, 0, W, H);
    }
  }
}

function grain(c, rand, alpha, color) {
  c.save(); c.globalAlpha = alpha; c.fillStyle = color;
  for (let i = 0; i < 26000; i++) c.fillRect(rand() * W, rand() * H, 2, 2);
  c.restore();
}

function stroke(c, s, color, width, rand) {
  c.strokeStyle = color; c.lineWidth = width; c.lineJoin = 'round'; c.lineCap = 'round';
  if (s.key === 'chalk') { c.setLineDash([3 + rand() * 4, 1 + rand() * 2]); } else c.setLineDash([]);
}

function bubble(c, s, rand, text, x, y, mine, font) {
  c.font = font;
  const pad = 26, w = c.measureText(text).width + pad * 2, h = 74;
  const bx = mine ? x - w : x;
  const fill = mine ? s.me : s.them;
  if (s.drawn) { wobblyRect(c, bx, y, w, h, 30, rand, 2.5); c.fillStyle = fill; c.fill(); stroke(c, s, s.bezel, 3, rand); c.stroke(); }
  else {
    roundRectPath(c, bx, y, w, h, 30);
    if (s.glow && mine) { c.save(); c.shadowColor = '#22e3ff'; c.shadowBlur = 24; c.fillStyle = fill; c.fill(); c.restore(); }
    else { c.fillStyle = fill; c.fill(); }
  }
  c.fillStyle = mine ? s.meText : s.themText; c.textBaseline = 'middle'; c.textAlign = 'left';
  c.fillText(text, bx + pad, y + h / 2 + 2);
  return { x: bx, y, w, h, textX: bx + pad };
}

function phone(c, s, rand) {
  const x = 230, y = 430, w = 620, h = 1080, r = 70;
  if (s.drawn) {
    wobblyRect(c, x, y, w, h, r, rand, 3); c.fillStyle = s.phone; c.fill(); stroke(c, s, s.bezel, 5, rand); c.stroke();
    wobblyRect(c, x + 22, y + 22, w - 44, h - 44, r - 20, rand, 2); c.fillStyle = s.screen; c.fill(); stroke(c, s, s.bezel, 2.5, rand); c.stroke();
  } else {
    c.save();
    if (s.glow) { c.shadowColor = s.bezel; c.shadowBlur = 50; }
    roundRectPath(c, x, y, w, h, r); c.fillStyle = s.phone; c.fill();
    c.restore();
    roundRectPath(c, x, y, w, h, r); c.strokeStyle = s.bezel; c.lineWidth = s.glow ? 3 : 6; c.setLineDash([]); c.stroke();
    roundRectPath(c, x + 22, y + 22, w - 44, h - 44, r - 20); c.fillStyle = s.screen; c.fill();
  }
  // header: name + status
  c.setLineDash([]);
  c.font = `700 30px ${s.cap}`; c.fillStyle = s.ink; c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillText('Jess', x + w / 2, y + 86);
  c.font = `400 22px ${s.cap}`; c.fillStyle = s.quiet; c.fillText('Active now', x + w / 2, y + 122);
  c.strokeStyle = s.quiet; c.globalAlpha = 0.35; c.lineWidth = 1.5;
  c.beginPath(); c.moveTo(x + 40, y + 150); c.lineTo(x + w - 40, y + 150); c.stroke(); c.globalAlpha = 1;
  // input bar at the bottom
  roundRectPath(c, x + 50, y + h - 100, w - 100, 56, 28); c.strokeStyle = s.quiet; c.globalAlpha = 0.5; c.lineWidth = 2; c.stroke(); c.globalAlpha = 1;
  c.font = `400 24px ${s.cap}`; c.fillStyle = s.quiet; c.textAlign = 'left'; c.fillText('iMessage', x + 76, y + h - 72);
  return { x, y, w, h };
}

function marker(c, s, rand, cx, cy, r) {
  c.save();
  if (s.glow) { c.shadowColor = s.accent; c.shadowBlur = 20; }
  c.strokeStyle = s.accent; c.lineWidth = 7; c.lineCap = 'round'; c.setLineDash([]);
  c.beginPath();
  for (let i = 0; i <= 64; i++) {
    const a = -0.6 + i / 64 * (Math.PI * 2 + 0.9), rr = r * (1 + (rand() - 0.5) * 0.12);
    const px = cx + Math.cos(a) * rr * 1.15, py = cy + Math.sin(a) * rr;
    if (i === 0) c.moveTo(px, py); else c.lineTo(px, py);
  }
  c.stroke(); c.restore();
}

function arrow(c, s, rand, x1, y1, x2, y2) {
  c.save();
  if (s.glow) { c.shadowColor = s.accent; c.shadowBlur = 16; }
  c.strokeStyle = s.accent; c.lineWidth = 6; c.lineCap = 'round'; c.setLineDash([]);
  c.beginPath(); c.moveTo(x1, y1);
  c.quadraticCurveTo((x1 + x2) / 2 + 40, (y1 + y2) / 2 + (rand() - 0.5) * 40, x2, y2); c.stroke();
  const a = Math.atan2(y2 - y1, x2 - x1 - 40);
  c.beginPath(); c.moveTo(x2, y2); c.lineTo(x2 - 26 * Math.cos(a - 0.5), y2 - 26 * Math.sin(a - 0.5));
  c.moveTo(x2, y2); c.lineTo(x2 - 26 * Math.cos(a + 0.5), y2 - 26 * Math.sin(a + 0.5)); c.stroke();
  c.restore();
}

function sticker(c, s, text) {
  c.font = `700 30px ${s.cap}`;
  const w = c.measureText(text).width + 48, x = 60, y = 70, h = 60;
  roundRectPath(c, x, y, w, h, 30);
  if (s.key === 'clean') { c.fillStyle = '#111'; c.fill(); c.fillStyle = '#fff'; }
  else if (s.key === 'notebook') { c.fillStyle = 'rgba(217,67,47,0.12)'; c.fill(); c.strokeStyle = s.accent; c.lineWidth = 3; c.setLineDash([]); c.stroke(); c.fillStyle = s.accent; }
  else { c.strokeStyle = s.accent; c.lineWidth = 3; c.setLineDash([]); c.stroke(); c.fillStyle = s.accent; }
  c.textAlign = 'left'; c.textBaseline = 'middle'; c.fillText(text, x + 24, y + h / 2 + 2);
}

function hookText(c, s, rand, text) {
  const font = `700 ${s.cap === 'Kalam' ? 118 : 124}px ${s.cap}`;
  c.font = font; c.textAlign = 'center'; c.textBaseline = 'middle';
  const w = c.measureText(text).width;
  if (s.key === 'notebook') { // highlighter swipe under the words
    c.save(); c.globalAlpha = 0.55; c.fillStyle = '#ffe14d'; c.beginPath();
    c.moveTo(W / 2 - w / 2 - 10, 300); c.lineTo(W / 2 + w / 2 + 10, 292); c.lineTo(W / 2 + w / 2 + 6, 346); c.lineTo(W / 2 - w / 2 - 14, 352); c.closePath(); c.fill(); c.restore();
  }
  c.save();
  if (s.glow) { c.shadowColor = '#22e3ff'; c.shadowBlur = 30; }
  if (s.key === 'midnight' || s.key === 'clean') { c.shadowColor = 'rgba(0,0,0,0.5)'; c.shadowBlur = s.key === 'midnight' ? 24 : 0; }
  c.fillStyle = s.ink; c.fillText(text, W / 2, 310); c.restore();
}

function caption(c, s, words, hi) {
  c.font = `700 62px ${s.cap}`; c.textBaseline = 'middle';
  const gap = 18, widths = words.map(w => c.measureText(w).width);
  let x = W / 2 - (widths.reduce((a, b) => a + b, 0) + gap * (words.length - 1)) / 2;
  const y = 1640;
  // scrim for the dark styles, paper tag for the light ones
  if (s.key === 'midnight' || s.key === 'neon') { c.fillStyle = 'rgba(0,0,0,0.35)'; roundRectPath(c, x - 36, y - 56, W - 2 * (x - 36), 112, 28); c.fill(); }
  c.textAlign = 'left';
  words.forEach((w, i) => {
    c.save();
    if (s.key === 'midnight' || s.key === 'neon') { c.shadowColor = 'rgba(0,0,0,0.8)'; c.shadowBlur = 10; }
    c.fillStyle = i === hi ? s.accent : s.ink;
    c.fillText(w, x, y); c.restore();
    x += widths[i] + gap;
  });
}

function drawStyle(canvas, s) {
  const c = canvas.getContext('2d');
  const rand = rng(11);
  const g = c.createLinearGradient(0, 0, 0, H); g.addColorStop(0, s.bg[0]); g.addColorStop(1, s.bg[1]);
  c.fillStyle = g; c.fillRect(0, 0, W, H);
  texture(c, s, rand);
  sticker(c, s, 'TEXTING, DECODED · 1/7');
  hookText(c, s, rand, 'ok  vs  ok.');
  const p = phone(c, s, rand);
  const font = `400 34px ${s.cap === 'Kalam' ? 'Kalam' : 'Baloo'}`;
  c.font = `400 22px ${s.cap}`; c.fillStyle = s.quiet; c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillText('Today 6:40 PM', p.x + p.w / 2, p.y + 330);
  bubble(c, s, rand, 'hey, dinner tonight?', p.x + p.w - 50, p.y + 370, true, font);
  bubble(c, s, rand, 'yes!! 7 at the usual place', p.x + 50, p.y + 470, false, font);
  c.font = `400 22px ${s.cap}`; c.fillStyle = s.quiet; c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillText('Today 7:12 PM', p.x + p.w / 2, p.y + 620);
  bubble(c, s, rand, 'can we push to 8? running late', p.x + p.w - 50, p.y + 660, true, font);
  const b = bubble(c, s, rand, 'ok.', p.x + 50, p.y + 760, false, font);
  // the period: measure "ok" to find it, circle it, label it
  c.font = font;
  const okW = c.measureText('ok').width, dotW = c.measureText('.').width;
  const cx = b.textX + okW + dotW / 2, cy = b.y + b.h / 2 + 8;
  marker(c, s, rand, cx, cy, 34);
  c.font = `700 44px ${s.hand}`; c.fillStyle = s.accent; c.textAlign = 'left'; c.textBaseline = 'middle';
  c.save(); if (s.glow) { c.shadowColor = s.accent; c.shadowBlur = 14; }
  c.translate(p.x + 300, p.y + 870); c.rotate(-0.06); c.fillText('the period.', 0, 0); c.restore();
  arrow(c, s, rand, p.x + 290, p.y + 855, cx + 42, cy + 12);
  caption(c, s, ["'ok.'", 'With', 'the', 'period.'], 3);
}

window.renderStyle = function (n) {
  const single = document.getElementById('single'); single.innerHTML = '';
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H; single.appendChild(cv);
  drawStyle(cv, STYLES[n - 1]);
};

window.renderSheet = function () {
  const sheet = document.getElementById('sheet'); sheet.innerHTML = '';
  STYLES.forEach((s) => {
    const card = document.createElement('div'); card.className = 'card';
    const cv = document.createElement('canvas'); cv.width = W; cv.height = H; card.appendChild(cv);
    const l = document.createElement('div'); l.className = 'label'; l.textContent = s.name; card.appendChild(l);
    const sub = document.createElement('div'); sub.className = 'sub'; sub.textContent = s.sub; card.appendChild(sub);
    sheet.appendChild(card);
    drawStyle(cv, s);
  });
};
window.STYLES = STYLES;
</script>
</body></html>
