[project]
name = "animation-agent"
version = "0.0.1"
description = "An agent that researches animation styles, finds what goes viral, and explains why it works."
requires-python = ">=3.11"
dependencies = [
    "langchain-core>=1.0",
    "langgraph>=1.0",
    "langsmith>=0.4",
    "claude-agent-sdk>=0.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "typer>=0.12",
    "yt-dlp[default]>=2025.10",
]

[project.optional-dependencies]
# Each extra is one alternative LLM provider. Install only what you use:
#   uv sync --extra anthropic
anthropic = ["langchain-anthropic>=1.0"]
gemini = ["langchain-google-genai>=2.0"]
ollama = ["langchain-ollama>=0.3"]
dev = ["pytest>=8.0"]

[project.scripts]
anim = "animation_agent.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/animation_agent"]
