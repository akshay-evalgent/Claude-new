<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>chatvid imsg</title>
<link rel="stylesheet" href="imsg.css">
</head>
<body>
<div id="frame">
  <div id="phone">
    <div id="status"><span id="clock"></span><span id="icons"><i class="sig"></i><i class="wifi"></i><i class="bat"></i></span></div>
    <div id="head"><div id="back"><span class="chev"></span><span id="unread"></span></div><div id="cAv"></div><div id="cName"></div><div id="vid"></div></div>
    <div id="thread"><div id="msgs"></div></div>
    <div id="bar"><div id="plus">+</div><div id="field"><span id="ph">iMessage</span><span id="typed"></span><span id="caret"></span><span id="mic"></span><span id="sendBtn">↑</span></div></div>
    <div id="kb"></div>
    <div id="picker"><div id="pkHead"><span id="pkX">✕</span>Photos</div><div id="pkGrid"></div></div>
    <div id="pop"></div>
  </div>
  <div id="tool">
    <div id="tStatus"><span id="tClock"></span><span id="tIcons"><i class="sig"></i><i class="wifi"></i><i class="bat"></i></span></div>
    <div id="tHead"><span class="tBack"></span><span id="tTitle">New video</span><span id="tCredits">100 credits</span></div>
    <div id="tCard"><img id="tImg" alt=""><div id="tShim"></div><div id="tGen"><div id="tPct"></div><div id="tBar"><i></i></div></div><div id="tBadge">▶ 0:05</div><div id="tDim"></div><div id="tFlash"></div></div>
    <div id="tPill"><span class="tBack2"></span><span id="tPillTxt"></span></div>
    <div id="tGenCard"><div id="tLogo"></div><div class="gTitle">Generating scene</div><div id="tStep"></div><div id="tGenBar"><i></i></div><div class="gCancel">Cancel</div></div>
    <div id="tBox"><div id="tPrompt"><span id="tPh">Describe your video…</span><span id="tTyped"></span><span id="tCaret"></span></div><div id="tGo">➜</div></div>
    <div id="tKb"></div>
    <div id="tPop"></div>
  </div>
  <div id="nb"><div id="nbCard"><img id="nbImg" alt=""><div id="nbTx"><div id="nbTop"><span id="nbName"></span><span id="nbTime">now</span></div><div id="nbText"></div></div></div><div id="nbTag"></div></div>
  <div id="hook"><img id="hookImg" alt=""><div id="hookCap"></div></div>
  <div id="flash"></div>
</div>
<script src="imsg.js"></script>
</body>
</html>
