<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>chatvid stage</title>
<link rel="stylesheet" href="stage.css">
</head>
<body>
<div id="frame">
  <div id="world">
    <div id="wall"></div>
    <div class="beam b1"></div><div class="beam b2"></div><div class="beam b3"></div>
    <div id="wallLogo"><span id="wlTop"></span><span id="wlMain"></span><svg id="wlSpin" viewBox="0 0 60 60"><circle cx="30" cy="30" r="22"/></svg></div>
    <div id="sign"></div>
    <div id="floor"></div>
    <div id="platform"></div>
    <div id="mic"><i></i></div>
    <div id="badge"><small>SELF-RATING</small><b id="badgeN"></b></div>
    <div id="chars"></div>
    <div id="paddles"></div>
    <div id="desk"><div id="deskTop"></div><div id="deskLed"></div><div id="plates"></div></div>
    <div id="spinner"><svg viewBox="0 0 200 200"><circle cx="100" cy="100" r="86"/></svg><div id="spinText"></div></div>
    <div id="crowd"></div>
  </div>
  <div id="confetti"></div>
  <div id="hook"></div>
  <div id="bug"><b id="bugName"></b><span id="bugEp"></span></div>
  <div id="hud"><div id="hudSelf"></div><div id="hudBleep"></div></div>
  <div id="banner"></div>
  <div id="grid"><div id="gridHead"><small id="gridSmall"></small><b id="gridBig"></b></div><div id="gridTiles"></div><div id="gridFoot"></div><div id="gridStamp"></div></div>
  <div id="popup"></div>
  <div id="feed"></div>
  <div id="verdict"><div class="vbox" id="vSelf"><small>SELF-RATING</small><b id="vSelfN"></b></div><div id="vVs">VS</div>
    <div class="vbox" id="vJudge"><small>JUDGES</small><b id="vJudgeN"></b></div><div id="vStamp"></div></div>
  <div id="third"><b id="thirdName"></b><span id="thirdRole"></span></div>
  <div id="subs"><span id="subWho"></span><span id="subText"></span></div>
  <div id="title"></div>
  <div id="endcard"><div id="ecKicker"></div><div id="ecText"></div><div id="ecSub"></div></div>
  <div id="flash"></div>
</div>
<script src="puppets.js"></script>
<script src="stage.js"></script>
</body>
</html>
