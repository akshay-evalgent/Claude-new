<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>prank channel kit</title>
<style>
  /* Channel art for the AI-prank texting channel: ?mode=avatar|banner&name=...&guides=1 */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #000; font-family: "Inter", sans-serif; -webkit-font-smoothing: antialiased; }
  #avatar { width: 800px; height: 800px; position: relative; overflow: hidden; display: none; }
  #avatar img { width: 100%; height: 100%; object-fit: cover; filter: saturate(1.08) contrast(1.04); }
  #banner { width: 2560px; height: 1440px; position: relative; overflow: hidden; display: none; background: #1b1d22; }
  .bgL, .bgR { position: absolute; top: -60px; bottom: -60px; width: 1560px; background-size: cover; background-position: center 60%; filter: blur(14px) brightness(.62) saturate(1.1); }
  .bgL { left: -60px; background-image: url(bg-snow.jpg); }
  .bgR { right: -60px; background-image: url(bg-dogs.jpg); -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 420px); }
  .fade { position: absolute; inset: 0; background: radial-gradient(ellipse 60% 70% at 50% 50%, rgba(0,0,0,.15), rgba(0,0,0,.55)); }
  /* the safe area every device shows: 1546x423 in the centre */
  #safe { position: absolute; left: 507px; top: 508px; width: 1546px; height: 423px; display: flex; align-items: center; justify-content: space-between; }
  #safe.guides { outline: 4px dashed #ff3b30; }
  .chat { width: 400px; flex: none; display: flex; flex-direction: column; gap: 10px; }
  .b { max-width: 400px; width: fit-content; padding: 13px 22px 15px; border-radius: 32px; font: 400 28px/1.25 "Inter", sans-serif; letter-spacing: -.2px; }
  .me { align-self: flex-end; background: #1d8cf8; color: #fff; border-bottom-right-radius: 10px; }
  .them { align-self: flex-start; background: #e9e9eb; color: #000; border-bottom-left-radius: 10px; }
  .who { font: 600 22px/1 "Inter", sans-serif; color: rgba(255,255,255,.75); margin: 0 0 2px 14px; }
  .mid { text-align: center; color: #fff; flex: 1; padding: 0 40px; }
  .name { font: 800 132px/1 "Inter", sans-serif; letter-spacing: -4px; text-shadow: 0 6px 30px rgba(0,0,0,.45); }
  .tag { margin-top: 22px; white-space: nowrap; font: 500 31px/1.3 "Inter", sans-serif; color: rgba(255,255,255,.92); text-shadow: 0 3px 16px rgba(0,0,0,.5); }
  .pill { display: inline-block; margin-top: 26px; padding: 10px 26px 12px; border-radius: 40px; background: #ff3b30; font: 700 30px/1 "Inter", sans-serif; color: #fff; }
</style>
</head>
<body>
<div id="avatar"><img src="max-src.png" alt=""></div>
<div id="banner">
  <div class="bgL"></div><div class="bgR"></div><div class="fade"></div>
  <div id="safe">
    <div class="chat">
      <div class="b me">dad the snow guy is here</div>
      <div class="b me">he called his cousin to help</div>
      <div class="who">Dad</div>
      <div class="b them">WHY ARE THERE TEN MEN ON MY DRIVEWAY</div>
    </div>
    <div class="mid"><div class="name" id="nm"></div><div class="tag" id="tg"></div><div class="pill" id="pl"></div></div>
    <div class="chat">
      <div class="b me">dad i got max a dog walker</div>
      <div class="who">Dad</div>
      <div class="b them">BRING MY DOG BACK</div>
      <div class="b me">which one</div>
    </div>
  </div>
</div>
<script>
  const q = new URLSearchParams(location.search);
  document.getElementById(q.get('mode') || 'banner').style.display = 'block';
  document.getElementById('nm').textContent = q.get('name') || 'sorry dad';
  document.getElementById('tg').textContent = q.get('tag') || "texting my dad things that aren't happening";
  document.getElementById('pl').textContent = q.get('pill') || 'new prank every day';
  if (q.get('guides')) document.getElementById('safe').classList.add('guides');
  document.body.dataset.ready = '1';
</script>
</body>
</html>
