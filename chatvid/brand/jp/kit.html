<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>jordan's phone kit</title>
<style>
  /* Channel art for "jordan's phone": ?mode=avatar|banner|watermark&guides=1 */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: transparent; font-family: "Inter", sans-serif; -webkit-font-smoothing: antialiased; }
  .mode { display: none; position: relative; overflow: hidden; }
  /* the brand mark: the "someone is typing" bubble */
  .typing { display: flex; align-items: center; justify-content: center; gap: 13%; background: #e9e9eb; border-radius: 999px; position: relative; }
  .typing i { display: block; border-radius: 50%; background: #8e8e93; }
  .typing::after { content: ""; position: absolute; left: 6%; bottom: -5%; width: 18%; height: 30%; border-radius: 50%; background: #e9e9eb; }
  .typing::before { content: ""; position: absolute; left: -2%; bottom: -14%; width: 9%; height: 15%; border-radius: 50%; background: #e9e9eb; }
  #avatar { width: 800px; height: 800px; background: radial-gradient(circle at 30% 25%, #3aa0ff, #0a5fd8 70%); }
  #avatar .typing { position: absolute; left: 140px; top: 270px; width: 520px; height: 260px; box-shadow: 0 18px 40px rgba(0,0,0,.25); }
  #avatar .typing i { width: 78px; height: 78px; }
  #avatar .typing i:nth-child(1) { opacity: .55; } #avatar .typing i:nth-child(3) { opacity: .8; }
  #avatar .rec { position: absolute; left: 50%; top: 610px; transform: translateX(-50%); padding: 10px 34px 14px; border-radius: 40px; background: #ff3b30; color: #fff; font: 700 54px/1 "Inter", sans-serif; }
  #watermark { width: 150px; height: 150px; background: transparent; }
  #watermark .typing { position: absolute; left: 12px; top: 38px; width: 126px; height: 66px; box-shadow: 0 2px 8px rgba(0,0,0,.35); }
  #watermark .typing i { width: 18px; height: 18px; }
  #banner { width: 2560px; height: 1440px; background: radial-gradient(ellipse 70% 80% at 30% 30%, #34306e, transparent), radial-gradient(ellipse 60% 70% at 80% 75%, #0c5a8f, transparent), #111322; }
  #safe { position: absolute; left: 507px; top: 508px; width: 1546px; height: 423px; display: flex; align-items: center; justify-content: space-between; }
  #safe.guides { outline: 4px dashed #ff3b30; }
  .col { width: 440px; display: flex; flex-direction: column; gap: 12px; }
  .note { display: flex; gap: 16px; align-items: center; padding: 14px 18px; border-radius: 26px; background: rgba(245,245,250,.86); backdrop-filter: blur(12px); box-shadow: 0 8px 24px rgba(0,0,0,.3); }
  .note img { width: 66px; height: 66px; border-radius: 50%; object-fit: cover; flex: none; }
  .note .tx { flex: 1; min-width: 0; }
  .note .who { display: flex; justify-content: space-between; font: 700 23px/1.2 "Inter", sans-serif; color: #111; }
  .note .who span { font-weight: 500; color: #8e8e93; font-size: 20px; }
  .note .msg { font: 500 23px/1.25 "Inter", sans-serif; color: #222; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mid { flex: 1; text-align: center; color: #fff; padding: 0 30px; }
  .mid .typing { width: 120px; height: 58px; margin: 0 auto 22px; }
  .mid .typing i { width: 16px; height: 16px; }
  .name { white-space: nowrap; font: 800 92px/1 "Inter", sans-serif; letter-spacing: -3px; text-shadow: 0 6px 30px rgba(0,0,0,.4); }
  .tag { margin-top: 18px; font: 500 28px/1.3 "Inter", sans-serif; color: rgba(255,255,255,.9); white-space: nowrap; }
  .pill { display: inline-block; margin-top: 22px; padding: 9px 24px 11px; border-radius: 40px; background: #ff3b30; font: 700 26px/1 "Inter", sans-serif; color: #fff; }
</style>
</head>
<body>
<div class="mode" id="avatar"><div class="typing"><i></i><i></i><i></i></div><div class="rec">● REC</div></div>
<div class="mode" id="watermark"><div class="typing"><i></i><i></i><i></i></div></div>
<div class="mode" id="banner">
  <div id="safe">
    <div class="col" id="left"></div>
    <div class="mid"><div class="typing"><i></i><i></i><i></i></div><div class="name" id="nm"></div><div class="tag" id="tg"></div><div class="pill" id="pl"></div></div>
    <div class="col" id="right"></div>
  </div>
</div>
<script>
  const q = new URLSearchParams(location.search);
  const N = [
    ['dad', 'Dad (Driveway Police)', 'WHO IS PAYING FOR THIS'],
    ['gf', 'Maya', 'JORDAN. ANSWER. ME.'],
    ['boss', 'Gary (Boss)', 'Per my last message.'],
    ['mom', 'Mom', 'Please call me.'],
    ['agent', 'Agent Miller', 'This is going in the report.'],
    ['grandma', 'Grandma Rosa', 'CAN I RIDE IT'],
  ];
  const card = ([id, who, msg], i) => `<div class="note"><img src="../../cast/photos/${id}.jpg"><div class="tx"><div class="who">${who}<span>${['now', '1m', '2m'][i % 3]}</span></div><div class="msg">${msg}</div></div></div>`;
  document.getElementById('left').innerHTML = N.slice(0, 3).map(card).join('');
  document.getElementById('right').innerHTML = N.slice(3).map(card).join('');
  document.getElementById(q.get('mode') || 'banner').style.display = 'block';
  document.getElementById('nm').textContent = q.get('name') || "jordan's phone";
  document.getElementById('tg').textContent = q.get('tag') || 'everyone in my contacts is having a bad day';
  document.getElementById('pl').textContent = q.get('pill') || 'new screen recording every day';
  if (q.get('guides')) document.getElementById('safe').classList.add('guides');
  Promise.all([...document.images].map((im) => im.decode().catch(() => {}))).then(() => { document.body.dataset.ready = '1'; });
</script>
</body>
</html>
