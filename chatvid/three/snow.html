<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>snow scene</title>
<style>
  html, body { margin: 0; background: #000; overflow: hidden; }
  #wrap { position: relative; display: inline-block; }
  /* phone-camera look: grain, soft edges, a touch of blur */
  canvas { display: block; filter: contrast(1.04) saturate(.92) blur(.35px); }
  #grain { position: absolute; inset: 0; opacity: .07; mix-blend-mode: overlay; pointer-events: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
  #vig { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at center, rgba(0,0,0,0) 60%, rgba(0,0,0,.28) 100%); }
</style>
</head>
<body>
<div id="wrap"><div id="grain"></div><div id="vig"></div></div>
<script type="module" src="snow.js"></script>
</body>
</html>
