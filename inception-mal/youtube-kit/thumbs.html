<!doctype html><meta charset="utf-8">
<style>
html,body{margin:0;background:#000}
#t{position:relative;width:1280px;height:720px;overflow:hidden;font-family:Inter,sans-serif;font-weight:900;color:#fff;background:#07080c}
#t>*{position:absolute}
.ph{top:0;width:640px;height:720px;background-repeat:no-repeat;background-color:#07080c}
.leo{left:0;background-image:url(src/leo2.jpg);background-size:1500px auto;background-position:-419px -129px}
.mar{left:640px;background-image:url(src/mar2.jpg);background-size:600px auto;background-position:93px -152px}
.tint{top:0;width:640px;height:720px;mix-blend-mode:multiply}
.seam{left:490px;top:0;width:300px;height:720px;background:linear-gradient(90deg,rgba(7,8,12,0),rgba(7,8,12,.96) 42%,rgba(7,8,12,.96) 58%,rgba(7,8,12,0))}
.vig{inset:0;background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 45%,rgba(0,0,0,.7) 100%)}
.bot{left:0;right:0;bottom:0;height:330px;background:linear-gradient(0deg,rgba(0,0,0,.92),rgba(0,0,0,0))}
.big{left:0;right:0;text-align:center;line-height:.95;letter-spacing:-2px;-webkit-text-stroke:16px #000;paint-order:stroke fill;text-transform:uppercase}
.y{color:#ffd400}.r{color:#ff3b47}
.tag{font-size:44px;padding:8px 22px;border-radius:10px;letter-spacing:1px;text-transform:uppercase}
svg{overflow:visible}
</style>
<div id="t"></div>
<script>
const v = +new URLSearchParams(location.search).get('v') || 1, t = document.getElementById('t');
const spinTop = (x, y, s, rot = 0) => `<svg style="left:${x}px;top:${y}px;transform:rotate(${rot}deg) scale(${s});transform-origin:0 0;filter:drop-shadow(0 18px 26px rgba(0,0,0,.8))" width="200" height="260" viewBox="0 0 200 260"><defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#6d7480"/><stop offset=".35" stop-color="#f4f6fa"/><stop offset=".6" stop-color="#aab2be"/><stop offset="1" stop-color="#4a505a"/></linearGradient></defs><rect x="92" y="0" width="16" height="70" rx="5" fill="url(#g)"/><polygon points="100,52 172,96 28,96" fill="url(#g)"/><rect x="18" y="94" width="164" height="22" rx="8" fill="url(#g)"/><polygon points="24,116 176,116 100,250" fill="url(#g)"/></svg>`;
const faces = (lf, rf, lt, rt) => `<div class="ph leo" style="filter:${lf}"></div><div class="ph mar" style="filter:${rf}"></div><div class="tint" style="left:0;background:${lt}"></div><div class="tint" style="left:640px;background:${rt}"></div><div class="seam"></div><div class="vig"></div><div class="bot"></div>`;
const G = 'contrast(1.2) saturate(.85) brightness(1.35)';
const arrow = (x, y, rot, col = '#ffd400') => `<svg style="left:${x}px;top:${y}px;transform:rotate(${rot}deg)" width="150" height="90" viewBox="0 0 150 90"><path d="M5 45 H105 M75 12 L112 45 L75 78" stroke="#000" stroke-width="30" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 45 H105 M75 12 L112 45 L75 78" stroke="${col}" stroke-width="16" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const V = {
  1: () => faces(G, G, '#b9d2ff', '#ffb8aa') + spinTop(560, 150, 0.82) + `<div class="big" style="bottom:36px;font-size:150px"><span class="y">She was right.</span></div>`,
  2: () => faces(G, G, '#c4d8ff', '#ffc6b6') + `<div class="tag" style="left:40px;top:34px;background:#1f6fff">Asleep</div><div class="tag" style="right:40px;top:34px;background:#ff3b47">Awake</div>` + arrow(60, 130, 40, '#1f6fff') + arrow(1070, 130, 140, '#ff3b47') + `<div class="big" style="bottom:40px;font-size:128px">Who's <span class="y">dreaming?</span></div>`,
  3: () => faces('grayscale(1) contrast(1.3) brightness(1.25)', 'grayscale(1) contrast(1.3) brightness(1.05)', '#ffffff', '#ffffff') + spinTop(575, 190, 0.7, 62) + `<div class="tag" style="left:50%;top:40px;transform:translateX(-50%) rotate(-3deg);background:#ffd400;color:#000;font-size:50px">16 years later</div><div class="big" style="bottom:36px;font-size:138px">It <span class="r">never</span> fell</div>`,
  4: () => faces(G, G, '#b9d2ff', '#ffb8aa') + `<div style="left:500px;top:120px;width:280px;height:280px;border-radius:50%;overflow:hidden;border:10px solid #ffd400;background:url(src/malb.jpg) -402px -140px/960px auto;box-shadow:0 20px 50px #000"></div>` + arrow(770, 250, -150) + `<div class="big" style="bottom:36px;font-size:120px">Mal wasn't<br><span class="y">the villain</span></div>`,
  5: () => faces('contrast(1.25) saturate(.7) brightness(1.3)', 'contrast(1.2) saturate(.95) brightness(1.1)', '#a9c4ff', '#ffd0bc') + spinTop(545, 120, 1.0) + `<div style="left:612px;top:0;width:56px;height:720px;background:repeating-linear-gradient(180deg,#ffd400 0 40px,#000 40px 80px);opacity:.0"></div><div class="big" style="bottom:150px;font-size:76px;letter-spacing:6px;-webkit-text-stroke:12px #000">Inception</div><div class="big" style="bottom:30px;font-size:116px"><span class="y">the other ending</span></div>`,
};
t.innerHTML = V[v]();
document.fonts.load('900 100px Inter').then(() => window.READY = true);
</script>
