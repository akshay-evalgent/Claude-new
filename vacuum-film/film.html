<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Torn Spacesuit</title>
<style>
  @font-face { font-family: 'Anton'; src: url(assets/anton.woff2) format('woff2'); }
  @font-face { font-family: 'Barlow Condensed'; font-weight: 600; src: url(assets/barlow600.woff2) format('woff2'); }
  @font-face { font-family: 'Barlow Condensed'; font-weight: 700; src: url(assets/barlow700.woff2) format('woff2'); }
  @font-face { font-family: 'JetBrains Mono'; font-weight: 100 800; src: url(assets/jbmono.woff2) format('woff2'); }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #stage { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: hidden; background: #000; transform-origin: 0 0; color: #fff;
    font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; }
  #stage > * { position: absolute; }
  #gl { left: 0; top: 0; width: 1080px; height: 1920px; }
  .full { inset: 0; pointer-events: none; }
  #vig { background: radial-gradient(ellipse 75% 60% at 50% 48%, rgba(0,0,0,0) 55%, rgba(0,0,0,0.55) 100%); }
  #pov { background:
      radial-gradient(ellipse 62% 44% at 50% 47%, rgba(0,0,0,0) 70%, rgba(6,8,12,0.75) 88%, rgba(3,4,6,0.98) 100%),
      linear-gradient(118deg, rgba(255,255,255,0) 30%, rgba(255,255,255,0.07) 38%, rgba(255,255,255,0) 46%); }
  #tunnel { background: #000; -webkit-mask-image: radial-gradient(circle at 50% 46%, transparent 0, transparent var(--r), #000 calc(var(--r) + 260px)); mask-image: radial-gradient(circle at 50% 46%, transparent 0, transparent var(--r), #000 calc(var(--r) + 260px)); }
  #port { left: 50%; top: 46%; width: 980px; height: 980px; margin: -490px 0 0 -490px; border-radius: 50%; box-sizing: border-box;
    border: 46px solid #6b6258; box-shadow: 0 0 0 1600px #0d0b09, inset 0 0 60px 20px rgba(0,0,0,0.85), 0 0 0 52px #3a342e; }
  #red { background: radial-gradient(ellipse at center, rgba(255,40,30,0.0) 35%, rgba(255,30,20,0.55) 100%); }
  #grain { opacity: 0.08; mix-blend-mode: overlay; background-size: 256px 256px; }
  #scr1, #scr2 { top: 0; bottom: 0; width: 2px; background: rgba(255,240,220,0.35); }
  #fade { background: #000; }
  #flash { background: #fff; }

  #cap { left: 60px; right: 60px; top: 1130px; text-align: center; font-weight: 700; font-size: 84px; line-height: 1.02; text-transform: uppercase;
    letter-spacing: 0.01em; -webkit-text-stroke: 14px #000; paint-order: stroke fill; text-shadow: 0 6px 18px rgba(0,0,0,0.55); }
  #cap span { display: inline-block; margin: 0 0.12em; }
  #cap span.on { color: #ffd54a; }
  .chip { font-family: 'JetBrains Mono', monospace; font-weight: 700; letter-spacing: 0.08em; color: #fff; background: rgba(8,12,18,0.72); border-radius: 14px; padding: 16px 26px; }
  #timer { left: 0; right: 0; top: 300px; text-align: center; }
  #timer div { display: inline-block; font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 92px; letter-spacing: 0.04em; padding: 6px 34px; border-radius: 18px; background: rgba(8,12,18,0.6); }
  #gauge { left: 50%; top: 300px; width: 560px; margin-left: -280px; }
  #gauge .l { font-size: 26px; color: #b9c6d4; }
  #gauge .v { font-size: 64px; margin: 4px 0 10px; }
  #gauge .b { height: 16px; border-radius: 8px; background: rgba(255,255,255,0.15); overflow: hidden; }
  #gauge .b i { display: block; height: 100%; background: #ff5b45; border-radius: 8px; }
  #press { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 34px; letter-spacing: 0.1em; color: #bfe6ff; text-shadow: 0 2px 10px #000; }
  #temp { left: 50%; top: 300px; width: 560px; margin-left: -280px; text-align: center; }
  #temp .l { font-size: 26px; color: #b9c6d4; }
  #temp .v { font-size: 70px; color: #7fe08a; }
  #yr { left: 0; right: 0; top: 300px; text-align: center; font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 46px; letter-spacing: 0.16em; color: #f4e7d2; text-shadow: 0 3px 14px #000; }
  #yr b { display: block; font-family: 'Anton', sans-serif; font-weight: 400; font-size: 190px; letter-spacing: 0.02em; line-height: 1.05; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="gl"></canvas>
  <div id="vig" class="full"></div>
  <div id="pov" class="full"></div>
  <div id="port"></div>
  <div id="red" class="full"></div>
  <div id="tunnel" class="full"></div>
  <div id="scr1"></div><div id="scr2"></div>
  <div id="grain" class="full"></div>
  <div id="press">AIR PRESSURE</div>
  <div id="gauge" class="chip"><div class="l">SUIT PRESSURE</div><div class="v" id="gv">4.3 PSI</div><div class="b"><i id="gb"></i></div></div>
  <div id="temp" class="chip"><div class="l">BODY TEMPERATURE</div><div class="v">37&deg;C</div></div>
  <div id="timer"><div id="tv">0:15</div></div>
  <div id="yr">HOUSTON, TEXAS<b>1966</b></div>
  <div id="cap"></div>
  <div id="fade" class="full"></div>
  <div id="flash" class="full"></div>
</div>

<script src="assets/three.min.js"></script>
<script>
'use strict';
// =====================================================================
//  helpers
// =====================================================================
const W = 1080, H = 1920, PI = Math.PI;
const clamp01 = x => Math.max(0, Math.min(1, x));
const seg = (t, a, b) => clamp01((t - a) / (b - a));
const eio = x => x * x * (3 - 2 * x);
const eo = x => 1 - Math.pow(1 - x, 3);
const ei = x => x * x * x;
const lerp = (a, b, k) => a + (b - a) * k;
const win = (t, a, b, fi = 0.3, fo = 0.3) => Math.min(seg(t, a, a + fi), 1 - seg(t, b - fo, b));
function rng(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) | 0; let r = Math.imul(s ^ (s >>> 15), 1 | s); r = (r + Math.imul(r ^ (r >>> 7), 61 | r)) ^ r; return ((r ^ (r >>> 14)) >>> 0) / 4294967296; }; }
const hash = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
function vnoise(x) { const i = Math.floor(x); let f = x - i; f = f * f * (3 - 2 * f); return lerp(hash(i), hash(i + 1), f) * 2 - 1; }
const $ = id => document.getElementById(id);
const V = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);
const lerpV = (a, b, k) => V(lerp(a[0], b[0], k), lerp(a[1], b[1], k), lerp(a[2], b[2], k));

const renderer = new THREE.WebGLRenderer({ canvas: $('gl'), antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H, false);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const camera = new THREE.PerspectiveCamera(46, W / H, 0.01, 30000);

function canvasTex(w, h, draw, repeat) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.anisotropy = 8;
  if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat[0], repeat[1]); }
  return t;
}
function noiseFill(g, w, h, base, amp, seed) {
  const r = rng(seed), d = g.createImageData(w, h);
  for (let i = 0; i < w * h; i++) { const v = (r() - 0.5) * amp; d.data[i * 4] = base[0] + v; d.data[i * 4 + 1] = base[1] + v; d.data[i * 4 + 2] = base[2] + v; d.data[i * 4 + 3] = 255; }
  g.putImageData(d, 0, 0);
}
const lathe = (pts, n) => new THREE.LatheGeometry(pts.map(p => new THREE.Vector2(Math.max(p[0], 1e-4), p[1])), n || 32);
const scaleGeo = (g, x, y, z) => { g.scale(x, y, z); g.computeVertexNormals(); return g; };
function limbGeo(r0, r1, len, rip, amp) { // hangs from the joint at y = 0 down to y = -len, with puffy fabric segments
  const P = [];
  for (let i = 0; i <= 6; i++) { const a = -PI / 2 + i / 6 * PI / 2; P.push([Math.cos(a) * r1, -len + Math.sin(a) * r1]); }
  for (let i = 1; i < 40; i++) { const f = i / 40; P.push([lerp(r1, r0, f) * (1 + amp * Math.pow(Math.sin(PI * f * rip), 2)), -len + len * f]); }
  for (let i = 0; i <= 6; i++) { const a = i / 6 * PI / 2; P.push([Math.cos(a) * r0, Math.sin(a) * r0]); }
  return lathe(P, 28);
}
function rbox(w, h, d, r) { const sh = new THREE.Shape(), x = -w / 2 + r, y = -h / 2 + r, ww = w - 2 * r, hh = h - 2 * r; sh.moveTo(x, y - r); sh.lineTo(x + ww, y - r); sh.quadraticCurveTo(x + ww + r, y - r, x + ww + r, y); sh.lineTo(x + ww + r, y + hh); sh.quadraticCurveTo(x + ww + r, y + hh + r, x + ww, y + hh + r); sh.lineTo(x, y + hh + r); sh.quadraticCurveTo(x - r, y + hh + r, x - r, y + hh); sh.lineTo(x - r, y); sh.quadraticCurveTo(x - r, y - r, x, y - r);
  const g = new THREE.ExtrudeGeometry(sh, { depth: d - 2 * r, bevelEnabled: true, bevelThickness: r, bevelSize: r * 0.9, bevelSegments: 4, curveSegments: 6 }); g.translate(0, 0, -(d - 2 * r) / 2); g.computeVertexNormals(); return g; }
function mesh(geo, mat, x = 0, y = 0, z = 0, shadow = true) { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.castShadow = m.receiveShadow = shadow; return m; }

// camera-facing particles
function Particles(n, additive) {
  const base = new THREE.PlaneGeometry(1, 1), g = new THREE.InstancedBufferGeometry();
  g.index = base.index; g.setAttribute('position', base.attributes.position); g.setAttribute('uv', base.attributes.uv);
  const off = new Float32Array(n * 4), col = new Float32Array(n * 4);
  g.setAttribute('aOff', new THREE.InstancedBufferAttribute(off, 4)); g.setAttribute('aCol', new THREE.InstancedBufferAttribute(col, 4)); g.instanceCount = n;
  const m = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, blending: additive ? THREE.AdditiveBlending : THREE.NormalBlending,
    vertexShader: 'attribute vec4 aOff; attribute vec4 aCol; varying vec2 vUv; varying vec4 vCol; void main(){ vUv = uv; vCol = aCol; vec4 mv = modelViewMatrix * vec4(aOff.xyz, 1.0); mv.xy += position.xy * aOff.w; gl_Position = projectionMatrix * mv; }',
    fragmentShader: 'varying vec2 vUv; varying vec4 vCol; void main(){ float r = length(vUv - 0.5) * 2.0; float a = smoothstep(1.0, 0.0, r); a *= a; gl_FragColor = vec4(vCol.rgb, vCol.a * a); }'
  });
  const meshP = new THREE.Mesh(g, m); meshP.frustumCulled = false; meshP.renderOrder = 10;
  return { mesh: meshP, n,
    set(i, p, size, r, gg, b, a) { const k = i * 4; off[k] = p.x; off[k + 1] = p.y; off[k + 2] = p.z; off[k + 3] = size; col[k] = r; col[k + 1] = gg; col[k + 2] = b; col[k + 3] = a; },
    hide(i) { off[i * 4 + 3] = 0; col[i * 4 + 3] = 0; },
    commit() { g.attributes.aOff.needsUpdate = true; g.attributes.aCol.needsUpdate = true; } };
}
function fresnelMat(hex, pw) {
  return new THREE.ShaderMaterial({ uniforms: { col: { value: new THREE.Color(hex) }, op: { value: 1 }, pw: { value: pw || 2.2 } }, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    vertexShader: 'varying vec3 vN; varying vec3 vV; void main(){ vec4 mv = modelViewMatrix * vec4(position, 1.0); vN = normalize(normalMatrix * normal); vV = normalize(-mv.xyz); gl_Position = projectionMatrix * mv; }',
    fragmentShader: 'uniform vec3 col; uniform float op, pw; varying vec3 vN; varying vec3 vV; void main(){ float f = pow(1.0 - abs(dot(normalize(vN), normalize(vV))), pw); gl_FragColor = vec4(col * (0.08 + f * 1.25) * op, 1.0); }' });
}
function envFrom(top, bottom, sunDir, sunCol) { // a soft sky as a cube map (painted per pixel, no prefiltering pass)
  const A = new THREE.Color(top), B = new THREE.Color(bottom), S = new THREE.Color(sunCol || 0xffffff), N = 64, faces = [];
  const dirs = [(u, v) => V(1, -v, -u), (u, v) => V(-1, -v, u), (u, v) => V(u, 1, v), (u, v) => V(u, -1, -v), (u, v) => V(u, -v, 1), (u, v) => V(-u, -v, -1)];
  for (let f = 0; f < 6; f++) {
    const c = document.createElement('canvas'); c.width = c.height = N; const g = c.getContext('2d'), d = g.createImageData(N, N);
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
      const dir = dirs[f]((x + 0.5) / N * 2 - 1, (y + 0.5) / N * 2 - 1).normalize();
      const k = eio(clamp01((dir.y + 0.25) / 0.6)); let r = lerp(B.r, A.r, k), gg = lerp(B.g, A.g, k), b = lerp(B.b, A.b, k);
      if (sunDir) { const s = Math.pow(Math.max(0, dir.dot(sunDir)), 24) * 1.4; r += S.r * s; gg += S.g * s; b += S.b * s; }
      const i = (y * N + x) * 4; d.data[i] = Math.min(255, r * 255); d.data[i + 1] = Math.min(255, gg * 255); d.data[i + 2] = Math.min(255, b * 255); d.data[i + 3] = 255;
    }
    g.putImageData(d, 0, 0); faces.push(c);
  }
  const t = new THREE.CubeTexture(faces); t.encoding = THREE.sRGBEncoding; t.needsUpdate = true; return t;
}

// =====================================================================
//  timeline from the narration
// =====================================================================
let TL = null;
const grains = (() => { const out = [], r = rng(3); for (let k = 0; k < 6; k++) { const c = document.createElement('canvas'); c.width = c.height = 256; const g = c.getContext('2d'), d = g.createImageData(256, 256); for (let i = 0; i < d.data.length; i += 4) { const v = r() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; } g.putImageData(d, 0, 0); out.push('url(' + c.toDataURL() + ')'); } return out; })();

// =====================================================================
//  shared materials
// =====================================================================
const FAB = (() => { const t = canvasTex(256, 256, (g, w, h) => { const c = document.createElement('canvas'); c.width = c.height = 48; noiseFill(c.getContext('2d'), 48, 48, [128, 128, 128], 90, 9); g.imageSmoothingEnabled = true; g.drawImage(c, 0, 0, w, h); g.strokeStyle = 'rgba(0,0,0,0.12)'; for (let k = 0; k < 6; k++) { g.beginPath(); g.moveTo(0, k * 43 + 10); g.bezierCurveTo(80, k * 43 + 30, 170, k * 43 - 10, 256, k * 43 + 14); g.lineWidth = 6; g.stroke(); } }, [2, 2]); t.encoding = THREE.LinearEncoding; return t; })();
const MLI = canvasTex(256, 256, (g, w, h) => { noiseFill(g, w, h, [226, 226, 222], 16, 4); g.strokeStyle = 'rgba(120,120,120,0.55)'; g.lineWidth = 2; for (let k = 0; k <= 4; k++) { g.beginPath(); g.moveTo(0, k * 64); g.lineTo(w, k * 64); g.stroke(); g.beginPath(); g.moveTo(k * 64, 0); g.lineTo(k * 64, h); g.stroke(); } g.fillStyle = 'rgba(90,90,90,0.5)'; for (let x = 32; x < w; x += 64) for (let y = 32; y < h; y += 64) { g.beginPath(); g.arc(x, y, 3, 0, 7); g.fill(); } }, [2, 2]);

// =====================================================================
//  the astronaut: an EVA suit with jointed limbs
// =====================================================================
function buildAstronaut(kind) {
  const proto = kind === 'proto', red = kind === 'red';
  const A = { kind, mats: [], j: {}, hand: {} };
  const reg = m => { A.mats.push(m); m.userData.op = m.opacity; m.userData.tr = m.transparent; return m; };
  const fabric = reg(new THREE.MeshStandardMaterial({ color: proto ? 0xc4c8cd : 0xefeee9, roughness: proto ? 0.36 : 0.85, metalness: proto ? 0.75 : 0 }));
  const hard = reg(new THREE.MeshStandardMaterial({ color: proto ? 0xcfd3d8 : 0xf3f3ef, roughness: 0.42, metalness: proto ? 0.7 : 0.05 }));
  const metal = reg(new THREE.MeshStandardMaterial({ color: 0xa3a9b0, roughness: 0.28, metalness: 0.95 }));
  const dark = reg(new THREE.MeshStandardMaterial({ color: 0x2a2d33, roughness: 0.6, metalness: 0.3 }));
  const ring = reg(new THREE.MeshStandardMaterial({ color: proto ? 0x8f969e : (red ? 0xc23a30 : 0x3566c8), roughness: 0.3, metalness: 0.75 }));
  const stripe = reg(new THREE.MeshStandardMaterial({ color: 0xc8352c, roughness: 0.8 }));
  const grip = reg(new THREE.MeshStandardMaterial({ color: proto ? 0x9aa0a6 : 0x9a9ea5, roughness: 0.9 }));
  const visor = reg(new THREE.MeshStandardMaterial({ color: proto ? 0x2e2924 : 0xe0ae45, roughness: 0.08, metalness: 1, side: THREE.DoubleSide }));
  const glass = reg(new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.04, transparent: true, opacity: 0.16, depthWrite: false }));
  const root = new THREE.Group(); A.root = root;
  const pelvis = new THREE.Group(); root.add(pelvis); A.j.pelvis = pelvis;
  pelvis.add(mesh(scaleGeo(lathe([[0, -0.17], [0.14, -0.15], [0.2, -0.06], [0.205, 0.06], [0.19, 0.13], [0, 0.14]], 28), 1, 1, 0.8), fabric));
  const waist = new THREE.Group(); waist.position.y = 0.1; pelvis.add(waist); A.j.waist = waist;
  waist.add(mesh(scaleGeo(new THREE.TorusGeometry(0.19, 0.018, 8, 32).rotateX(PI / 2), 1, 1, 0.82), metal));
  waist.add(mesh(scaleGeo(lathe([[0, 0], [0.19, 0.02], [0.245, 0.14], [0.27, 0.3], [0.272, 0.44], [0.24, 0.54], [0.15, 0.605], [0, 0.62]], 36), 1, 1, 0.8), hard));
  waist.add(mesh(new THREE.TorusGeometry(0.125, 0.024, 10, 32).rotateX(PI / 2), metal, 0, 0.605, 0.01));
  const helm = new THREE.Group(); helm.position.set(0, 0.75, 0.02); waist.add(helm); A.j.helm = helm;
  const bubble = mesh(new THREE.SphereGeometry(0.165, 32, 24), glass, 0, 0, 0, false); helm.add(bubble);
  helm.add(mesh(new THREE.SphereGeometry(0.15, 24, 16), dark, 0, -0.005, -0.01));      // comm cap and head, in shadow
  helm.add(mesh(new THREE.SphereGeometry(0.18, 40, 28, PI / 2 - 1.05, 2.1, 0.42, 1.32), visor, 0, 0, 0, false));
  if (!proto) {
    helm.add(mesh(new THREE.SphereGeometry(0.184, 40, 28, PI / 2 + 1.05, 2 * PI - 2.1, 0, 1.95), hard));
    helm.add(mesh(new THREE.SphereGeometry(0.184, 40, 12, 0, 2 * PI, 0, 0.42), hard));
    [1, -1].forEach(s => { const l = mesh(new THREE.CylinderGeometry(0.028, 0.028, 0.09, 16).rotateX(PI / 2), hard, 0.175 * s, 0.07, 0.03); helm.add(l); helm.add(mesh(new THREE.CircleGeometry(0.022, 16), new THREE.MeshBasicMaterial({ color: 0xfff6dd }), 0.175 * s, 0.07, 0.077, false)); });
    waist.add(mesh(rbox(0.52, 0.64, 0.24, 0.05), hard, 0, 0.33, -0.31));
    waist.add(mesh(new THREE.BoxGeometry(0.46, 0.1, 0.2), dark, 0, 0.68, -0.31));
    waist.add(mesh(new THREE.BoxGeometry(0.12, 0.2, 0.05), dark, 0.16, 0.2, -0.45));
    waist.add(mesh(rbox(0.3, 0.12, 0.14, 0.025), hard, 0, 0.3, 0.27));
    waist.add(mesh(new THREE.BoxGeometry(0.22, 0.012, 0.08), dark, 0, 0.365, 0.285));
    [-0.08, 0, 0.08].forEach(x => waist.add(mesh(new THREE.CylinderGeometry(0.018, 0.018, 0.03, 12), ring, x, 0.31, 0.35).rotateX(PI / 2)));
  } else {
    A.port = mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.06, 16), metal, 0.06, 0.34, 0.27); A.port.rotation.x = PI / 2; waist.add(A.port);
  }
  for (const s of [1, -1]) {
    const key = s > 0 ? 'L' : 'R';
    const sh = new THREE.Group(); sh.position.set(0.31 * s, 0.47, 0); waist.add(sh);
    sh.add(mesh(new THREE.TorusGeometry(0.1, 0.022, 8, 24).rotateY(PI / 2), metal));
    sh.add(mesh(limbGeo(0.098, 0.082, 0.3, 3, 0.07), fabric));
    const el = new THREE.Group(); el.position.y = -0.3; sh.add(el);
    el.add(mesh(limbGeo(0.082, 0.07, 0.26, 2, 0.06), fabric));
    const wr = new THREE.Group(); wr.position.y = -0.27; el.add(wr);
    wr.add(mesh(new THREE.TorusGeometry(0.068, 0.017, 8, 24).rotateX(PI / 2), ring));
    const hand = { g: new THREE.Group(), f: [] }; wr.add(hand.g);
    hand.g.add(mesh(limbGeo(0.064, 0.058, 0.06, 1, 0.03), fabric, 0, -0.01, 0));
    hand.g.add(mesh(scaleGeo(new THREE.SphereGeometry(1, 20, 14), 0.05, 0.06, 0.028), fabric, 0, -0.1, 0));
    hand.g.add(mesh(scaleGeo(new THREE.SphereGeometry(1, 20, 14), 0.046, 0.054, 0.012), grip, 0, -0.1, 0.019));
    [-0.031, -0.0105, 0.0105, 0.031].forEach((x, i) => {
      const a = new THREE.Group(); a.position.set(x, -0.152, 0.004); hand.g.add(a);
      a.add(mesh(limbGeo(0.0125, 0.012, 0.035 - Math.abs(i - 1.5) * 0.003, 1, 0.05), grip));
      const b = new THREE.Group(); b.position.y = -0.034; a.add(b); b.add(mesh(limbGeo(0.0118, 0.0105, 0.03, 1, 0.05), grip));
      hand.f.push(a, b);
    });

  if (t >= 25.1 && t < 29.8) { tv = '0:' + String(Math.min(15, 9 + Math.floor((t - 25.1) * 1.6))).padStart(2, '0'); }

  el.tv.textContent = tv; el.tv.style.color = tcol; show(el.timer, tv ? 1 : 0, `scale(${t >= 35.25 && t < 36 ? (1 + 0.12 * Math.exp(-(t - 35.25) * 8)).toFixed(3) : 1})`);
  show(el.yr, win(t, 37.7, 40.4, 0.4, 0.4), `translateY(${(14 * (1 - eo(seg(t, 37.7, 38.3)))).toFixed(1)}px)`);

const el_gl = $('gl');

const loader = new THREE.TextureLoader();

});
window.renderFrame = frame;
window.DURATION = 53.0;
if (!/capture/.test(location.search)) {
  const stage = $('stage'); let T = 0, playing = true, last = 0;
  const fit = () => { const k = Math.min(innerWidth / W, innerHeight / H); stage.style.transform = `translate(${(innerWidth - W * k) / 2}px,${(innerHeight - H * k) / 2}px) scale(${k})`; };
  addEventListener('resize', fit); fit();
  addEventListener('keydown', e => { if (e.code === 'Space') playing = !playing; if (e.code === 'ArrowRight') { T = Math.min(53, T + 1); frame(T); } if (e.code === 'ArrowLeft') { T = Math.max(0, T - 1); frame(T); } });
  window.ready.then(() => requestAnimationFrame(function loop(now) { if (playing) { T += Math.min(0.1, (now - last) / 1000 || 0); if (T >= 53) T = 0; frame(T); } last = now; requestAnimationFrame(loop); }));
}
