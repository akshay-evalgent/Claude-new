<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Billion-Dollar Hard Drive (AI)</title>
<style>
  @font-face { font-family: 'Anton'; src: url(assets/anton.woff2) format('woff2'); }
  @font-face { font-family: 'Barlow Condensed'; font-weight: 600; src: url(assets/barlow600.woff2) format('woff2'); }
  @font-face { font-family: 'Barlow Condensed'; font-weight: 700; src: url(assets/barlow700.woff2) format('woff2'); }
  @font-face { font-family: 'JetBrains Mono'; font-weight: 100 800; src: url(assets/jbmono.woff2) format('woff2'); }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #stage { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: hidden; background: #000; transform-origin: 0 0; color: #fff; font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; }
  #stage > * { position: absolute; }
  #plate { transform-origin: 50% 45%; }
  #plate, #gfx, #fx { left: 0; top: 0; width: 1080px; height: 1920px; }
  .full { inset: 0; pointer-events: none; }
  #vig { background: radial-gradient(ellipse 85% 65% at 50% 48%, rgba(0,0,0,0) 60%, rgba(0,0,0,0.38) 100%); }
  #fade { background: #000; }
  #cap { left: 60px; right: 60px; top: 1150px; text-align: center; font-weight: 700; font-size: 86px; line-height: 1.02; text-transform: uppercase; letter-spacing: 0.01em;
    -webkit-text-stroke: 14px #000; paint-order: stroke fill; text-shadow: 0 6px 18px rgba(0,0,0,0.55); }
  #cap span { display: inline-block; margin: 0 0.12em; }
  #cap span.on { color: #ffd54a; }
  #chip { left: 0; right: 0; top: 290px; text-align: center; }
  #chip div { display: inline-block; font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 34px; letter-spacing: 0.1em; padding: 14px 26px; border-radius: 12px; background: rgba(12,8,4,0.62); }
  #chip b { color: #ffd54a; }
  #big { left: 0; right: 0; top: 380px; text-align: center; font-family: 'Anton', sans-serif; font-size: 230px; line-height: 1; -webkit-text-stroke: 16px #000; paint-order: stroke fill; text-shadow: 0 6px 30px rgba(0,0,0,0.6); }
  #big .stamp { display: inline-block; color: #ff3b30; -webkit-text-stroke: 0; text-shadow: none; border: 14px solid #ff3b30; border-radius: 24px; padding: 6px 34px 14px; letter-spacing: 0.04em; transform: rotate(-9deg); background: rgba(0,0,0,0.25); }
  #big .gold { color: #ffd54a; }
  #end { left: 70px; right: 70px; top: 1060px; text-align: center; padding: 40px 30px 38px; border-radius: 30px; background: rgba(10,8,5,0.72); }
  #end .a { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 30px; letter-spacing: 0.24em; color: #ffd54a; }
  #end .b { font-family: 'Anton', sans-serif; font-size: 104px; line-height: 1.04; text-transform: uppercase; margin-top: 10px; }
  #end .c { font-weight: 600; font-size: 40px; line-height: 1.25; color: #fff; margin-top: 18px; }
  #end .q { font-family: 'Anton', sans-serif; font-size: 62px; color: #ffd54a; margin-top: 20px; text-transform: uppercase; }
  #end .d { font-family: 'JetBrains Mono', monospace; font-size: 22px; letter-spacing: 0.08em; color: #f1e6d6; margin-top: 20px; }
</style>
</head>
<body>
<div id="stage">
  <img id="plate" alt="">
  <canvas id="gfx" width="1080" height="1920"></canvas>
  <canvas id="fx" width="1080" height="1920"></canvas>
  <div id="vig" class="full"></div>
  <div id="chip"><div id="chipT"></div></div>
  <div id="big"></div>
  <div id="end"><div class="a">JAMES HOWELLS</div><div class="b">8,000 bitcoin,<br>still buried</div><div class="c">About $1 billion at the peak (October 2025), about $480 million today.</div><div class="q">Would you have kept digging?</div><div class="d">BASED ON NEWS REPORTS AND THE COURT RULING</div></div>
  <div id="cap"></div>
  <div id="fade" class="full"></div>
</div>
<script>
'use strict';
const W = 1080, H = 1920, FPS = 24, PI = Math.PI;
const clamp01 = x => Math.max(0, Math.min(1, x)), seg = (t, a, b) => clamp01((t - a) / (b - a));
const eio = x => x * x * (3 - 2 * x), eo = x => 1 - Math.pow(1 - x, 3), lerp = (a, b, k) => a + (b - a) * k;
const win = (t, a, b, fi = 0.25, fo = 0.25) => Math.min(seg(t, a, a + fi), 1 - seg(t, b - fo, b));
const hash = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const $ = id => document.getElementById(id);

// the cut: shot name and slot in seconds. CHART shots are drawn here; the rest are AI clips (32 fps frames in out/clips/<id>/)
const SLOTS = [['h01', 1.9], ['h02', 1.3], ['h22', 2.5], ['h03', 1.5], ['h04', 3.1], ['h05', 2.6], ['CHART0', 2.2], ['h06', 3.1], ['h07', 3.3], ['h08', 2.4],
  ['h09', 1.6], ['h10', 2.2], ['h11', 2.1], ['h12', 2.2], ['h13', 1.3], ['h14', 2.3], ['h15', 4.1], ['CHART1', 2.4], ['h16', 3.1], ['h17', 1.6],
  ['h23', 2.3], ['h18', 2.6], ['h19', 2.2], ['h20', 2.3], ['h21', 0]];
const END = 61.5;   // film length: the narration ends at 57.2, then the end card
const ENDCARD = 57.7;
const SRC_FPS = 32, CLIPLEN = window.CLIPLEN || {};   // frames per clip, filled in by clips.json
// clips that go wrong late: { id: [last good frame, play forward then back] }; CLIPCROP: { id: [zoom, centre x] } keeps
// part of a frame out of shot; CLIPFROM: { id: first frame } starts a clip late; CLIPREV: { id: true } plays it backwards
// h10: his shock turns into a grin after a second, so the first 26 frames run backwards, from calm to the gasp
const CLIPCUT = { h10: [26] }, CLIPCROP = {}, CLIPFROM = {}, CLIPREV = { h10: true };
let acc = 0; const CUT = {}; const SEQ = [];
SLOTS.forEach(([n, d]) => { if (!d) d = END - acc; CUT[n] = [acc, acc + d]; SEQ.push([n, d, acc]); acc += d; });
const TOTAL = Math.round(acc * FPS); window.DURATION = acc; window.FRAMES = TOTAL;
const T = n => CUT[n];

// ---------- the chart: what his 8,000 bitcoin were worth ----------
// [year, US$ per bitcoin], rough highs and lows; Oct 2009 is the first published exchange rate (1,309 BTC to the dollar),
// and the October 2025 peak (reported between $125,700 and $126,200) is rounded to $125,000, i.e. $1 billion for 8,000
const PRICE = [[2009.0, 0], [2009.8, 0.00076], [2010.5, 0.07], [2011.45, 30], [2011.9, 3], [2012.9, 13], [2013.3, 200], [2013.6, 100], [2013.92, 1100],
  [2014.9, 320], [2015.9, 430], [2016.9, 960], [2017.96, 19000], [2018.9, 3700], [2019.5, 12000], [2019.95, 7200], [2020.2, 5000], [2020.95, 29000],
  [2021.28, 63000], [2021.55, 30000], [2021.85, 67000], [2022.45, 20000], [2022.9, 16500], [2023.9, 42000], [2024.2, 71000], [2024.6, 58000],
  [2024.95, 98000], [2025.3, 85000], [2025.77, 125000]];
const BTC = 8000, Y0 = 2009, Y1 = 2026, VMAX = 1.1e9;
function priceAt(y) { for (let i = 1; i < PRICE.length; i++) if (y <= PRICE[i][0]) return lerp(PRICE[i - 1][1], PRICE[i][1], seg(y, PRICE[i - 1][0], PRICE[i][0])); return PRICE[PRICE.length - 1][1]; }
const gc = $('gfx').getContext('2d'), fc = $('fx').getContext('2d');
const CX0 = 130, CX1 = 960, CYB = 1440, CYT = 800;
const px = y => CX0 + (y - Y0) / (Y1 - Y0) * (CX1 - CX0), py = v => CYB - v / VMAX * (CYB - CYT);
const money = v => '$' + Math.round(v).toLocaleString('en-US');
function glabel(txt, x, y, size, color, align = 'center', font = 'JetBrains Mono', weight = 700) {
  gc.font = `${weight} ${size}px '${font}'`; gc.textAlign = align; gc.lineJoin = 'round'; gc.lineWidth = size * 0.22; gc.strokeStyle = 'rgba(0,0,0,0.7)';
  gc.strokeText(txt, x, y); gc.fillStyle = color; gc.fillText(txt, x, y);
}
function drawChart(name, t) {
  const [a, b] = T(name), k = seg(t, a, b), first = name === 'CHART0';
  const head = first ? lerp(Y0, 2009.8, eo(seg(k, 0.1, 0.65))) : lerp(2009.8, 2025.77, eio(seg(k, 0.04, 0.82)));
  const z = first ? lerp(1.0, 1.03, k) : lerp(1.03, 1.08, k);
  gc.setTransform(1, 0, 0, 1, 0, 0);
  const bg = gc.createLinearGradient(0, 0, 0, H); bg.addColorStop(0, '#0d1626'); bg.addColorStop(1, '#05080f'); gc.fillStyle = bg; gc.fillRect(0, 0, W, H);
  gc.setTransform(z, 0, 0, z, W / 2 * (1 - z), H * 0.55 * (1 - z));
  gc.lineWidth = 2; gc.strokeStyle = 'rgba(255,255,255,0.10)';
  for (const v of [250e6, 500e6, 750e6, 1e9]) { gc.beginPath(); gc.moveTo(CX0, py(v)); gc.lineTo(CX1, py(v)); gc.stroke(); glabel(v === 1e9 ? '$1B' : `$${v / 1e6}M`, CX0 - 14, py(v) + 10, 26, 'rgba(255,255,255,0.55)', 'right', 'JetBrains Mono', 600); }
  gc.strokeStyle = 'rgba(255,255,255,0.35)'; gc.beginPath(); gc.moveTo(CX0, CYT - 20); gc.lineTo(CX0, CYB); gc.lineTo(CX1, CYB); gc.stroke();
  for (const y of [2009, 2013, 2017, 2021, 2025]) glabel(String(y), px(y), CYB + 52, 30, 'rgba(255,255,255,0.7)', 'center', 'JetBrains Mono', 600);
  // the line so far, with a little deterministic jitter so it reads as a market
  const pts = [];
  for (let y = Y0, i = 0; y <= head + 1e-6; y = Math.min(head, y + 0.025), i++) {
    const v = BTC * priceAt(y) * (1 + 0.07 * (hash(i + 5) - 0.5)); pts.push([px(y), py(v)]); if (y >= head) break;
  }
  if (pts.length > 1) {
    const fill = gc.createLinearGradient(0, CYT, 0, CYB); fill.addColorStop(0, 'rgba(255,213,74,0.35)'); fill.addColorStop(1, 'rgba(255,213,74,0.02)');
    gc.beginPath(); gc.moveTo(pts[0][0], CYB); pts.forEach(p => gc.lineTo(p[0], p[1])); gc.lineTo(pts[pts.length - 1][0], CYB); gc.closePath(); gc.fillStyle = fill; gc.fill();
    gc.beginPath(); pts.forEach((p, i) => i ? gc.lineTo(p[0], p[1]) : gc.moveTo(p[0], p[1])); gc.strokeStyle = '#ffd54a'; gc.lineWidth = 7; gc.lineJoin = 'round'; gc.stroke();
  }
  const hv = BTC * priceAt(head), hx = px(head), hy = py(hv);
  gc.fillStyle = 'rgba(255,213,74,0.25)'; gc.beginPath(); gc.arc(hx, hy, 26 + 6 * Math.sin(t * 9), 0, 7); gc.fill();
  gc.fillStyle = '#fff'; gc.beginPath(); gc.arc(hx, hy, 11, 0, 7); gc.fill();
  gc.setTransform(1, 0, 0, 1, 0, 0);
  glabel('HIS 8,000 BITCOIN, IN DOLLARS', W / 2, 300, 40, '#ffd54a');
  gc.font = "150px 'Anton'"; gc.textAlign = 'center'; gc.lineWidth = 18; gc.strokeStyle = '#000'; const num = money(hv);
  gc.strokeText(num, W / 2, 520); gc.fillStyle = hv > 5e8 ? '#ffd54a' : '#fff'; gc.fillText(num, W / 2, 520);
  const sub = first ? (head > 2009.75 ? 'OCT 2009 · THE FIRST PRICE EVER' : '2009') : (head > 2025.7 ? 'PEAK · OCTOBER 2025' : String(Math.floor(head)));
  glabel(sub, W / 2, 600, 36, 'rgba(255,255,255,0.85)');
}

// ---------- rain, gold sparkles, impacts ----------
const RAIN = { h03: 0.5, h08: 0.3, h13: 0.6, h17: 0.8 };
const GLINT = { h05: 1, h20: 0.5, h22: 0.6 };
const IMPACTS = [3.35, 32.05, 39.05, 45.3];          // the big words land: a short camera shake
function weather(t, s) {
  fc.clearRect(0, 0, W, H);
  const k = RAIN[s] || 0, g = GLINT[s] || 0;
  if (k > 0) {
    fc.lineCap = 'round';
    for (let i = 0; i < 520 * k; i++) {
      const sp = 2400 + hash(i) * 1600, len = 50 + hash(i + 200) * 120, x0 = hash(i + 300) * (W + 300) - 150;
      const y = ((hash(i + 100) * (H + 400) + t * sp) % (H + 400)) - 200, x = x0 + (y / H) * 150;
      fc.strokeStyle = `rgba(210,225,240,${(0.12 + 0.25 * hash(i + 400)) * Math.min(1, k + 0.3)})`; fc.lineWidth = 1.5 + hash(i + 500) * 2.5;
      fc.beginPath(); fc.moveTo(x, y); fc.lineTo(x + len * 0.18, y + len); fc.stroke();
    }
  }
  if (g > 0) {                                       // gold sparkles drifting up and twinkling
    for (let i = 0; i < 70 * g; i++) {
      const x = (hash(i + 10) * W + 24 * Math.sin(t * 0.9 + i)) % W, y = ((hash(i + 20) * (H + 100) - t * (40 + hash(i + 30) * 90)) % (H + 100) + H + 100) % (H + 100) - 50;
      const tw = Math.max(0, Math.sin(t * (3 + hash(i + 40) * 5) + i * 1.7)), r = 2 + hash(i + 50) * 4;
      fc.fillStyle = `rgba(255,220,120,${(0.65 * tw * g).toFixed(3)})`; fc.beginPath(); fc.arc(x, y, r, 0, 7); fc.fill();
      if (tw > 0.85) { fc.strokeStyle = `rgba(255,240,190,${(0.5 * g).toFixed(3)})`; fc.lineWidth = 1.5; fc.beginPath(); fc.moveTo(x - r * 4, y); fc.lineTo(x + r * 4, y); fc.moveTo(x, y - r * 4); fc.lineTo(x, y + r * 4); fc.stroke(); }
    }
  }
}

// ---------- captions ----------
const el = {}; ['plate', 'gfx', 'fx', 'cap', 'chip', 'chipT', 'big', 'end', 'fade'].forEach(k => el[k] = $(k));
function show(e, o, tf) { e.style.opacity = o.toFixed(3); e.style.visibility = o > 0.004 ? 'visible' : 'hidden'; if (tf !== undefined) e.style.transform = tf; }
let TL = null, CHUNKS = [];
function buildChunks() {
  const words = []; TL.lines.forEach(l => l.words.forEach((w, wi) => words.push({ w: w[0], a: w[1], b: w[2], end: wi === l.words.length - 1, lineEnd: l.end })));
  let cur = [];
  words.forEach((w, i) => { cur.push(w); if (cur.length === 3 || /[.,?!]$/.test(w.w) || w.end || (words[i + 1] && words[i + 1].w.length > 9 && cur.length >= 2)) { CHUNKS.push(cur); cur = []; } });
  if (cur.length) CHUNKS.push(cur);
  CHUNKS.forEach((c, i) => { c.a = c[0].a - 0.04; const nx = CHUNKS[i + 1]; c.b = c[c.length - 1].end ? c[c.length - 1].lineEnd + 0.2 : (nx ? nx[0].a - 0.04 : 99); if (nx && c.b > nx[0].a - 0.04) c.b = nx[0].a - 0.04; });
}
const CAPTOP = { CHART0: 1640, CHART1: 1640, h15: 960 };   // shots whose subject sits at caption height get their caption lower down
function captions(t, shot) {
  el.cap.style.top = (CAPTOP[shot] || 1150) + 'px';
  const c = CHUNKS.find(c => t >= c.a && t < c.b);
  if (!c) { show(el.cap, 0); return; }
  el.cap.innerHTML = c.map((w, i) => `<span class="${t >= w.a - 0.03 && (i === c.length - 1 || t < c[i + 1].a - 0.03) ? 'on' : ''}">${w.w.replace(/[,.]$/, '').replace(/</g, '')}</span>`).join(' ');
  show(el.cap, 1, `scale(${(0.86 + 0.14 * eo(seg(t, c.a, c.a + 0.12))).toFixed(3)})`);
}
// chips: [shot, text]; the part in <b> is gold
const CHIPTOP = { h10: 1290, h19: 150, h23: 150 };   // shots whose head sits at chip height: chip higher, or under the caption
const CHIPS = [['h03', 'SOUTH WALES · 2009'], ['h04', 'JAMES HOWELLS · IT ENGINEER'], ['h05', '<b>8,000</b> BITCOIN'], ['h07', 'SUMMER 2013'],
  ['h10', 'LATE 2013 · NOW <b>≈ $8 MILLION</b>'], ['h14', '2021 · NOW <b>≈ $280 MILLION</b>'], ['h16', 'HIS CLAIM: <b>£495 MILLION</b>'],
  ['h23', 'HIS OFFER: <b>£25 MILLION</b>'], ['h19', 'AUGUST 2025']];
// big words: text, from, to, font size; top (default 380); roll: count up to this number; stamp: a red rubber stamp
const BIG = [{ text: '$1,000,000,000', a: 3.35, b: 5.75, size: 140, roll: 1e9 }, { text: 'NO.', a: 32.05, b: 33.25, size: 300, top: 1330 },
  { text: 'STILL NO.', a: 39.05, b: 39.7, size: 200 }, { text: 'DISMISSED', a: 45.3, b: 46.75, size: 150, stamp: true, top: 1380 }];

const SHAKE = { h09: 0.25 };
let plateKey = '';
function frame(t) {
  const s = SEQ.find(s => t >= s[2] && t < s[2] + s[1]) || SEQ[SEQ.length - 1];
  let wait = Promise.resolve(), zoom = 1, sx = 0, sy = 0;
  if (s[0].startsWith('CHART')) { show(el.plate, 0); show(el.gfx, 1); drawChart(s[0], t); }
  else {
    show(el.gfx, 0); show(el.plate, 1);
    const cut = CLIPCUT[s[0]], from = CLIPFROM[s[0]] || 1, n = (cut ? cut[0] : CLIPLEN[s[0]] || 97) - from + 1;
    const span = cut && cut[1] ? 2 * n - 1 : n, lt = t - s[2];
    const rate = cut ? Math.min(1, span / SRC_FPS / s[1]) : Math.max(0.75, Math.min(1, n / SRC_FPS / s[1]));
    let idx = Math.min(span, 1 + Math.floor(lt * rate * SRC_FPS)); if (idx > n) idx = 2 * n - idx;
    if (CLIPREV[s[0]]) idx = n + 1 - idx;
    idx += from - 1;
    const src = `out/clips/${s[0]}/f${String(idx).padStart(4, '0')}.jpg`;
    if (src !== plateKey) { plateKey = src; el.plate.src = src; wait = el.plate.decode().catch(() => {}); }
    const k = lt / s[1];
    zoom = 1.0 + 0.05 * k + 0.07 * Math.pow(1 - eo(seg(lt, 0, 0.22)), 2);             // punch-in on the cut, slow creep after
    const crop = CLIPCROP[s[0]]; if (crop) { zoom *= crop[0]; sx = (0.5 - crop[1]) * W * zoom; }
    const sh = SHAKE[s[0]] || 0; if (sh) { sx += sh * (9 * Math.sin(t * 37) + 5 * Math.sin(t * 61)); sy = sh * 7 * Math.sin(t * 43 + 1); }
  }
  for (const ia of IMPACTS) if (t >= ia && t < ia + 0.4) { const e = Math.exp(-(t - ia) * 9); sx += 16 * e * Math.sin(t * 90); sy += 12 * e * Math.sin(t * 73 + 1); }
  el.plate.style.transform = `translate(${sx.toFixed(1)}px,${sy.toFixed(1)}px) scale(${zoom.toFixed(4)})`;
  el.gfx.style.transform = `translate(${sx.toFixed(1)}px,${sy.toFixed(1)}px)`;
  weather(t, s[0]);
  const cEnd = c => Math.min(T(c[0])[1], ENDCARD) - 0.05, chip = CHIPS.find(c => t >= T(c[0])[0] + 0.15 && t < cEnd(c));
  if (chip) { el.chipT.innerHTML = chip[1]; el.chip.style.top = (CHIPTOP[chip[0]] || 290) + 'px'; show(el.chip, win(t, T(chip[0])[0] + 0.15, cEnd(chip), 0.2, 0.2), `translateY(${(-14 * (1 - eo(seg(t, T(chip[0])[0] + 0.15, T(chip[0])[0] + 0.5)))).toFixed(1)}px)`); } else show(el.chip, 0);
  const bg = BIG.find(g => t >= g.a && t < g.b);
  if (bg) {
    const txt = bg.roll ? money(bg.roll * Math.pow(eo(seg(t, bg.a, bg.a + 1.0)), 2.2)) : bg.text;
    el.big.innerHTML = bg.stamp ? `<span class="stamp">${txt}</span>` : bg.roll ? `<span class="${t > bg.a + 1.0 ? 'gold' : ''}">${txt}</span>` : txt;
    el.big.style.fontSize = bg.size + 'px'; el.big.style.top = (bg.top || 380) + 'px';
    const pop = bg.stamp ? 1 + 1.3 * (1 - eo(seg(t, bg.a, bg.a + 0.16))) : 1 + 0.5 * (1 - eo(seg(t, bg.a, bg.a + 0.35)));
    show(el.big, win(t, bg.a, bg.b, bg.stamp ? 0.05 : 0.12, 0.25), `scale(${pop.toFixed(3)})`);
  } else show(el.big, 0);
  show(el.end, seg(t, ENDCARD, ENDCARD + 0.6), `translateY(${(40 * (1 - eo(seg(t, ENDCARD, ENDCARD + 0.6)))).toFixed(1)}px)`);
  show(el.fade, Math.max(1 - seg(t, 0, 0.12), seg(t, window.DURATION - 0.55, window.DURATION - 0.05)));
  captions(Math.min(t, ENDCARD), s[0]);
  return wait;
}
window.ready = Promise.all([fetch('out/clips.json').then(r => r.json()).then(j => { Object.assign(CLIPLEN, j); }).catch(() => {}), fetch('vo/timeline.json').then(r => r.json()), document.fonts.load('700 40px "Barlow Condensed"'), document.fonts.load('600 40px "Barlow Condensed"'), document.fonts.load('700 40px "JetBrains Mono"'), document.fonts.load('40px Anton')]).then(r => { TL = r[1]; buildChunks(); return frame(0); }).then(() => true);
window.renderFrame = frame;
if (!/capture/.test(location.search)) {
  const stage = $('stage'); let TT = 0, last = 0;
  const fit = () => { const k = Math.min(innerWidth / W, innerHeight / H); stage.style.transform = `translate(${(innerWidth - W * k) / 2}px,${(innerHeight - H * k) / 2}px) scale(${k})`; };
  addEventListener('resize', fit); fit();
  window.ready.then(() => requestAnimationFrame(function loop(now) { TT += Math.min(0.1, (now - last) / 1000 || 0); if (TT >= window.DURATION) TT = 0; frame(TT); last = now; requestAnimationFrame(loop); }));
}
</script>
</body>
</html>
