<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Trapped Under the Sea (AI)</title>
<style>
  @font-face { font-family: 'Anton'; src: url(assets/anton.woff2) format('woff2'); }
  @font-face { font-family: 'Barlow Condensed'; font-weight: 600; src: url(assets/barlow600.woff2) format('woff2'); }
  @font-face { font-family: 'Barlow Condensed'; font-weight: 700; src: url(assets/barlow700.woff2) format('woff2'); }
  @font-face { font-family: 'JetBrains Mono'; font-weight: 100 800; src: url(assets/jbmono.woff2) format('woff2'); }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #stage { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: hidden; background: #000; transform-origin: 0 0; color: #fff; font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; }
  #stage > * { position: absolute; }
  #plate { transform-origin: 50% 45%; }
  #plate, #map, #fx { left: 0; top: 0; width: 1080px; height: 1920px; }
  .full { inset: 0; pointer-events: none; }
  #vig { background: radial-gradient(ellipse 85% 65% at 50% 48%, rgba(0,0,0,0) 60%, rgba(0,0,0,0.38) 100%); }
  #fade { background: #000; }
  #cap { left: 60px; right: 60px; top: 1150px; text-align: center; font-weight: 700; font-size: 86px; line-height: 1.02; text-transform: uppercase; letter-spacing: 0.01em;
    -webkit-text-stroke: 14px #000; paint-order: stroke fill; text-shadow: 0 6px 18px rgba(0,0,0,0.55); }
  #cap span { display: inline-block; margin: 0 0.12em; }
  #cap span.on { color: #ffd54a; }
  #chip { left: 0; right: 0; top: 290px; text-align: center; }
  #chip div { display: inline-block; font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 34px; letter-spacing: 0.14em; padding: 14px 26px; border-radius: 12px; background: rgba(12,8,4,0.62); }
  #big { left: 0; right: 0; top: 380px; text-align: center; font-family: 'Anton', sans-serif; font-size: 230px; line-height: 1; -webkit-text-stroke: 16px #000; paint-order: stroke fill; text-shadow: 0 6px 30px rgba(0,0,0,0.6); }
  #end { left: 90px; right: 90px; top: 300px; text-align: center; padding: 44px 30px 40px; border-radius: 30px; background: rgba(16,10,5,0.66); }
  #end .a { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 30px; letter-spacing: 0.24em; color: #ffd54a; }
  #end .b { font-family: 'Anton', sans-serif; font-size: 120px; line-height: 1.04; text-transform: uppercase; margin-top: 12px; }
  #end .c { font-weight: 600; font-size: 44px; line-height: 1.25; color: #fff; margin-top: 22px; }
  #end .d { font-family: 'JetBrains Mono', monospace; font-size: 22px; letter-spacing: 0.08em; color: #f1e6d6; margin-top: 26px; }
</style>
</head>
<body>
<div id="stage">
  <img id="plate" alt="">
  <canvas id="map" width="1080" height="1920"></canvas>
  <canvas id="fx" width="1080" height="1920"></canvas>
  <div id="vig" class="full"></div>
  <div id="chip"><div id="chipT"></div></div>
  <div id="big"></div>
  <div id="end"><div class="a">HARRISON OKENE</div><div class="b">60 hours<br>under the sea</div><div class="c">Alone in an air pocket, 30 m down. The only survivor of 12.</div><div class="d">BASED ON HIS OWN ACCOUNT AND THE DIVERS'</div></div>
  <div id="cap"></div>
  <div id="fade" class="full"></div>
</div>
<script>
'use strict';
const W = 1080, H = 1920, FPS = 24, PI = Math.PI;
const clamp01 = x => Math.max(0, Math.min(1, x)), seg = (t, a, b) => clamp01((t - a) / (b - a));
const eio = x => x * x * (3 - 2 * x), eo = x => 1 - Math.pow(1 - x, 3), lerp = (a, b, k) => a + (b - a) * k;
const win = (t, a, b, fi = 0.25, fo = 0.25) => Math.min(seg(t, a, a + fi), 1 - seg(t, b - fo, b));
const hash = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const $ = id => document.getElementById(id);

// the cut: shot name and slot in seconds. MAP shots are drawn here, BLACK is an empty frame; the rest are AI clips
// (32 fps frames in out/clips/<id>/)
const SLOTS = [['o01', 2.0], ['o02', 1.7], ['o03', 1.3], ['o04', 2.3], ['o05', 2.1], ['MAP1', 2.8], ['o06', 3.2], ['o07', 1.0], ['o08', 1.2], ['o09', 3.4],
  ['BLACK', 0.9], ['o10', 3.3], ['o11', 1.7], ['o12', 3.4], ['o13', 2.0], ['o14', 1.7], ['o15', 1.5], ['o16', 3.7], ['o17', 1.8], ['o18', 1.8], ['o19', 2.1],
  ['o20', 1.5], ['o21', 2.0], ['o22', 2.2], ['o24', 2.4], ['o23', 0]];
const END = 58.3;   // film length: the narration ends at 54.3, then the end card
const SRC_FPS = 32, CLIPLEN = window.CLIPLEN || {};   // frames per clip, filled in by clips.json
// clips that go wrong late: { id: [last good frame, play forward then back] }; CLIPCROP: { id: [zoom, centre x] } keeps
// part of a frame out of shot; CLIPFROM: { id: first frame } starts a clip late (o08: the sand cloud only builds after
// frame 30, and the slot is too short to wait for it)
const CLIPCUT = { o09: [70] }, CLIPCROP = {}, CLIPFROM = { o08: 28 };
let acc = 0; const CUT = {}; const SEQ = [];
SLOTS.forEach(([n, d]) => { if (!d) d = END - acc; CUT[n] = [acc, acc + d]; SEQ.push([n, d, acc]); acc += d; });
const TOTAL = Math.round(acc * FPS); window.DURATION = acc; window.FRAMES = TOTAL;
const T = n => CUT[n];

// ---------- map: the Nigerian coast and the Niger Delta (schematic) ----------
const mc = $('map').getContext('2d'), fc = $('fx').getContext('2d');
const LAGOS = [250, 925], ESCRAVOS = [560, 1078], WRECK = [520, 1200];
const coastY = x => 930 + 250 * Math.exp(-Math.pow((x - 690) / 190, 2)) - 60 * Math.exp(-Math.pow((x - 1000) / 120, 2)) + 10 * Math.sin(x / 37);
function mlabel(txt, x, y, size, color, align, weight = 700) { mc.font = `${weight} ${size}px 'JetBrains Mono', monospace`; mc.textAlign = align || 'left'; mc.lineWidth = 8; mc.strokeStyle = 'rgba(0,0,0,0.55)'; mc.lineJoin = 'round'; mc.strokeText(txt, x, y); mc.fillStyle = color; mc.fillText(txt, x, y); }
function tug(x, y, ang, sc) {                                                 // a little tugboat icon; ang = PI is upside down
  mc.save(); mc.translate(x, y); mc.rotate(ang); mc.scale(sc, sc); mc.lineWidth = 5; mc.strokeStyle = '#000'; mc.lineJoin = 'round';
  const poly = (pts, c) => { mc.beginPath(); pts.forEach((p, i) => i ? mc.lineTo(p[0], p[1]) : mc.moveTo(p[0], p[1])); mc.closePath(); mc.fillStyle = c; mc.stroke(); mc.fill(); };
  poly([[-46, 0], [46, 0], [34, 22], [-38, 22]], '#ff8a3d'); poly([[-22, -26], [14, -26], [14, 0], [-22, 0]], '#fff'); poly([[20, -40], [30, -40], [30, 0], [20, 0]], '#ffd54a');
  mc.restore();
}
function drawMap(name, t) {
  const [a, b] = T(name), k = seg(t, a, b), z = lerp(1.0, 1.3, eio(k));
  mc.setTransform(1, 0, 0, 1, 0, 0); mc.fillStyle = '#123d5c'; mc.fillRect(0, 0, W, H);
  const cx = lerp(560, WRECK[0], eio(k)), cy = lerp(980, WRECK[1], eio(k));          // drift from the whole coast toward the wreck
  mc.setTransform(z, 0, 0, z, W / 2 - cx * z, H * 0.5 - cy * z);
  mc.beginPath(); mc.moveTo(-300, -300); for (let x = -300; x <= 1400; x += 10) mc.lineTo(x, coastY(x)); mc.lineTo(1400, -300); mc.closePath();
  mc.fillStyle = '#3d6b3a'; mc.fill(); mc.strokeStyle = '#d9c9a0'; mc.lineWidth = 5; mc.stroke();                     // land and the beach line
  for (let i = 0; i < 260; i++) { const x = hash(i + 700) * 1500 - 200, y = coastY(x) - 30 - hash(i + 900) * 700; mc.fillStyle = `rgba(20,${60 + hash(i + 7) * 50 | 0},25,0.45)`; mc.beginPath(); mc.arc(x, y, 8 + hash(i + 3) * 10, 0, 7); mc.fill(); }
  mc.strokeStyle = 'rgba(140,195,230,0.85)'; mc.lineWidth = 7; mc.beginPath(); for (let y = 150; y <= 900; y += 25) mc.lineTo(640 + 30 * Math.sin(y / 110), y); mc.stroke();   // the Niger
  mc.lineWidth = 3; [[-70, 1110], [-10, 1150], [60, 1140], [130, 1095]].forEach(([dx, y1]) => { mc.beginPath(); mc.moveTo(640 + 30 * Math.sin(900 / 110), 900); mc.quadraticCurveTo(650 + dx * 0.5, 1000, 690 + dx, y1); mc.stroke(); });   // delta creeks
  mc.setLineDash([12, 10]); mc.strokeStyle = 'rgba(255,255,255,0.45)'; mc.lineWidth = 4;
  mc.beginPath(); mc.moveTo(160, -300); mc.lineTo(180, coastY(180)); mc.stroke(); mc.beginPath(); mc.moveTo(1060, -300); mc.lineTo(1030, coastY(1030)); mc.stroke(); mc.setLineDash([]);
  mlabel('NIGERIA', 400, 760, 64, '#eaf5d8', 'center'); mlabel('NIGER DELTA', 760, 980, 28, '#d9f2c4', 'center'); mlabel('GULF OF GUINEA', 560, 1520, 40, 'rgba(255,255,255,0.6)', 'center');
  const dot = (p, r, c) => { mc.fillStyle = c; mc.beginPath(); mc.arc(p[0], p[1], r, 0, 7); mc.fill(); };
  dot(LAGOS, 12, '#fff'); mlabel('LAGOS', LAGOS[0], LAGOS[1] - 26, 34, '#fff', 'center'); dot(ESCRAVOS, 10, '#fff'); mlabel('ESCRAVOS', ESCRAVOS[0] - 22, ESCRAVOS[1] - 18, 30, '#fff', 'right');
  // the tug appears offshore, rocks on the swell and rolls over
  const on = eo(seg(k, 0.12, 0.3)), roll = seg(k, 0.66, 0.84);
  if (on > 0) {
    for (let r = 0; r < 3; r++) { const ph = (k * 2.2 + r / 3) % 1; mc.strokeStyle = `rgba(255,213,74,${(0.7 * (1 - ph) * on).toFixed(3)})`; mc.lineWidth = 4; mc.beginPath(); mc.arc(WRECK[0], WRECK[1], 30 + ph * 110, 0, 7); mc.stroke(); }
    tug(WRECK[0], WRECK[1], 0.18 * Math.sin(t * 6) * (1 - roll) + PI * eio(roll), 0.6 + 0.4 * on);
    mlabel('JASCON-4', WRECK[0] + 72, WRECK[1] + 14, 42, '#ffd54a', 'left');
  }
  mc.setTransform(1, 0, 0, 1, 0, 0);
  mc.textAlign = 'center'; mc.font = "700 44px 'JetBrains Mono', monospace"; mc.lineWidth = 10; mc.strokeStyle = '#000'; mc.strokeText('WHERE IT SANK', W / 2, 300); mc.fillStyle = '#ffd54a'; mc.fillText('WHERE IT SANK', W / 2, 300);
}
// ---------- rain at sea, drifting particles underwater, the flashlight dying ----------
const RAIN = { o04: 0.45, o06: 0.9 };
const SNOW = { o02: 1, o07: 0.8, o08: 1, o10: 0.7, o14: 1, o18: 1, o19: 0.9, o20: 0.6 };
const DIM = { o13: [0.45, 0.95, 0.9] };            // shot: [from, to (fraction of the slot), darkness reached]
function weather(t, s) {
  fc.clearRect(0, 0, W, H);
  const k = RAIN[s] || 0, m = SNOW[s] || 0;
  if (k > 0) {
    fc.lineCap = 'round';
    for (let i = 0; i < 520 * k; i++) {
      const sp = 2400 + hash(i) * 1600, len = 50 + hash(i + 200) * 120, x0 = hash(i + 300) * (W + 300) - 150;
      const y = ((hash(i + 100) * (H + 400) + t * sp) % (H + 400)) - 200, x = x0 + (y / H) * 150;
      fc.strokeStyle = `rgba(210,225,240,${(0.12 + 0.25 * hash(i + 400)) * Math.min(1, k + 0.3)})`; fc.lineWidth = 1.5 + hash(i + 500) * 2.5;
      fc.beginPath(); fc.moveTo(x, y); fc.lineTo(x + len * 0.18, y + len); fc.stroke();
    }
  }
  if (m > 0) {                                       // marine snow: slow specks, a few out of focus
    for (let i = 0; i < 160 * m; i++) {
      const big = hash(i + 50) > 0.93, r = big ? 7 + hash(i + 60) * 9 : 1.2 + hash(i + 70) * 2.6;
      const x = (hash(i + 10) * W + 30 * Math.sin(t * 0.7 + i)) % W, y = ((hash(i + 20) * (H + 100) - t * (18 + hash(i + 30) * 40)) % (H + 100) + H + 100) % (H + 100) - 50;
      fc.fillStyle = `rgba(200,225,220,${((big ? 0.10 : 0.35) * (0.4 + 0.6 * hash(i + 40)) * m).toFixed(3)})`; fc.beginPath(); fc.arc(x, y, r, 0, 7); fc.fill();
    }
  }
  const d = DIM[s];
  if (d) { const [a, b] = T(s), q = seg(t, a + (b - a) * d[0], a + (b - a) * d[1]), fl = q > 0 && q < 1 ? 0.25 * Math.max(0, Math.sin(t * 53) * Math.sin(t * 31)) : 0;
    fc.fillStyle = `rgba(0,0,0,${Math.min(1, d[2] * eio(q) + fl).toFixed(3)})`; fc.fillRect(0, 0, W, H); }
}

// ---------- captions ----------
const el = {}; ['plate', 'map', 'fx', 'cap', 'chip', 'chipT', 'big', 'end', 'fade'].forEach(k => el[k] = $(k));
function show(e, o, tf) { e.style.opacity = o.toFixed(3); e.style.visibility = o > 0.004 ? 'visible' : 'hidden'; if (tf !== undefined) e.style.transform = tf; }
let TL = null, CHUNKS = [];
function buildChunks() {
  const words = []; TL.lines.forEach(l => l.words.forEach((w, wi) => words.push({ w: w[0], a: w[1], b: w[2], end: wi === l.words.length - 1, lineEnd: l.end })));
  let cur = [];
  words.forEach((w, i) => { cur.push(w); if (cur.length === 3 || /[.,?!]$/.test(w.w) || w.end || (words[i + 1] && words[i + 1].w.length > 9 && cur.length >= 2)) { CHUNKS.push(cur); cur = []; } });
  if (cur.length) CHUNKS.push(cur);
  CHUNKS.forEach((c, i) => { c.a = c[0].a - 0.04; const nx = CHUNKS[i + 1]; c.b = c[c.length - 1].end ? c[c.length - 1].lineEnd + 0.2 : (nx ? nx[0].a - 0.04 : 99); if (nx && c.b > nx[0].a - 0.04) c.b = nx[0].a - 0.04; });
}
const CAPTOP = { o01: 1580, MAP1: 1640 };   // shots whose subject sits at caption height get their caption lower down
function captions(t, shot) {
  el.cap.style.top = (CAPTOP[shot] || 1150) + 'px';
  const c = CHUNKS.find(c => t >= c.a && t < c.b);
  if (!c) { show(el.cap, 0); return; }
  el.cap.innerHTML = c.map((w, i) => `<span class="${t >= w.a - 0.03 && (i === c.length - 1 || t < c[i + 1].a - 0.03) ? 'on' : ''}">${w.w.replace(/[,.]$/, '').replace(/</g, '')}</span>`).join(' ');
  show(el.cap, 1, `scale(${(0.86 + 0.14 * eo(seg(t, c.a, c.a + 0.12))).toFixed(3)})`);
}
const CHIPS = [['o04', 'NIGERIA · 26 MAY 2013'], ['o05', 'HARRISON OKENE · 29'], ['o08', '30 M DOWN']];
// the hour counter while he is trapped: film time -> hours since the capsize (24 when the flashlights die, 60 when the divers come)
const HOURS = [[25.2, 1], [32.3, 24], [39.2, 60]], H0 = 25.2, H1 = 42.75;
function hoursAt(t) { for (let i = 1; i < HOURS.length; i++) if (t < HOURS[i][0]) return lerp(HOURS[i - 1][1], HOURS[i][1], seg(t, HOURS[i - 1][0], HOURS[i][0])); return 60; }
// big words: [text, from, to, font size]
const BIG = [["HE'S ALIVE!", 46.3, 48.3, 170], ['1 OF 12', 48.9, 50.5, 230, 150]];   // [text, from, to, size, top (default 380)]

const SHAKE = { o06: 1, o09: 0.8, o20: 0.4 };
let plateKey = '';
function frame(t) {
  const s = SEQ.find(s => t >= s[2] && t < s[2] + s[1]) || SEQ[SEQ.length - 1];
  let wait = Promise.resolve(), zoom = 1, sx = 0, sy = 0;
  if (s[0].startsWith('MAP')) { show(el.plate, 0); show(el.map, 1); drawMap(s[0], t); }
  else if (s[0].startsWith('BLACK')) { show(el.plate, 0); show(el.map, 0); }
  else {
    show(el.map, 0); show(el.plate, 1);
    const cut = CLIPCUT[s[0]], from = CLIPFROM[s[0]] || 1, n = (cut ? cut[0] : CLIPLEN[s[0]] || 97) - from + 1;
    const span = cut && cut[1] ? 2 * n - 1 : n, lt = t - s[2];
    const rate = cut ? Math.min(1, span / SRC_FPS / s[1]) : Math.max(0.75, Math.min(1, n / SRC_FPS / s[1]));
    let idx = Math.min(span, 1 + Math.floor(lt * rate * SRC_FPS)); if (idx > n) idx = 2 * n - idx;
    idx += from - 1;
    const src = `out/clips/${s[0]}/f${String(idx).padStart(4, '0')}.jpg`;
    if (src !== plateKey) { plateKey = src; el.plate.src = src; wait = el.plate.decode().catch(() => {}); }
    const k = lt / s[1];
    zoom = 1.0 + 0.05 * k + 0.07 * Math.pow(1 - eo(seg(lt, 0, 0.22)), 2);             // punch-in on the cut, slow creep after
    const crop = CLIPCROP[s[0]]; if (crop) { zoom *= crop[0]; sx = (0.5 - crop[1]) * W * zoom; }
    const sh = SHAKE[s[0]] || 0; if (sh) { sx += sh * (9 * Math.sin(t * 37) + 5 * Math.sin(t * 61)); sy = sh * 7 * Math.sin(t * 43 + 1); }   // the boat rolling, the toilet flooding
  }
  el.plate.style.transform = `translate(${sx.toFixed(1)}px,${sy.toFixed(1)}px) scale(${zoom.toFixed(4)})`;
  weather(t, s[0]);
  const cEnd = c => Math.min(T(c[0])[1], 54.5) - 0.05, chip = CHIPS.find(c => t >= T(c[0])[0] + 0.15 && t < cEnd(c));
  const hc = !chip && t >= H0 + 0.15 && t < H1 ? ['', 'TRAPPED · HOUR ' + Math.max(1, Math.floor(hoursAt(t)))] : null;
  if (hc) { el.chipT.textContent = hc[1]; show(el.chip, win(t, H0 + 0.15, H1, 0.2, 0.2)); }
  else if (chip) { el.chipT.textContent = chip[1]; show(el.chip, win(t, T(chip[0])[0] + 0.15, cEnd(chip), 0.2, 0.2), `translateY(${(-14 * (1 - eo(seg(t, T(chip[0])[0] + 0.15, T(chip[0])[0] + 0.5)))).toFixed(1)}px)`); } else show(el.chip, 0);
  const bg = BIG.find(g => t >= g[1] && t < g[2]);
  if (bg) { el.big.textContent = bg[0]; el.big.style.fontSize = bg[3] + 'px'; el.big.style.top = (bg[4] || 380) + 'px'; show(el.big, win(t, bg[1], bg[2], 0.12, 0.25), `scale(${(1 + 0.5 * (1 - eo(seg(t, bg[1], bg[1] + 0.35)))).toFixed(3)})`); } else show(el.big, 0);
  show(el.end, seg(t, 54.6, 55.2));
  show(el.fade, Math.max(1 - seg(t, 0, 0.12), seg(t, window.DURATION - 0.55, window.DURATION - 0.05)));
  captions(Math.min(t, 54.6), s[0]);
  return wait;
}
window.ready = Promise.all([fetch('out/clips.json').then(r => r.json()).then(j => { Object.assign(CLIPLEN, j); }).catch(() => {}), fetch('vo/timeline.json').then(r => r.json()), document.fonts.load('700 40px "Barlow Condensed"'), document.fonts.load('600 40px "Barlow Condensed"'), document.fonts.load('700 40px "JetBrains Mono"'), document.fonts.load('40px Anton')]).then(r => { TL = r[1]; buildChunks(); return frame(0); }).then(() => true);
window.renderFrame = frame;
if (!/capture/.test(location.search)) {
  const stage = $('stage'); let TT = 0, last = 0;
  const fit = () => { const k = Math.min(innerWidth / W, innerHeight / H); stage.style.transform = `translate(${(innerWidth - W * k) / 2}px,${(innerHeight - H * k) / 2}px) scale(${k})`; };
  addEventListener('resize', fit); fit();
  window.ready.then(() => requestAnimationFrame(function loop(now) { TT += Math.min(0.1, (now - last) / 1000 || 0); if (TT >= window.DURATION) TT = 0; frame(TT); last = now; requestAnimationFrame(loop); }));
}
</script>
</body>
</html>
