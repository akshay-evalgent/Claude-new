<script id="common" type="x-shader/x-fragment">precision highp float;
varying vec2 vUV;
uniform vec2 uRes;
uniform float uT, uL, uQ, uExpo, uWarmth;
uniform vec3 uCamPos, uCamTgt;
uniform float uFov, uRoll;
uniform float uYears, uDawn, uWarp, uTimelapse, uSlow;
uniform float uWatchH, uWatchM, uWatchS, uFrost;
uniform float uPresentY, uHandUp;
uniform vec3 uSleigh; uniform float uPitch, uGallop, uSleighOn, uSleighScale;
uniform float uDayAz, uDayAmt;
uniform sampler2D uTex0, uTex1, uTex2;

vec3 gRight, gUp, gFwd; float gFocal;
float gGlow;   // emissive glow accumulated during a march

float hash(vec2 p){ p = fract(p*vec2(123.34, 456.21)); p += dot(p, p+45.32); return fract(p.x*p.y); }
float hash1(float x){ return fract(sin(x*127.1)*43758.5453); }
float hash3(vec3 p){ p = fract(p*0.3183099 + 0.1); p *= 17.0; return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }
float vnoise(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f);
  return mix(mix(hash(i),hash(i+vec2(1,0)),f.x), mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x), f.y); }
float vnoise3(vec3 p){ vec3 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f);
  return mix(mix(mix(hash3(i),hash3(i+vec3(1,0,0)),f.x), mix(hash3(i+vec3(0,1,0)),hash3(i+vec3(1,1,0)),f.x),f.y),
             mix(mix(hash3(i+vec3(0,0,1)),hash3(i+vec3(1,0,1)),f.x), mix(hash3(i+vec3(0,1,1)),hash3(i+vec3(1,1,1)),f.x),f.y), f.z); }
float fbm(vec2 p){ float a=0.5, s=0.0; for(int i=0;i<4;i++){ s+=a*vnoise(p); p=p*2.03+vec2(1.7,9.2); a*=0.5; } return s; }
float fbm3(vec3 p){ float a=0.5, s=0.0; for(int i=0;i<3;i++){ s+=a*vnoise3(p); p=p*2.05+1.3; a*=0.5; } return s; }

mat2 rot(float a){ float c=cos(a), s=sin(a); return mat2(c,-s,s,c); }
float sdBox(vec3 p, vec3 b){ vec3 q=abs(p)-b; return length(max(q,0.0))+min(max(q.x,max(q.y,q.z)),0.0); }
float sdRBox(vec3 p, vec3 b, float r){ return sdBox(p, b-r) - r; }
float sdEll(vec3 p, vec3 r){ float k0=length(p/r); float k1=length(p/(r*r)); return k0*(k0-1.0)/max(k1,1e-5); }
float sdCap(vec3 p, vec3 a, vec3 b, float r){ vec3 pa=p-a, ba=b-a; float h=clamp(dot(pa,ba)/dot(ba,ba),0.0,1.0); return length(pa-ba*h)-r; }
float sdCapT(vec3 p, vec3 a, vec3 b, float ra, float rb){ vec3 pa=p-a, ba=b-a; float h=clamp(dot(pa,ba)/dot(ba,ba),0.0,1.0); return length(pa-ba*h)-mix(ra,rb,h); }
float sdTorus(vec3 p, vec2 t){ vec2 q=vec2(length(p.xz)-t.x,p.y); return length(q)-t.y; }
float sdCyl(vec3 p, float h, float r){ vec2 d=abs(vec2(length(p.xz),p.y))-vec2(r,h); return min(max(d.x,d.y),0.0)+length(max(d,0.0)); }
float sdLink(vec3 p, float le, float r1, float r2){ vec3 q = vec3(p.x, max(abs(p.y)-le,0.0), p.z); return length(vec2(length(q.xy)-r1,q.z)) - r2; }
float smin(float a, float b, float k){ float h=clamp(0.5+0.5*(b-a)/k,0.0,1.0); return mix(b,a,h)-k*h*(1.0-h); }
vec2 un(vec2 a, vec2 b){ return a.x<b.x ? a : b; }

// soft round flakes falling across the frame, in layers of depth
float snowfall(vec2 uv, float t, float speed, float streak, float density){
  float acc = 0.0;
  for(int L=0; L<3; L++){
    float fl = float(L);
    float sc = 7.0 + fl*6.0;
    vec2 g = uv*vec2(sc*uRes.x/uRes.y, sc);
    g.y += t*speed*(0.6 + 0.25*fl)*sc*0.12;
    g.x += sin(t*0.4 + fl)*0.6;
    vec2 cell = floor(g); vec2 f = fract(g);
    float h = hash(cell + fl*17.0);
    if(h < density){
      vec2 c = vec2(0.2 + 0.6*hash(cell+3.1), 0.5);
      vec2 d = f - c;
      d.y /= (1.0 + streak*(3.0 - fl));
      float r = (0.05 + 0.04*hash(cell+9.7))*(1.6 - 0.35*fl);
      acc += smoothstep(r, r*0.3, length(d))*(0.45 + 0.25*fl);
    }
  }
  return acc;
}

vec3 grade(vec3 col, vec2 uv){
  col *= uExpo;
  col = (col*(2.51*col+0.03))/(col*(2.43*col+0.59)+0.14);       // ACES fit
  col = pow(clamp(col,0.0,1.0), vec3(1.0/2.2));
  float luma = dot(col, vec3(0.299,0.587,0.114));
  col = mix(col, vec3(luma), 0.12);
  vec3 cool = vec3(-0.015, 0.0, 0.03), warm = vec3(0.03, 0.01, -0.03);
  col += mix(cool, warm, uWarmth)*(1.0-luma) ;
  col += mix(warm, cool, 0.6)*0.0;
  float v = length((uv-0.5)*vec2(0.85,1.0))*1.35;
  col *= 1.0 - 0.45*pow(v, 2.4);
  float frame = floor(uT*24.0);
  col += (hash(gl_FragCoord.xy + vec2(frame*7.13, frame*3.71)) - 0.5)*0.045*(1.0-0.5*luma);
  return clamp(col, 0.0, 1.0);
}

<script id="s-watch" type="x-shader/x-fragment">// THE WATCH. Units are centimetres. The watch lies open on a gloved palm, dial up (+y),
// 12 o'clock toward +z (the top of the vertical frame), its chain running up and away.
const float WR = 2.2;           // case radius
const float DIAL_Y = 0.80;

float handShape(vec3 p, float ang, float len, float w, float tail, float y, float h){
  vec2 dir = vec2(sin(ang), cos(ang));
  float along = dot(p.xz, dir);
  float perp = dot(p.xz, vec2(dir.y, -dir.x));
  float t = clamp(along/len, 0.0, 1.0);
  float width = mix(w, w*0.22, t*t);
  float d = max(abs(perp) - width, max(-along - tail, along - len));
  d = min(d, length(p.xz) - w*1.7);
  return max(d, abs(p.y - y) - h);
}

vec2 mapW(vec3 p){
  // glove: palm slab, four fingers curled over the left edge of the case, thumb on the right
  float palm = sdEll(p - vec3(-0.4, -1.05, -0.8), vec3(4.6, 1.05, 5.4));
  float fing = 1e9;
  for(int i=0;i<4;i++){
    float fi = float(i);
    float z = 1.7 - fi*1.2;
    float r = 0.66 - fi*0.05;
    vec3 a = vec3(-5.0, -0.7, z + 0.25);
    vec3 b = vec3(-3.35, 0.75, z);
    vec3 c = vec3(-2.45, 0.98, z - 0.12);
    fing = min(fing, sdCap(p, a, b, r));
    fing = min(fing, sdCap(p, b, c, r*0.9));
  }
  float thumb = sdCapT(p, vec3(4.2, -0.6, -3.6), vec3(2.75, 0.62, -1.75), 0.8, 0.62);
  float glove = smin(palm, smin(fing, thumb, 0.35), 0.7);
  glove += 0.012*vnoise3(p*9.0);                                        // leather grain
  vec2 res = vec2(glove, 1.0);

  // case, bezel, pendant, crown, bow
  float cs = sdCyl(p - vec3(0.0, 0.40, 0.0), 0.38, WR - 0.08) - 0.08;
  float bez = sdTorus(p - vec3(0.0, DIAL_Y + 0.02, 0.0), vec2(WR - 0.1, 0.13));
  cs = min(cs, bez);
  vec3 pc = p - vec3(0.0, 0.42, WR + 0.12);
  float pend = sdCyl(pc.xzy, 0.22, 0.17);
  vec3 pk = p - vec3(0.0, 0.42, WR + 0.5);
  float knurl = 0.025*sin(atan(pk.x, pk.y)*18.0);
  float crown = sdCyl(pk.xzy, 0.2, 0.30 + knurl) - 0.02;
  float bow = sdTorus(p - vec3(0.0, 0.42, WR + 1.25), vec2(0.62, 0.085));
  res = un(res, vec2(min(cs, min(pend, min(crown, bow))), 2.0));

  // chain: links alternate flat and upright, running up the frame and over the fingers
  float ch = 1e9;
  for(int i=0;i<7;i++){
    float fi = float(i);
    vec3 c = vec3(0.12*sin(fi*0.9), 0.35 - 0.02*fi, WR + 2.1 + fi*0.62);
    vec3 q = p - c;
    float l = (mod(fi, 2.0) < 0.5) ? sdLink(vec3(q.y, q.z, q.x), 0.12, 0.2, 0.055)
                                   : sdLink(vec3(q.x, q.z, q.y), 0.12, 0.2, 0.055);
    ch = min(ch, l);
  }
  res = un(res, vec2(ch, 5.0));

  // hands
  float hh = handShape(p, uWatchH, 1.05, 0.10, 0.2, DIAL_Y + 0.03, 0.018);
  float mh = handShape(p, uWatchM, 1.62, 0.07, 0.25, DIAL_Y + 0.07, 0.016);
  float sh = handShape(p, uWatchS, 1.78, 0.025, 0.5, DIAL_Y + 0.11, 0.014);
  res = un(res, vec2(min(hh, mh), 4.0));
  res = un(res, vec2(sh, 6.0));
  return res;
}

vec3 calcN(vec3 p){
  vec2 e = vec2(0.003, 0.0);
  return normalize(vec3(mapW(p+e.xyy).x - mapW(p-e.xyy).x, mapW(p+e.yxy).x - mapW(p-e.yxy).x, mapW(p+e.yyx).x - mapW(p-e.yyx).x));
}
float shadowW(vec3 ro, vec3 rd){
  float res = 1.0, t = 0.02;
  for(int i=0;i<24;i++){
    float h = mapW(ro + rd*t).x;
    res = min(res, 10.0*h/t);
    t += clamp(h, 0.02, 0.5);
    if(res < 0.02 || t > 8.0) break;
  }
  return clamp(res, 0.0, 1.0);
}

// out-of-focus night behind the hand: dark blue with soft warm and green discs
vec3 bokehBG(vec2 uv){
  vec3 col = mix(vec3(0.004, 0.007, 0.016), vec3(0.012, 0.02, 0.04), uv.y);
  vec2 g = uv*vec2(uRes.x/uRes.y, 1.0)*4.0;
  for(int j=-1;j<=1;j++) for(int i=-1;i<=1;i++){
    vec2 c = floor(g) + vec2(float(i), float(j));
    float h = hash(c + 4.0);
    if(h > 0.55){
      vec2 pos = c + vec2(hash(c+1.3), hash(c+7.1));
      float r = 0.35 + 0.25*hash(c+2.2);
      float d = length(g - pos);
      float disc = smoothstep(r, r*0.86, d)*(0.7 + 0.3*smoothstep(r*0.6, r*0.95, d));
      vec3 tint = h > 0.8 ? vec3(1.0, 0.62, 0.3) : vec3(0.35, 0.9, 0.6);
      col += disc*tint*0.06;
    }
  }
  return col;
}

vec3 envW(vec3 rd){
  vec3 c = mix(vec3(0.01, 0.015, 0.03), vec3(0.06, 0.08, 0.12), clamp(rd.y*0.5+0.5, 0.0, 1.0));
  c += vec3(1.0, 0.65, 0.35)*pow(max(dot(rd, normalize(vec3(0.5, 0.6, 0.6))), 0.0), 18.0)*2.5;     // the lantern
  c += vec3(0.6, 0.75, 1.0)*pow(max(dot(rd, normalize(vec3(-0.6, 0.7, -0.2))), 0.0), 12.0)*0.8;   // the moon
  c += vec3(0.3, 0.9, 0.6)*pow(max(dot(rd, normalize(vec3(-0.2, 0.9, 0.5))), 0.0), 6.0)*0.25;     // aurora
  return c;
}

vec3 dialColor(vec3 p){
  vec2 tuv = vec2(0.5 + p.x/(2.0*(WR-0.12)), 0.5 - p.z/(2.0*(WR-0.12)));
  return texture2D(uTex0, tuv).rgb;
}

vec3 shadeW(vec3 p, vec3 n, vec3 rd, float m){
  vec3 Lm = normalize(vec3(-0.6, 0.75, -0.25));   // moon, cool, from front left
  vec3 Ll = normalize(vec3(0.5, 0.55, 0.65));     // lantern, warm, from behind right
  vec3 cm = vec3(0.55, 0.65, 0.95)*1.1, cl = vec3(1.0, 0.62, 0.32)*1.6;
  float sm = shadowW(p + n*0.01, Lm), sl = shadowW(p + n*0.01, Ll);
  float dm = max(dot(n, Lm), 0.0)*sm, dl = max(dot(n, Ll), 0.0)*sl;
  vec3 refl = reflect(rd, n);
  float fres = pow(1.0 - max(dot(-rd, n), 0.0), 5.0);
  vec3 col;
  if(m < 1.5){                                    // black leather glove
    vec3 alb = vec3(0.018, 0.016, 0.015);
    col = alb*(cm*dm + cl*dl + 0.15);
    float sp = pow(max(dot(refl, Lm), 0.0), 30.0)*sm*0.35 + pow(max(dot(refl, Ll), 0.0), 40.0)*sl*0.6;
    col += sp*mix(cm, cl, 0.5)*(0.3 + 0.7*vnoise3(p*6.0));
    col += envW(refl)*0.05*(0.3 + fres);
  } else if(m < 2.5 || m > 4.5 && m < 5.5){       // gold case and chain
    vec3 gold = vec3(1.0, 0.72, 0.36);
    vec3 e = envW(refl);
    col = gold*(e*0.9 + cm*pow(max(dot(refl, Lm),0.0), 50.0)*sm*1.5 + cl*pow(max(dot(refl, Ll),0.0), 40.0)*sl*2.5);
    col += gold*(cm*dm + cl*dl)*0.12;
    // the dial sits inside the bezel on the case top
    float r = length(p.xz);
    if(m < 2.5 && r < WR - 0.2 && p.y > DIAL_Y - 0.03){
      vec3 dc = dialColor(p);
      float sd = shadowW(p + vec3(0.0, 0.01, 0.0), Lm)*0.85 + 0.15;
      col = dc*(cm*0.42*sd + cl*dl*0.3 + 0.07);
    }
  } else if(m < 4.5){                             // blued steel hands
    col = vec3(0.02, 0.03, 0.06)*(cm*dm + cl*dl + 0.1) + vec3(0.2,0.3,0.7)*pow(max(dot(refl, Lm),0.0), 20.0)*0.5;
  } else {                                        // the seconds hand, red
    col = vec3(0.55, 0.05, 0.04)*(cm*dm + cl*dl + 0.15) + cl*pow(max(dot(refl, Ll),0.0), 30.0)*0.3;
  }
  return col;
}

// the crystal: a shallow sphere cap over the dial, frosted at the rim
vec4 crystal(vec3 ro, vec3 rd){
  const float RS = 5.2;
  vec3 c = vec3(0.0, DIAL_Y + 0.45 - RS, 0.0);
  vec3 oc = ro - c;
  float b = dot(oc, rd), cc = dot(oc, oc) - RS*RS, h = b*b - cc;
  if(h < 0.0) return vec4(-1.0);
  float t = -b - sqrt(h);
  vec3 p = ro + rd*t;
  if(p.y < DIAL_Y + 0.02 || length(p.xz) > WR - 0.12) return vec4(-1.0);
  return vec4(p, t);
}

vec3 render(vec3 ro, vec3 rd, vec2 uv){
  float t = 0.0; float m = -1.0;
  for(int i=0;i<110;i++){
    vec2 h = mapW(ro + rd*t);
    if(h.x < 0.0008*t){ m = h.y; break; }
    t += h.x*0.9;
    if(t > 40.0) break;
  }
  vec3 col;
  if(m > 0.0){
    vec3 p = ro + rd*t;
    vec3 n = calcN(p);
    col = shadeW(p, n, rd, m);
  } else {
    col = bokehBG(uv);
  }
  vec4 cr = crystal(ro, rd);
  if(cr.w > 0.0 && (m < 0.0 || cr.w < t)){
    vec3 p = cr.xyz;
    vec3 n = normalize(p - vec3(0.0, DIAL_Y + 0.45 - 5.2, 0.0));
    float fres = 0.04 + 0.96*pow(1.0 - max(dot(-rd, n), 0.0), 5.0);
    col = mix(col, envW(reflect(rd, n)), clamp(fres*1.5, 0.0, 1.0));
    // frost: feathered crystals growing in from the rim
    float r = length(p.xz)/(WR - 0.12);
    float ang = atan(p.z, p.x);
    float feather = abs(sin(ang*23.0 + 6.0*fbm(p.xz*1.3))) ;
    float fr = fbm(p.xz*3.0 + 2.0) + 0.35*fbm(p.xz*11.0);
    float frost = smoothstep(0.55 - 0.5*uFrost, 1.05, r + 0.35*fr - 0.25*feather*r) * uFrost;
    frost = clamp(frost*1.4, 0.0, 0.85);
    vec3 frostCol = vec3(0.55, 0.62, 0.72)*0.22 + vec3(1.0, 0.7, 0.45)*0.06;
    col = mix(col, frostCol, frost);
  }
  // a few out-of-focus flakes drifting between the lens and the watch
  col += snowfall(uv, uT, 0.25, 0.0, 0.18)*vec3(0.18, 0.2, 0.24);
  return col;
}
</script>
<script id="s-ext" type="x-shader/x-fragment">// THE NORTH POLE. Metres. A log house faces the camera (its front wall at z = 9.5).
// uYears ages it: snow drifts up the walls and icicles lengthen. uDawn moves night to dawn.
const vec3 HOUSE = vec3(0.0, 0.0, 12.0);
const vec3 WIN = vec3(-1.3, 1.55, 9.5);     // the window, centre of its outer face

float age(){ return clamp(uYears/23.0, 0.0, 1.0); }

float groundH(vec2 xz){
  float h = 0.35*fbm(xz*0.07) + 0.05*vnoise(xz*0.8) - 0.2;
  vec2 d2 = abs(xz - HOUSE.xz) - vec2(3.0, 2.5);
  float d = length(max(d2, 0.0));
  h += (0.15 + 0.85*age())*exp(-d*1.1)*(0.8 + 0.4*vnoise(xz*1.5));     // drifts against the walls
  return h;
}

float sdRig(vec3 p, out float mat){
  // the sleigh and its team, in the rig's own frame: the team runs along +x
  mat = 20.0;
  vec3 q = (p - uSleigh)/uSleighScale;
  q.xy = rot(uPitch)*q.xy;
  float bound = length(q - vec3(1.6, 1.0, 0.0)) - 4.2;
  if(bound > 0.5) return bound*uSleighScale;
  // sleigh: body, seat back, curled runners
  vec3 sq = q;
  float body = sdRBox(sq - vec3(-0.15, 0.62, 0.0), vec3(0.85, 0.3, 0.5), 0.08);
  body = smin(body, sdRBox(sq - vec3(-0.85, 0.95, 0.0), vec3(0.18, 0.55, 0.52), 0.1), 0.15);
  body = smin(body, sdCap(sq, vec3(0.65, 0.5, 0.0), vec3(0.95, 0.95, 0.0), 0.25), 0.2);     // curved prow
  float run = 1e9;
  vec3 rq = vec3(sq.x, sq.y, abs(sq.z) - 0.45);
  run = min(run, sdCap(rq, vec3(-1.0, 0.05, 0.0), vec3(0.9, 0.05, 0.0), 0.04));
  run = min(run, sdTorus(vec3(rq.x - 0.9, rq.z, rq.y - 0.35), vec2(0.3, 0.04)));
  run = min(run, sdCap(rq, vec3(-0.6, 0.05, 0.0), vec3(-0.6, 0.4, 0.0), 0.035));
  run = min(run, sdCap(rq, vec3(0.4, 0.05, 0.0), vec3(0.4, 0.4, 0.0), 0.035));
  // Santa and the sack
  float santa = sdEll(sq - vec3(-0.35, 1.25, 0.0), vec3(0.38, 0.5, 0.42));
  santa = smin(santa, length(sq - vec3(-0.3, 1.88, 0.0)) - 0.2, 0.08);
  float hat = sdCapT(sq, vec3(-0.32, 2.0, 0.0), vec3(-0.55, 2.35, 0.1), 0.17, 0.03);
  float sack = sdEll(sq - vec3(-0.95, 1.45, 0.05), vec3(0.32, 0.42, 0.38));
  float d = min(body, run);
  mat = body < run ? 21.0 : 22.0;
  if(santa < d){ d = santa; mat = 23.0; }
  if(hat < d){ d = hat; mat = 23.0; }
  if(sack < d){ d = sack; mat = 24.0; }
  // reindeer, two pairs
  for(int i=0;i<4;i++){
    float fi = float(i);
    vec3 o = vec3(2.1 + 1.3*floor(fi*0.5), 0.0, mod(fi, 2.0) < 0.5 ? -0.42 : 0.42);
    vec3 r = sq - o;
    float ph = uGallop + fi*1.3;
    float rb = sdEll(r - vec3(0.0, 1.0, 0.0), vec3(0.5, 0.25, 0.19));
    rb = smin(rb, sdCap(r, vec3(0.35, 1.1, 0.0), vec3(0.6, 1.5, 0.0), 0.11), 0.1);       // neck
    rb = smin(rb, sdEll(r - vec3(0.75, 1.55, 0.0), vec3(0.2, 0.1, 0.09)), 0.06);         // head
    vec3 rz = vec3(r.x, r.y, abs(r.z));
    float ant = sdCap(rz, vec3(0.62, 1.65, 0.04), vec3(0.5, 2.0, 0.18), 0.022);
    ant = min(ant, sdCap(rz, vec3(0.55, 1.85, 0.12), vec3(0.72, 2.0, 0.2), 0.016));
    ant = min(ant, sdCap(rz, vec3(0.5, 2.0, 0.18), vec3(0.35, 2.12, 0.16), 0.014));
    float legs = 1e9;
    for(int k=0;k<4;k++){
      float fk = float(k);
      float lx = fk < 1.5 ? 0.32 : -0.32;
      float lz = mod(fk, 2.0) < 0.5 ? 0.1 : -0.1;
      float sw = sin(ph + fk*1.7)*0.55;
      vec3 a = vec3(lx, 0.95, lz);
      vec3 b = a + vec3(sin(sw)*0.4, -cos(sw)*0.4, 0.0);
      vec3 c = b + vec3(sin(sw*1.6 + 0.4)*0.38, -cos(sw*1.6 + 0.4)*0.38, 0.0);
      legs = min(legs, min(sdCap(r, a, b, 0.055), sdCap(r, b, c, 0.04)));
    }
    float deer = smin(rb, legs, 0.06);
    if(deer < d){ d = deer; mat = 25.0; }
    if(ant < d){ d = ant; mat = 26.0; }
    // reins
    float rein = sdCap(sq, vec3(0.9, 0.95, 0.0), r.xyz*0.0 + o + vec3(0.7, 1.45, 0.0), 0.012);
    if(rein < d){ d = rein; mat = 22.0; }
  }
  return d*uSleighScale;
}

vec2 mapE(vec3 p){
  vec2 res = vec2(p.y - groundH(p.xz), 1.0);
  // the house
  vec3 h = p - HOUSE;
  float logs = 0.045*(1.0 - pow(abs(cos(p.y*3.14159/0.32)), 4.0));
  float walls = sdBox(h - vec3(0.0, 1.6, 0.0), vec3(3.0, 1.6, 2.5)) - logs;
  // corner log ends
  vec3 ce = vec3(abs(h.x) - 3.05, h.y, abs(h.z) - 2.55);
  walls = min(walls, sdBox(ce - vec3(0.0, 1.6, 0.0), vec3(0.12, 1.6, 0.12)) - logs);
  // window recess and door recess
  walls = max(walls, -sdBox(p - WIN, vec3(0.62, 0.62, 0.25)));
  walls = max(walls, -sdBox(p - vec3(1.4, 1.05, 9.5), vec3(0.52, 1.05, 0.12)));
  res = un(res, vec2(walls, 2.0));
  // window frame, mullions and sill
  vec3 w = p - WIN;
  float frame = max(sdBox(w, vec3(0.66, 0.66, 0.08)), -sdBox(w, vec3(0.56, 0.56, 0.3)));
  frame = min(frame, sdBox(w - vec3(0.0, 0.0, 0.08), vec3(0.025, 0.56, 0.03)));
  frame = min(frame, sdBox(w - vec3(0.0, 0.0, 0.08), vec3(0.56, 0.025, 0.03)));
  frame = min(frame, sdBox(w - vec3(0.0, -0.66, -0.08), vec3(0.75, 0.05, 0.16)));
  res = un(res, vec2(frame, 3.0));
  float pane = sdBox(w - vec3(0.0, 0.0, 0.1), vec3(0.56, 0.56, 0.01));
  res = un(res, vec2(pane, 4.0));
  // door
  float door = sdBox(p - vec3(1.4, 1.05, 9.56), vec3(0.5, 1.03, 0.04));
  res = un(res, vec2(door, 3.0));
  // roof: a gable along x, with a thick snow cap
  float dz = abs(h.z);
  vec2 nr = normalize(vec2(0.68, 1.0));
  float pl = dot(vec2(dz, h.y - 4.95), nr);
  float bx = max(abs(h.x) - 3.45, dz - 3.15);
  float roof = max(max(pl, -(pl + 0.22)), bx);
  res = un(res, vec2(roof, 3.0));
  float snowcap = max(max(pl - 0.22 - 0.08*vnoise(p.xz*2.0), -pl), max(abs(h.x) - 3.55, dz - 3.25));
  res = un(res, vec2(snowcap, 1.0));
  float chim = sdBox(h - vec3(1.8, 4.6, 0.8), vec3(0.33, 1.0, 0.33));
  res = un(res, vec2(chim, 5.0));
  // icicles hang from the front eave and grow with the years
  if(p.z < 9.3 && p.z > 8.6 && p.y > 1.2 && p.y < 3.0 && abs(p.x) < 3.4){
    float cw = 0.16;
    float id = floor(p.x/cw);
    float lx = (fract(p.x/cw) - 0.5)*cw;
    float len = (0.08 + 0.45*hash1(id*1.7))*(0.3 + 1.7*age());
    float top = 2.80;
    float tt = clamp((top - p.y)/len, 0.0, 1.0);
    float r = 0.035*(1.0 - tt) + 0.003;
    float ic = max(length(vec2(lx, p.z - 8.95)) - r, max(p.y - top, top - len - p.y));
    res = un(res, vec2(ic*0.8, 6.0));
  }
  // the lantern by the door
  res = un(res, vec2(length(p - vec3(2.15, 2.0, 9.35)) - 0.09, 7.0));
  // pines for scale, far back
  for(int i=0;i<3;i++){
    float fi = float(i);
    vec3 tp = p - vec3(-9.0 + fi*8.5, 0.0, 24.0 + 4.0*hash1(fi));
    float hgt = 6.0 + 2.0*hash1(fi + 3.0);
    float tr = max(length(tp.xz) - (1.0 - tp.y/hgt)*1.9 - 0.15*sin(tp.y*5.0), max(-tp.y, tp.y - hgt));
    res = un(res, vec2(tr*0.7, 8.0));
  }
  // the rig
  if(uSleighOn > 0.5){
    float rm;
    float rd = sdRig(p, rm);
    res = un(res, vec2(rd, rm));
  }
  return res;
}

vec3 calcN(vec3 p){
  vec2 e = vec2(0.004, 0.0);
  return normalize(vec3(mapE(p+e.xyy).x - mapE(p-e.xyy).x, mapE(p+e.yxy).x - mapE(p-e.yxy).x, mapE(p+e.yyx).x - mapE(p-e.yyx).x));
}
float shadowE(vec3 ro, vec3 rd){
  float res = 1.0, t = 0.05;
  for(int i=0;i<28;i++){
    float h = mapE(ro + rd*t).x;
    res = min(res, 12.0*h/t);
    t += clamp(h, 0.05, 1.2);
    if(res < 0.02 || t > 30.0) break;
  }
  return clamp(res, 0.0, 1.0);
}

vec3 sunDir(){ return normalize(mix(vec3(-0.5, 0.42, -0.75), vec3(0.85, 0.10, 0.55), uDawn)); }
vec3 sunCol(){ return mix(vec3(0.42, 0.52, 0.85)*0.75, vec3(1.0, 0.55, 0.38)*2.2, uDawn); }

vec3 skyE(vec3 rd){
  float y = max(rd.y, 0.0);
  vec3 night = mix(vec3(0.02, 0.035, 0.07), vec3(0.003, 0.006, 0.018), pow(y, 0.5));
  vec3 dawn = mix(vec3(1.0, 0.5, 0.38)*0.75, vec3(0.10, 0.16, 0.36), pow(y, 0.45));
  dawn += vec3(1.0, 0.6, 0.35)*pow(max(dot(rd, sunDir()), 0.0), 6.0)*0.8;
  vec3 col = mix(night, dawn, uDawn);
  // stars
  vec3 sp = rd*180.0;
  vec3 ci = floor(sp);
  float h = hash3(ci);
  if(h > 0.985){
    vec3 cpos = ci + 0.5 + 0.3*(vec3(hash3(ci+1.0), hash3(ci+2.0), hash3(ci+3.0)) - 0.5);
    float d = length(sp - cpos);
    col += vec3(0.8, 0.85, 1.0)*smoothstep(0.35, 0.0, d)*(h - 0.985)*60.0*(1.0 - uDawn)*smoothstep(0.0, 0.1, rd.y);
  }
  // aurora: curtains on a sheet high above, sampled at a few heights
  if(rd.y > 0.03 && uDawn < 0.99){
    vec3 au = vec3(0.0);
    for(int i=0;i<7;i++){
      float fi = float(i);
      float t = (2.0 + fi*0.22)/rd.y;
      vec2 q = rd.xz*t;
      float curtain = fbm(vec2(q.x*0.35 + 0.05*uT, q.y*0.12 + 2.0));
      float band = exp(-abs(curtain - 0.52)*14.0);
      float k = fi/6.0;
      au += mix(vec3(0.1, 1.0, 0.5), vec3(0.5, 0.25, 0.9), k*k)*band*(1.0 - k*0.7);
    }
    col += au*0.16*smoothstep(0.03, 0.35, rd.y)*(1.0 - uDawn);
  }
  return col;
}

// the lit window, from outside: warm frosted glass with a woman's silhouette waiting behind it
vec3 windowGlow(vec3 p){
  vec2 w = (p.xy - WIN.xy)/0.56;                  // -1..1 across the pane
  float warm = mix(1.0, 0.45, uDawn*0.5);
  vec3 interior = vec3(1.0, 0.5, 0.2)*(1.1 - 0.45*length(w))*warm;
  // silhouette: head, bun, shoulders and body, slightly to the right of centre
  vec2 s = w - vec2(0.18, 0.0);
  float stoop = age()*0.06;
  float head = length(s - vec2(-stoop, 0.42 - stoop)) - 0.20;
  float bun = length(s - vec2(0.12 - stoop, 0.55 - stoop)) - 0.08;
  float body = length((s - vec2(0.0, -0.62))*vec2(0.85, 0.7)) - 0.55;
  body = smin(body, length((s - vec2(0.0, 0.18))*vec2(1.0, 1.4)) - 0.09, 0.08);
  float sil = min(min(head, bun), body);
  float shade = smoothstep(0.08, -0.06, sil);                       // soft, the glass is frosted
  vec3 col = mix(interior, interior*0.06, shade*0.96);
  // frost at the corners of each pane
  vec2 cell = abs(fract((w*0.5 + 0.5)*2.0) - 0.5)*2.0;             // 0 at centre of a pane, 1 at its edges
  float frost = smoothstep(0.55, 1.1, max(cell.x, cell.y) + 0.35*fbm(p.xy*9.0));
  col = mix(col, vec3(0.75, 0.82, 0.95)*(0.25 + 0.4*uDawn), frost*0.7);
  return col*0.5;
}

vec3 shadeE(vec3 p, vec3 n, vec3 rd, float m){
  vec3 L = sunDir(); vec3 Lc = sunCol();
  float sh = shadowE(p + n*0.02, L);
  float dif = max(dot(n, L), 0.0)*sh;
  vec3 amb = mix(vec3(0.05, 0.10, 0.12), vec3(0.16, 0.18, 0.30), uDawn)*(0.6 + 0.4*n.y);
  // the window and the lantern throw warm light on the snow
  vec3 lw = WIN + vec3(0.0, 0.0, -0.4) - p;
  float dw = length(lw);
  vec3 warmL = vec3(1.0, 0.55, 0.25)*1.4*max(dot(n, lw/dw), 0.0)/(1.0 + dw*dw*0.6)*(1.0 - 0.6*uDawn);
  vec3 ll = vec3(2.15, 2.0, 9.15) - p; float dl = length(ll);
  warmL += vec3(1.0, 0.6, 0.3)*1.0*max(dot(n, ll/dl), 0.0)/(1.0 + dl*dl*1.2);
  vec3 alb; float spec = 0.0;
  if(m < 1.5){ alb = vec3(0.86, 0.9, 0.96); spec = 0.25;
    float glint = step(0.996, hash(floor(p.xz*90.0)))*pow(max(dot(reflect(rd, n), L), 0.0), 4.0);
    alb += glint*3.0; }
  else if(m < 2.5){ alb = vec3(0.16, 0.09, 0.05)*(0.7 + 0.6*fbm3(p*vec3(3.0, 0.5, 3.0))); }
  else if(m < 3.5){ alb = vec3(0.10, 0.06, 0.035); }
  else if(m < 4.5){ return windowGlow(p); }
  else if(m < 5.5){ alb = vec3(0.18, 0.16, 0.15)*(0.6 + 0.8*vnoise3(p*6.0)); }
  else if(m < 6.5){ alb = vec3(0.65, 0.78, 0.9); spec = 1.0; }
  else if(m < 7.5){ return vec3(1.0, 0.7, 0.35)*5.0; }
  else if(m < 8.5){ alb = mix(vec3(0.03, 0.06, 0.04), vec3(0.8, 0.85, 0.9), smoothstep(0.4, 0.7, n.y + 0.3*vnoise3(p*3.0))); }
  else if(m < 21.5){ alb = vec3(0.35, 0.03, 0.03); spec = 0.6; }
  else if(m < 22.5){ alb = vec3(0.6, 0.45, 0.2); spec = 0.8; }
  else if(m < 23.5){ alb = vec3(0.32, 0.03, 0.03); }
  else if(m < 24.5){ alb = vec3(0.22, 0.16, 0.10); }
  else if(m < 25.5){ alb = vec3(0.13, 0.08, 0.05); }
  else { alb = vec3(0.4, 0.35, 0.28); }
  vec3 col = alb*(Lc*dif + amb + warmL);
  col += spec*Lc*pow(max(dot(reflect(rd, n), L), 0.0), 24.0)*sh*0.5;
  return col;
}

// light-speed: stars stretch into lines radiating from the point the sleigh is flying into
vec3 warpStars(vec2 uv){
  vec3 d = normalize(uSleigh + vec3(1.0, 1.5, 0.0) - uCamPos);
  float z = dot(d, gFwd);
  vec2 vp = vec2(dot(d, gRight), dot(d, gUp))/max(z, 0.05)*gFocal;
  vec2 ndc = (uv - 0.5)*vec2(uRes.x/uRes.y, 1.0);
  vec2 rel = ndc - vp;
  float r = length(rel);
  float a = atan(rel.y, rel.x);
  float acc = 0.0;
  for(int L=0; L<2; L++){
    float fl = float(L);
    float n = 70.0 + 50.0*fl;
    float ac = a/6.28318*n;
    float ci = floor(ac);
    float h = hash(vec2(ci, fl*13.0));
    float ang = abs(fract(ac) - 0.5)/n*6.28318*r;               // perpendicular distance in screen units
    float r0 = 0.03 + 0.9*hash(vec2(ci, 7.0 + fl));
    float r1 = r0*(1.0 + uWarp*(2.5 + 2.0*h));
    float along = smoothstep(r0, r0 + 0.01, r)*smoothstep(r1 + 0.02, r1, r);
    float line = smoothstep(0.0025, 0.0, ang);
    acc += line*along*step(0.35, h)*(0.6 + 0.6*h);
  }
  return vec3(0.75, 0.85, 1.0)*acc*uWarp*1.6;
}

vec3 render(vec3 ro, vec3 rd, vec2 uv){
  float t = 0.0, m = -1.0;
  for(int i=0;i<140;i++){
    vec2 h = mapE(ro + rd*t);
    if(h.x < 0.0008*t){ m = h.y; break; }
    t += h.x*0.85;
    if(t > 120.0) break;
  }
  vec3 col;
  if(m > 0.0){
    vec3 p = ro + rd*t;
    col = shadeE(p, calcN(p), rd, m);
    float fog = 1.0 - exp(-t*0.012);
    col = mix(col, mix(vec3(0.03, 0.05, 0.08), vec3(0.42, 0.34, 0.40), uDawn), fog);
  } else {
    col = skyE(rd);
  }
  // the sleigh's lantern, a point of light that stays visible as the sleigh shrinks
  if(uSleighOn > 0.5){
    vec3 lp = uSleigh + vec3(0.0, 1.2*uSleighScale, 0.0);
    vec3 d = lp - ro; float tl = dot(d, rd);
    if(tl > 0.0 && (m < 0.0 || tl < t + 0.5)){
      float dist = length(d - rd*tl);
      col += vec3(1.0, 0.75, 0.4)*0.02/(dist*dist/(tl*tl)*4000.0 + 0.02)*0.08*(1.0 - uDawn*0.7);
    }
  }
  col = mix(col, vec3(0.0), uWarp*0.85);
  if(uWarp > 0.0) col += warpStars(uv);
  float fall = 0.9 + 6.0*uTimelapse;
  col += snowfall(uv, uT, fall, 2.5*uTimelapse, 0.35)*mix(vec3(0.25, 0.3, 0.38), vec3(0.35, 0.3, 0.32), uDawn)*(1.0 - uWarp);
  return col;
}

<script id="s-room" type="x-shader/x-fragment">// THE WORKSHOP ROOM. Metres. Inside a 6 x 6 m room. Window in the back wall (z = 3),
// door in the left wall (x = -3) with growth marks on its casing, pendulum clock on the right wall,
// a desk with a screen in the back-left corner, an oil lamp on the sill, and her at the window.
const vec3 WINC = vec3(0.9, 1.55, 3.0);
const vec2 WINH = vec2(0.62, 0.6);
const vec3 HER = vec3(0.9, 0.0, 2.45);
const vec3 LAMP = vec3(0.42, 1.08, 2.9);
const vec3 CLOCK = vec3(2.79, 1.92, 0.2);
const float CLOCK_R = 0.18;

float ageR(){ return clamp(uYears/23.0, 0.0, 1.0); }

float sdHer(vec3 p, out float mat){
  vec3 q = p - HER;
  float a = ageR();
  float stoop = a*0.07;
  mat = 31.0;
  float skirt = sdCapT(q, vec3(0.0, 0.05, 0.0), vec3(0.0, 0.95, 0.0), 0.37, 0.2);
  float torso = sdEll(q - vec3(0.0, 1.18, stoop*0.5), vec3(0.2, 0.3, 0.14));
  float body = smin(skirt, torso, 0.12);
  vec3 qa = vec3(abs(q.x), q.y, q.z);
  float arms = sdCap(qa, vec3(0.2, 1.37, stoop*0.6), vec3(0.25, 1.06, 0.06), 0.055);
  arms = min(arms, sdCap(qa, vec3(0.25, 1.06, 0.06), vec3(0.09, 0.9, 0.17), 0.048));
  body = smin(body, arms, 0.05);
  float shawl = sdEll(q - vec3(0.0, 1.32, stoop*0.6), vec3(0.27, 0.19, 0.18));
  shawl = max(shawl, -(q.y - 1.12));
  vec3 hc = vec3(0.0, 1.64 - stoop*0.6, stoop*1.5);
  float neck = sdCap(q, vec3(0.0, 1.42, stoop*0.6), hc - vec3(0.0, 0.08, 0.0), 0.05);
  float head = length(q - hc) - 0.102;
  float hair = length(q - hc - vec3(0.0, 0.016, -0.014)) - 0.112;
  hair = min(hair, length(q - hc - vec3(0.0, 0.075, -0.085)) - 0.062);   // the bun
  hair = max(hair, q.z - hc.z - 0.03);                                   // leave the face open
  float d = body;
  if(shawl < d){ d = shawl; mat = 32.0; }
  float skin = min(neck, head);
  if(skin < d){ d = skin; mat = 33.0; }
  if(hair < d){ d = hair; mat = 34.0; }
  return d;
}

vec2 mapR(vec3 p){
  // shell: walls, floor, ceiling, with the window and door cut out
  float shell = max(sdBox(p - vec3(0.0, 1.35, 0.0), vec3(3.3, 1.65, 3.3)), -sdBox(p - vec3(0.0, 1.35, 0.0), vec3(3.0, 1.35, 3.0)));
  shell = max(shell, -sdBox(p - WINC, vec3(WINH, 0.5)));
  shell = max(shell, -sdBox(p - vec3(-3.1, 1.05, 0.6), vec3(0.5, 1.05, 0.5)));
  vec2 res = vec2(shell, 1.0);
  // ceiling beams
  float bz = mod(p.z + 0.4, 1.2) - 0.6;
  res = un(res, vec2(max(sdBox(vec3(p.x, p.y - 2.62, bz), vec3(3.0, 0.09, 0.08)), abs(p.z) - 3.0), 2.0));
  // window: mullions, sill
  vec3 w = p - WINC;
  float mull = min(sdBox(w - vec3(0.0, 0.0, 0.05), vec3(0.025, WINH.y, 0.025)), sdBox(w - vec3(0.0, 0.0, 0.05), vec3(WINH.x, 0.025, 0.025)));
  mull = min(mull, sdBox(w - vec3(0.0, -WINH.y - 0.03, -0.06), vec3(WINH.x + 0.1, 0.03, 0.12)));
  res = un(res, vec2(mull, 2.0));
  // door casing; the marks are on the board at z in [1.10, 1.22]
  float cas = sdBox(p - vec3(-2.985, 1.1, 1.16), vec3(0.025, 1.12, 0.06));
  cas = min(cas, sdBox(p - vec3(-2.985, 1.1, 0.04), vec3(0.025, 1.12, 0.06)));
  cas = min(cas, sdBox(p - vec3(-2.985, 2.16, 0.6), vec3(0.025, 0.06, 0.62)));
  res = un(res, vec2(cas, 3.0));
  // pendulum clock
  float ck = sdRBox(p - vec3(2.9, 1.5, 0.2), vec3(0.11, 0.66, 0.25), 0.02);
  ck = min(ck, sdRBox(p - vec3(2.88, 2.2, 0.2), vec3(0.13, 0.06, 0.29), 0.02));
  res = un(res, vec2(ck, 4.0));
  // desk, monitor
  float desk = sdBox(p - vec3(-1.9, 0.76, 2.35), vec3(0.75, 0.025, 0.42));
  vec3 lq = vec3(abs(p.x + 1.9) - 0.68, p.y - 0.37, abs(p.z - 2.35) - 0.36);
  desk = min(desk, sdBox(lq, vec3(0.03, 0.37, 0.03)));
  res = un(res, vec2(desk, 2.0));
  float mon = sdRBox(p - vec3(-1.9, 1.17, 2.52), vec3(0.36, 0.23, 0.025), 0.01);
  mon = min(mon, sdBox(p - vec3(-1.9, 0.86, 2.55), vec3(0.04, 0.1, 0.03)));
  res = un(res, vec2(mon, 5.0));
  // oil lamp on the sill
  float lamp = sdCapT(p, LAMP - vec3(0.0, 0.08, 0.0), LAMP + vec3(0.0, 0.02, 0.0), 0.06, 0.035);
  lamp = min(lamp, sdCapT(p, LAMP + vec3(0.0, 0.04, 0.0), LAMP + vec3(0.0, 0.2, 0.0), 0.045, 0.03));
  res = un(res, vec2(lamp, 6.0));
  res = un(res, vec2(length((p - LAMP - vec3(0.0, 0.1, 0.0))*vec3(1.0, 0.6, 1.0)) - 0.012, 7.0));
  // a chair by the desk
  float ch = sdBox(p - vec3(-1.6, 0.45, 1.75), vec3(0.22, 0.025, 0.22));
  ch = min(ch, sdBox(p - vec3(-1.6, 0.75, 1.55), vec3(0.22, 0.3, 0.02)));
  vec3 cq = vec3(abs(p.x + 1.6) - 0.19, p.y - 0.22, abs(p.z - 1.75) - 0.19);
  ch = min(ch, sdBox(cq, vec3(0.02, 0.22, 0.02)));
  res = un(res, vec2(ch, 2.0));
  float hm;
  float hd = sdHer(p, hm);
  res = un(res, vec2(hd, hm));
  return res;
}

vec3 calcN(vec3 p){
  vec2 e = vec2(0.0015, 0.0);
  return normalize(vec3(mapR(p+e.xyy).x - mapR(p-e.xyy).x, mapR(p+e.yxy).x - mapR(p-e.yxy).x, mapR(p+e.yyx).x - mapR(p-e.yyx).x));
}
float shadowR(vec3 ro, vec3 rd, float maxt){
  float res = 1.0, t = 0.02;
  for(int i=0;i<24;i++){
    float h = mapR(ro + rd*t).x;
    res = min(res, 10.0*h/t);
    t += clamp(h, 0.02, 0.4);
    if(res < 0.02 || t > maxt) break;
  }
  return clamp(res, 0.0, 1.0);
}
float aoR(vec3 p, vec3 n){
  float occ = 0.0, sca = 1.0;
  for(int i=0;i<4;i++){ float h = 0.03 + 0.12*float(i); occ += (h - mapR(p + n*h).x)*sca; sca *= 0.7; }
  return clamp(1.0 - 1.5*occ, 0.0, 1.0);
}

vec3 sunR(){ float el = 0.2; return normalize(vec3(sin(uDayAz)*cos(el), sin(el), cos(uDayAz)*cos(el))); }
vec3 skyOut(){ return mix(vec3(0.03, 0.05, 0.11), vec3(0.85, 0.9, 1.05)*1.3, uDayAmt) + vec3(1.0, 0.55, 0.4)*uDawn*0.6; }

// does the ray from p toward the sun pass through the window glass (and miss the mullions)?
float throughWindow(vec3 p, vec3 L){
  if(L.z <= 0.01) return 0.0;
  float t = (WINC.z + 0.05 - p.z)/L.z;
  if(t < 0.0) return 0.0;
  vec2 w = (p + L*t).xy - WINC.xy;
  float inside = step(abs(w.x), WINH.x)*step(abs(w.y), WINH.y);
  float bars = step(0.025, abs(w.x))*step(0.025, abs(w.y));
  return inside*bars;
}

float marksTex(vec3 p){
  vec2 tuv = vec2((p.z - 1.10)/0.12, 1.0 - p.y/2.2);
  return texture2D(uTex1, tuv).r;
}

vec3 clockFace(vec3 p, vec3 base){
  vec2 d = vec2(-(p.z - CLOCK.z), p.y - CLOCK.y);
  float r = length(d);
  vec3 col = base;
  if(r < CLOCK_R){
    vec2 tuv = vec2(0.5 + d.x/(2.0*CLOCK_R), 0.5 - d.y/(2.0*CLOCK_R));
    col = texture2D(uTex0, tuv).rgb*0.9;
    float phi = atan(d.x, d.y);
    // hands with motion blur: each smears over the angle it sweeps in a 1/48 s shutter
    float spinM = 6.28318*(0.25 + 5.0*uTimelapse);
    float spinH = spinM/12.0;
    float aM = uT*spinM, aH = uT*spinH + 1.3;
    for(int k=0;k<2;k++){
      float a = k == 0 ? aM : aH;
      float sm = (k == 0 ? spinM : spinH)/48.0;
      float len = k == 0 ? 0.15 : 0.1;
      float wa = (k == 0 ? 0.006 : 0.01)/max(r, 0.01);
      float dd = mod(a - phi + 3.14159, 6.28318) - 3.14159;     // how far behind the hand this point is
      float cov = smoothstep(-wa - 0.01, -wa, dd)*smoothstep(sm + wa + 0.01, sm + wa, dd);
      cov *= (wa*2.0)/(wa*2.0 + sm)*step(r, len);
      col = mix(col, vec3(0.02), clamp(cov*1.2, 0.0, 1.0));
    }
    col = mix(col, vec3(0.02), smoothstep(0.012, 0.008, r));
  }
  // the pendulum, seen through the lower glass, blurred by its own speed
  vec2 pv = vec2(-(p.z - 0.2), p.y - 1.72);
  if(pv.y < 0.0 && pv.y > -0.62 && abs(pv.x) < 0.2){
    float acc = 0.0;
    float w = 6.28318*(0.5 + 6.0*uTimelapse);
    for(int s=0;s<6;s++){
      float ts = uT + float(s)/6.0/48.0;
      float th = 0.22*sin(ts*w);
      vec2 dir = vec2(sin(th), -cos(th));
      float rod = abs(dot(pv, vec2(dir.y, -dir.x)));
      float along = dot(pv, dir);
      float c = smoothstep(0.006, 0.003, rod)*step(0.0, along)*step(along, 0.48);
      c = max(c, smoothstep(0.06, 0.055, length(pv - dir*0.5)));
      acc += c;
    }
    col = mix(col*0.6, vec3(0.7, 0.55, 0.25), acc/6.0);
  }
  return col;
}

vec3 shadeR(vec3 p, vec3 n, vec3 rd, float m){
  vec3 L = sunR();
  float sunVis = throughWindow(p, L);
  float sh = sunVis > 0.0 ? shadowR(p + n*0.01, L, 3.5) : 0.0;
  vec3 sunC = mix(vec3(1.0, 0.9, 0.75), vec3(1.0, 0.62, 0.42), uDawn)*3.0*uDayAmt;
  vec3 direct = sunC*max(dot(n, L), 0.0)*sunVis*sh;
  // the window as an area light
  vec3 lw = WINC - vec3(0.0, 0.0, 0.05) - p; float dw = length(lw); vec3 lwn = lw/dw;
  vec3 skyL = skyOut()*0.9*max(dot(n, lwn), 0.0)*max(dot(-lwn, vec3(0.0, 0.0, -1.0)), 0.0)/(0.6 + dw*dw*0.35);
  // the lamp
  vec3 ll = LAMP + vec3(0.0, 0.1, 0.0) - p; float dl = length(ll);
  vec3 lampL = vec3(1.0, 0.6, 0.28)*0.55*max(dot(n, ll/dl), 0.0)/(0.15 + dl*dl);
  float ao = aoR(p, n);
  vec3 amb = vec3(0.025, 0.022, 0.02) + skyOut()*0.03;
  vec3 alb; float spec = 0.0;
  if(m < 1.5){
    if(p.y < 0.02){ // floor planks
      float pl = floor(p.x/0.18);
      alb = vec3(0.24, 0.14, 0.08)*(0.7 + 0.4*hash1(pl))*(0.8 + 0.3*vnoise(vec2(p.x*40.0, p.z*2.0)));
      alb *= 0.6 + 0.4*smoothstep(0.0, 0.006, abs(fract(p.x/0.18) - 0.5)*0.18 - 0.085);
      spec = 0.15;
    } else if(p.y > 2.68){ alb = vec3(0.28, 0.22, 0.16); }
    else if(p.y < 0.9){ alb = vec3(0.22, 0.13, 0.07)*(0.8 + 0.3*vnoise(vec2(p.x + p.z, p.y*30.0))); }
    else { alb = vec3(0.52, 0.47, 0.39)*(0.88 + 0.15*fbm3(p*4.0)); }
  }
  else if(m < 2.5){ alb = vec3(0.17, 0.10, 0.055)*(0.8 + 0.4*vnoise3(p*vec3(2.0, 30.0, 2.0))); spec = 0.1; }
  else if(m < 3.5){
    alb = vec3(0.62, 0.58, 0.5);
    if(n.x > 0.8 && p.z > 1.10) alb *= 1.0 - 0.85*marksTex(p);     // pencil marks
  }
  else if(m < 4.5){
    alb = vec3(0.16, 0.08, 0.04); spec = 0.4;
    if(n.x < -0.8) alb = clockFace(p, alb);
  }
  else if(m < 5.5){
    alb = vec3(0.02);
    if(n.z < -0.8 && abs(p.x + 1.9) < 0.34 && abs(p.y - 1.17) < 0.21){
      vec2 tuv = vec2(0.5 + (p.x + 1.9)/0.68, 0.5 - (p.y - 1.17)/0.42);
      return texture2D(uTex2, tuv).rgb*1.2;
    }
  }
  else if(m < 6.5){ alb = vec3(0.5, 0.38, 0.15); spec = 0.8; }
  else if(m < 7.5){ return vec3(1.0, 0.7, 0.3)*12.0; }
  else if(m < 31.5){ alb = vec3(0.14, 0.035, 0.04); }                         // dress
  else if(m < 32.5){ alb = vec3(0.6, 0.55, 0.45)*(0.75 + 0.35*vnoise3(p*60.0)); } // knitted shawl
  else if(m < 33.5){ alb = vec3(0.55, 0.36, 0.28); }                          // skin
  else {                                                                       // hair, brown to silver
    alb = mix(vec3(0.12, 0.07, 0.04), vec3(0.50, 0.50, 0.53), smoothstep(0.25, 0.9, ageR()));
    vec3 hq = p - HER;
    float strands = vnoise(vec2(atan(hq.x, hq.z)*40.0, hq.y*6.0));
    alb *= 0.55 + 0.6*strands;
    spec = 0.6;
  }
  vec3 col = alb*(direct + skyL + lampL + amb)*mix(0.4, 1.0, ao);
  vec3 h = normalize(L - rd);
  col += spec*sunC*pow(max(dot(n, h), 0.0), 40.0)*sunVis*sh*0.3;
  // rim light from the window for her hair and shoulders
  if(m > 30.5) col += alb*skyOut()*0.5*pow(1.0 - max(dot(-rd, n), 0.0), 3.0)*max(dot(n, vec3(0.0, 0.3, 1.0)), 0.0);
  return col;
}

vec3 outside(vec3 ro, vec3 rd, vec2 uv){
  if(rd.z > 0.0){
    float t = (3.3 - ro.z)/rd.z;
    vec2 w = (ro + rd*t).xy - WINC.xy;
    if(abs(w.x) < WINH.x + 0.3 && abs(w.y) < WINH.y + 0.3){
      vec3 c = skyOut();
      c = mix(c*0.85, c*1.15, smoothstep(-0.2, 0.3, rd.y));
      c += snowfall(uv, uT, 0.8 + 6.0*uTimelapse, 5.0*uTimelapse, 0.4)*(0.2 + 0.8*uDayAmt);
      return c;
    }
  }
  return vec3(0.006, 0.004, 0.003);      // the dark hall beyond the door
}

vec3 render(vec3 ro, vec3 rd, vec2 uv){
  float t = 0.0, m = -1.0;
  for(int i=0;i<120;i++){
    vec2 h = mapR(ro + rd*t);
    if(h.x < 0.0006*t + 0.0002){ m = h.y; break; }
    t += h.x*0.9;
    if(t > 14.0) break;
  }
  vec3 col;
  if(m > 0.0){ vec3 p = ro + rd*t; col = shadeR(p, calcN(p), rd, m); }
  else { col = outside(ro, rd, uv); t = 14.0; }
  // shafts of sun through the window
  vec3 L = sunR();
  float acc = 0.0;
  float tmax = min(t, 8.0);
  float j = hash(gl_FragCoord.xy + uT);
  for(int i=0;i<10;i++){
    float ts = (float(i) + j)/10.0*tmax;
    acc += throughWindow(ro + rd*ts, L);
  }
  vec3 sunC = mix(vec3(1.0, 0.9, 0.75), vec3(1.0, 0.62, 0.42), uDawn)*uDayAmt;
  col += sunC*acc/10.0*tmax*0.035*(0.4 + 0.6*pow(max(dot(rd, L), 0.0), 4.0));
  // dust in the light
  float motes = 0.0;
  vec2 g = uv*vec2(uRes.x/uRes.y, 1.0)*22.0;
  for(int jy=-1;jy<=1;jy++) for(int jx=-1;jx<=1;jx++){
    vec2 c = floor(g) + vec2(float(jx), float(jy));
    float h1 = hash(c), h2 = hash(c+5.3), h3 = hash(c+9.1);
    vec2 pos = c + fract(vec2(h1, h2) + vec2(sin(uT*0.3 + h1*6.0)*0.1, -uT*0.03*(1.0 + h2)));
    motes += smoothstep(0.08, 0.0, length(g - pos))*step(0.7, h3);
  }
  col += motes*sunC*min(acc, 3.0)*0.06;
  return col;
}

<script id="s-living" type="x-shader/x-fragment">// A CHILD'S LIVING ROOM, somewhere on the route. Metres. Floor-level camera.
// A gloved hand sets one present down in front of the tree. For him this takes three seconds.
const vec3 TREE = vec3(0.25, 0.0, 2.5);
const vec3 GIFT = vec3(0.0, 0.0, 1.35);
const vec3 WIN2 = vec3(-0.95, 1.35, 3.5);

float bulbDist(vec3 p, out float id){
  vec3 q = p - TREE;
  float k = clamp(floor((q.y - 0.32)/0.16 + 0.5), 0.0, 9.0);
  float y = 0.32 + k*0.16;
  float R = 0.80*(1.0 - (y - 0.2)/1.8) + 0.02;
  float n = 11.0 - k*0.6;
  float a = atan(q.z, q.x)/6.28318*n + k*0.37;
  float c = floor(a + 0.5);
  float ang = (c - k*0.37)/n*6.28318;
  vec3 pos = vec3(cos(ang)*R, y + 0.03*sin(c*2.1), sin(ang)*R);
  id = c*13.0 + k;
  return length(q - pos) - 0.016;
}

vec3 giftPos(){ return GIFT + vec3(0.0, uPresentY, 0.0); }

vec2 mapL(vec3 p){
  vec2 res = vec2(p.y, 1.0);                                        // floor
  res = un(res, vec2(3.5 - p.z, 2.0));                              // back wall
  res = un(res, vec2(p.x + 2.6, 2.0));                              // left wall
  res.x = max(res.x, -sdBox(p - WIN2, vec3(0.5, 0.6, 0.4)));        // window opening
  float sill = sdBox(p - WIN2 - vec3(0.0, -0.63, -0.05), vec3(0.6, 0.03, 0.1));
  sill = min(sill, sdBox(p - WIN2 - vec3(0.0, 0.0, -0.02), vec3(0.02, 0.6, 0.02)));
  sill = min(sill, sdBox(p - WIN2 - vec3(0.0, 0.0, -0.02), vec3(0.5, 0.02, 0.02)));
  res = un(res, vec2(sill, 3.0));
  // the tree: four tiers of needles over a trunk, topped with a star
  vec3 q = p - TREE;
  float tree = 1e9;
  if(length(q.xz) < 1.1 && q.y < 2.3){
    for(int i=0;i<4;i++){
      float fi = float(i);
      float by = 0.22 + fi*0.38, hgt = 0.78, rr = 0.8 - fi*0.16;
      vec3 c = q - vec3(0.0, by, 0.0);
      float cone = max(length(c.xz) - rr*(1.0 - c.y/hgt), max(-c.y, c.y - hgt))*0.75;
      tree = min(tree, cone);
    }
    tree += 0.05*fbm3(p*vec3(14.0, 22.0, 14.0)) - 0.02;
    res = un(res, vec2(tree, 4.0));
    res = un(res, vec2(sdCyl(q - vec3(0.0, 0.12, 0.0), 0.12, 0.05), 5.0));
    res = un(res, vec2(length(q - vec3(0.0, 1.9, 0.0)) - 0.05, 6.0));
    float bid;
    res = un(res, vec2(bulbDist(p, bid), 7.0));
  }
  // the present, turned a little
  vec3 g = p - giftPos() - vec3(0.0, 0.12, 0.0);
  g.xz = rot(0.4)*g.xz;
  float box = sdRBox(g, vec3(0.17, 0.12, 0.14), 0.008);
  res = un(res, vec2(box, 8.0));
  vec3 bw = g - vec3(0.0, 0.14, 0.0);
  float bow = sdTorus(vec3(bw.x - 0.05, bw.z, bw.y)*vec3(1.0, 1.0, 1.0), vec2(0.04, 0.012));
  bow = min(bow, sdTorus(vec3(bw.x + 0.05, bw.z, bw.y), vec2(0.04, 0.012)));
  res = un(res, vec2(bow, 9.0));
  // the hand: gripping the top of the box, lifting away after it lets go
  vec3 hp = g - vec3(0.0, uHandUp, 0.0);
  float palm = sdRBox(hp - vec3(0.0, 0.155, 0.0), vec3(0.085, 0.03, 0.075), 0.025);
  float fing = 1e9;
  for(int i=0;i<4;i++){
    float x = -0.06 + float(i)*0.04;
    fing = min(fing, sdCap(hp, vec3(x, 0.16, -0.08), vec3(x, 0.07 + 0.01*float(i), -0.152), 0.017));
  }
  float thumb = sdCap(hp, vec3(0.07, 0.15, 0.05), vec3(0.09, 0.08, 0.15), 0.02);
  float glove = smin(palm, min(fing, thumb), 0.025);
  glove = smin(glove, sdCap(hp, vec3(0.0, 0.18, 0.0), vec3(0.04, 0.33, -0.06), 0.05), 0.04);
  res = un(res, vec2(glove, 10.0));
  vec3 cq = hp - vec3(0.045, 0.34, -0.065);
  float cuff = sdTorus(cq, vec2(0.06, 0.035)) - 0.008*vnoise3(hp*90.0);
  res = un(res, vec2(cuff, 11.0));
  float sleeve = sdCapT(hp, vec3(0.05, 0.36, -0.07), vec3(0.3, 1.7, -0.7), 0.075, 0.12);
  res = un(res, vec2(sleeve, 12.0));
  return res;
}

vec3 calcN(vec3 p){
  vec2 e = vec2(0.0012, 0.0);
  return normalize(vec3(mapL(p+e.xyy).x - mapL(p-e.xyy).x, mapL(p+e.yxy).x - mapL(p-e.yxy).x, mapL(p+e.yyx).x - mapL(p-e.yyx).x));
}
float shadowL(vec3 ro, vec3 rd, float maxt){
  float res = 1.0, t = 0.02;
  for(int i=0;i<20;i++){
    float h = mapL(ro + rd*t).x;
    res = min(res, 8.0*h/t);
    t += clamp(h, 0.02, 0.3);
    if(res < 0.02 || t > maxt) break;
  }
  return clamp(res, 0.0, 1.0);
}

vec3 bulbColor(float id){
  float h = hash1(id);
  vec3 c = h < 0.6 ? vec3(1.0, 0.72, 0.38) : (h < 0.8 ? vec3(1.0, 0.35, 0.25) : vec3(0.5, 0.85, 0.55));
  float tw = 0.75 + 0.25*sin(uT*mix(1.6, 0.15, uSlow) + id*3.7);
  return c*tw;
}

vec3 shadeL(vec3 p, vec3 n, vec3 rd, float m){
  vec3 treeL = TREE + vec3(0.0, 0.9, 0.0) - p; float dt = length(treeL);
  float flick = 0.85 + 0.15*sin(uT*mix(7.0, 0.6, uSlow)) * sin(uT*mix(3.1, 0.3, uSlow) + 1.0);
  vec3 fireP = vec3(-2.2, 0.45, 1.0) - p; float df = length(fireP);
  float sf = shadowL(p + n*0.01, fireP/df, df);
  vec3 lt = vec3(1.0, 0.68, 0.38)*0.5*max(dot(n, treeL/dt), 0.0)/(0.2 + dt*dt);
  vec3 lf = vec3(1.0, 0.45, 0.18)*1.6*flick*max(dot(n, fireP/df), 0.0)*sf/(0.5 + df*df*0.5);
  vec3 lm = vec3(0.35, 0.45, 0.8)*0.25*max(dot(n, normalize(WIN2 - p)), 0.0);
  vec3 amb = vec3(0.02, 0.015, 0.012);
  vec3 alb; float spec = 0.0; float sheen = 0.0;
  if(m < 1.5){
    float pl = floor(p.x/0.16);
    alb = vec3(0.22, 0.12, 0.06)*(0.7 + 0.4*hash1(pl))*(0.85 + 0.25*vnoise(vec2(p.x*50.0, p.z*3.0)));
    alb *= 0.6 + 0.4*smoothstep(0.0, 0.005, abs(fract(p.x/0.16) - 0.5)*0.16 - 0.075);
    float rug = length((p.xz - vec2(0.1, 1.3))*vec2(1.0, 1.4));
    if(rug < 1.1){ alb = mix(vec3(0.20, 0.04, 0.035), vec3(0.28, 0.2, 0.12), smoothstep(0.4, 0.6, fract(rug*3.0))*smoothstep(1.1, 0.9, rug))*0.6; }
    spec = 0.2;
  }
  else if(m < 2.5){ alb = vec3(0.16, 0.13, 0.11)*(0.85 + 0.2*fbm3(p*3.0)); }
  else if(m < 3.5){ alb = vec3(0.35, 0.3, 0.25); }
  else if(m < 4.5){ alb = vec3(0.02, 0.07, 0.035)*(0.6 + 0.8*fbm3(p*30.0)); }
  else if(m < 5.5){ alb = vec3(0.12, 0.07, 0.04); }
  else if(m < 6.5){ return vec3(1.0, 0.8, 0.4)*2.5; }
  else if(m < 7.5){ float id; bulbDist(p, id); return bulbColor(id)*6.0; }
  else if(m < 8.5){
    vec3 g = p - giftPos() - vec3(0.0, 0.12, 0.0); g.xz = rot(0.4)*g.xz;
    alb = vec3(0.45, 0.03, 0.04);
    float stripes = smoothstep(0.35, 0.45, abs(fract((g.x + g.y + g.z)*14.0) - 0.5));
    alb = mix(alb, vec3(0.32, 0.02, 0.03), stripes*0.5);
    float rib = min(abs(g.x), abs(g.z));
    if(rib < 0.018){ alb = vec3(0.7, 0.52, 0.18); spec = 0.9; }
    spec = max(spec, 0.25);
  }
  else if(m < 9.5){ alb = vec3(0.7, 0.52, 0.18); spec = 0.9; }
  else if(m < 10.5){ alb = vec3(0.015); spec = 0.5; }
  else if(m < 11.5){ alb = vec3(0.75, 0.73, 0.7)*(0.7 + 0.4*vnoise3(p*120.0)); }
  else { alb = vec3(0.32, 0.02, 0.03); sheen = 1.0; }
  vec3 col = alb*(lt + lf + lm + amb);
  vec3 r = reflect(rd, n);
  col += spec*(vec3(1.0, 0.68, 0.38)*pow(max(dot(r, treeL/dt), 0.0), 30.0)*0.6 + vec3(1.0, 0.5, 0.2)*pow(max(dot(r, fireP/df), 0.0), 30.0)*sf);
  col += sheen*vec3(0.8, 0.2, 0.2)*pow(1.0 - max(dot(-rd, n), 0.0), 3.0)*0.25;
  return col;
}

vec3 render(vec3 ro, vec3 rd, vec2 uv){
  float t = 0.0, m = -1.0;
  gGlow = 0.0;
  for(int i=0;i<130;i++){
    vec3 p = ro + rd*t;
    vec2 h = mapL(p);
    float id; float bd = bulbDist(p, id);
    gGlow += 0.0006/(bd*bd + 0.0015);
    if(h.x < 0.0004*t + 0.0002){ m = h.y; break; }
    t += h.x*0.85;
    if(t > 12.0) break;
  }
  vec3 col;
  if(m > 0.0){ vec3 p = ro + rd*t; col = shadeL(p, calcN(p), rd, m); }
  else {
    col = vec3(0.03, 0.05, 0.11);
    col += snowfall(uv, uT*mix(1.0, 0.04, uSlow), 0.6, 0.0, 0.5)*vec3(0.3, 0.35, 0.45);
  }
  col += gGlow*vec3(1.0, 0.7, 0.4)*0.05;
  return col;
}

<script id="main" type="x-shader/x-fragment">void main(){
  vec2 uv = vUV;
  vec2 ndc = (uv-0.5)*vec2(uRes.x/uRes.y, 1.0);
  vec3 fwd = normalize(uCamTgt - uCamPos);
  vec3 right = normalize(cross(vec3(0.0,1.0,0.0), fwd));
  vec3 up = cross(fwd, right);
  float cr = cos(uRoll), sr = sin(uRoll);
  gRight = right*cr + up*sr; gUp = up*cr - right*sr; gFwd = fwd;
  gFocal = 0.5/tan(uFov*0.5);
  vec3 rd = normalize(fwd*gFocal + gRight*ndc.x + gUp*ndc.y);
  vec3 col = render(uCamPos, rd, uv);
  gl_FragColor = vec4(grade(col, uv), 1.0);
}

  const L3 = (a, b, k) => [lerp(a[0], b[0], k), lerp(a[1], b[1], k), lerp(a[2], b[2], k)];
  const sstep = (a, b, x) => { const k = clamp((x - a)/(b - a), 0, 1); return k*k*(3 - 2*k); };

      Object.assign(u, { uYears: 23, uDawn: 1, uDayAz: -0.3, uDayAmt: 0.8, uExpo: 2.2, uWarmth: 0.7, uFov: 0.85 });
    } else if(t < 42.6){                                           // 7. her, at the window
      scene = 'room'; k = (t - 37.0)/5.6;
      W([0.55, 1.5, 0.35], [0.72, 1.48, 1.0], k, [0.9, 1.4, 2.7], [0.9, 1.44, 2.7]);
      Object.assign(u, { uYears: 23, uDawn: 1, uDayAz: -0.3, uDayAmt: 0.8, uExpo: 2.2, uWarmth: 0.7, uFov: 0.75 });
    } else {                                                       // 8. the watch: six in the morning
      scene = 'watch'; k = (t - 42.6)/2.4;
      W([0.6, 14.2, -11.2], [0.45, 12.2, -9.6], k, [0.2, 0.4, 1.4], [0.2, 0.5, 1.2]);
      const a = watchAngles(6*3600 + 0.3 + (t - 42.6));
      Object.assign(u, { uWatchH: a.h, uWatchM: a.m, uWatchS: a.s, uFrost: 0.95, uExpo: 2.2, uWarmth: 0.35, uFov: 0.62 });
    }
    u.uCamPos = pos; u.uCamTgt = tgt;
    return { scene, u };
  }

  // ------------------------------------------------------------------ text drawn as textures
  function dialCanvas(){
    const c = document.createElement('canvas'); c.width = c.height = 1024;
    const g = c.getContext('2d');
    const grd = g.createRadialGradient(512, 470, 50, 512, 512, 520);
    grd.addColorStop(0, '#f6f1e4'); grd.addColorStop(1, '#ddd3bd');
    g.fillStyle = grd; g.fillRect(0, 0, 1024, 1024);
    g.translate(512, 512);
    g.strokeStyle = '#1b1a18'; g.fillStyle = '#1b1a18';
    g.lineWidth = 3; g.beginPath(); g.arc(0, 0, 470, 0, TAU); g.stroke();
    g.lineWidth = 2; g.beginPath(); g.arc(0, 0, 440, 0, TAU); g.stroke();
    for(let i = 0; i < 60; i++){
      const a = i/60*TAU; g.save(); g.rotate(a);
      g.lineWidth = i % 5 ? 3 : 7;
      g.beginPath(); g.moveTo(0, -470); g.lineTo(0, i % 5 ? -446 : -430); g.stroke(); g.restore();
    }
    const R = ['XII','I','II','III','IIII','V','VI','VII','VIII','IX','X','XI'];
    g.font = '86px "Liberation Serif", "DejaVu Serif", Georgia, serif';
    g.textAlign = 'center'; g.textBaseline = 'middle';
    for(let i = 0; i < 12; i++){
      g.save(); g.rotate(i/12*TAU); g.translate(0, -360); g.fillText(R[i], 0, 0); g.restore();
    }
    g.font = '30px "Liberation Serif", "DejaVu Serif", Georgia, serif';
    g.fillText('NORTH POLE', 0, -170);
    g.font = 'italic 24px "Liberation Serif", "DejaVu Serif", Georgia, serif';
    g.fillText('one night', 0, 190);
    return c;
  }
  const MARKS_W = 128, MARKS_H = 2048;
  const marksCanvas = document.createElement('canvas'); marksCanvas.width = MARKS_W; marksCanvas.height = MARKS_H;
  let marksDrawn = -1;
  function heightAt(i){       // the apprentice was four in 2026; full grown by eighteen
    const age = 4 + i;
    return age >= 18 ? 1.71 + 0.002*(age - 18) : 1.02 + (1.71 - 1.02)*Math.pow((age - 4)/14, 0.85);
  }
  function drawMarks(n){
    if(n === marksDrawn) return false;
    marksDrawn = n;
    const g = marksCanvas.getContext('2d');
    g.fillStyle = '#000'; g.fillRect(0, 0, MARKS_W, MARKS_H);
    g.strokeStyle = '#fff'; g.fillStyle = '#fff'; g.lineWidth = 3;
    g.font = '15px "Liberation Sans", "DejaVu Sans", Arial, sans-serif'; g.textBaseline = 'bottom';
    for(let i = 0; i <= n; i++){
      const y = (1 - heightAt(i)/2.2)*MARKS_H + Math.sin(i*7.3)*1.5;
      g.beginPath(); g.moveTo(6, y); g.lineTo(80 + 10*Math.sin(i*3.1), y + Math.sin(i*1.9)*1.5); g.stroke();
      g.fillText("'" + String(26 + i).padStart(2, '0'), 84, y + 6);
    }
    return true;
  }
  function screenCanvas(){
    const c = document.createElement('canvas'); c.width = 1024; c.height = 640;
    const g = c.getContext('2d');
    g.fillStyle = '#0b1016'; g.fillRect(0, 0, 1024, 640);
    g.fillStyle = '#e9edf2'; g.font = '600 40px "Liberation Sans", "DejaVu Sans", Arial, sans-serif';
    g.fillText('Messages', 48, 74);
    g.fillStyle = '#7fb0e8'; g.font = '28px "Liberation Sans", "DejaVu Sans", Arial, sans-serif';
    g.fillText('8,402 unread  ·  23 years', 48, 118);
    const rows = [
      ['24 Dec 2049', 'Still here. The lamp is lit.'],
      ['25 Dec 2041', 'He has your laugh.'],
      ['24 Dec 2038', 'I kept the lamp in the window.'],
      ['25 Dec 2033', 'He asked me if you were real.'],
      ['25 Dec 2031', 'Taller than the door handle now.'],
      ['25 Dec 2027', 'The little one keeps asking for you.'],
      ['25 Dec 2026', 'Kettle is on. Come home.'],
    ];
    rows.forEach(([d, m], i) => {
      const y = 180 + i*64;
      g.fillStyle = '#16202b'; g.fillRect(36, y - 40, 952, 56);
      g.fillStyle = '#4c9cff'; g.beginPath(); g.arc(64, y - 12, 9, 0, TAU); g.fill();
      g.fillStyle = '#8796a8'; g.font = '24px "Liberation Sans", "DejaVu Sans", Arial, sans-serif'; g.fillText(d, 92, y - 4);
      g.fillStyle = '#e9edf2'; g.font = '30px "Liberation Sans", "DejaVu Sans", Arial, sans-serif'; g.fillText(m, 280, y - 2);
    });
    return c;
  }

  // ------------------------------------------------------------------ WebGL
  const params = new URLSearchParams(location.search);
  const RENDER = params.has('render');
  const MAXH = params.has('h') ? parseInt(params.get('h')) : (RENDER ? 4096 : 800);
  const frameEl = document.getElementById('frame'), canvas = document.getElementById('gl');
  const subEl = document.getElementById('sub'), qEl = document.getElementById('q');
  const playBtn = document.getElementById('play'), audio = document.getElementById('score');
  const gl = canvas.getContext('webgl', { preserveDrawingBuffer: true, antialias: false, alpha: false });
  if(!gl){ playBtn.querySelector('span').textContent = 'WEBGL UNAVAILABLE'; return; }
  function fit(){
    const Wd = innerWidth, Hd = innerHeight;
    let h = Hd, w = Math.round(Hd*9/16);
    if(w > Wd){ w = Wd; h = Math.round(Wd*16/9); }
    frameEl.style.width = w + 'px'; frameEl.style.height = h + 'px';
    frameEl.style.setProperty('--fh', h + 'px');
    const scale = Math.min(1, MAXH/h);
    canvas.width = Math.round(w*scale); canvas.height = Math.round(h*scale);
    gl.viewport(0, 0, canvas.width, canvas.height);
  }
  addEventListener('resize', () => { fit(); if(!playing) draw(lastT); });
  const src = id => document.getElementById(id).textContent;
  function compile(type, text){
    const sh = gl.createShader(type); gl.shaderSource(sh, text); gl.compileShader(sh);
    if(!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(sh));
    return sh;
  }
  const UNI = ['uRes','uT','uL','uQ','uExpo','uWarmth','uCamPos','uCamTgt','uFov','uRoll','uYears','uDawn','uWarp','uTimelapse','uSlow',
    'uWatchH','uWatchM','uWatchS','uFrost','uPresentY','uHandUp','uSleigh','uPitch','uGallop','uSleighOn','uSleighScale','uDayAz','uDayAmt','uTex0','uTex1','uTex2'];
  const progs = {};
  const vs = compile(gl.VERTEX_SHADER, src('vs'));
  try {
    for(const [name, id] of [['watch','s-watch'],['ext','s-ext'],['room','s-room'],['living','s-living']]){
      const p = gl.createProgram();
      gl.attachShader(p, vs);
      gl.attachShader(p, compile(gl.FRAGMENT_SHADER, src('common') + '\n' + src(id) + '\n' + src('main')));
      gl.linkProgram(p);
      if(!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(name + ': ' + gl.getProgramInfoLog(p));
      const loc = {}; for(const n of UNI) loc[n] = gl.getUniformLocation(p, n);
      progs[name] = { p, loc, aPos: gl.getAttribLocation(p, 'aPos') };
    }
  } catch(err){ console.error(String(err)); window.__error = String(err); playBtn.querySelector('span').textContent = 'SHADER FAILED'; return; }
  const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
  function makeTex(unit, source){
    const tex = gl.createTexture(); gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, source);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    return tex;
  }
  makeTex(0, dialCanvas());
  drawMarks(0); const marksTex = makeTex(1, marksCanvas);
  makeTex(2, screenCanvas());

  let playing = false, lastT = 0, t0 = 0, raf = 0;
  function draw(t){
    lastT = t;
    const { scene, u } = shot(Math.min(t, END - 1e-4));
    if(drawMarks(Math.min(14, Math.floor(u.uYears + 1e-6)))){   // he stops growing at eighteen
      gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, marksTex);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, marksCanvas);
    }
    const P = progs[scene];
    gl.useProgram(P.p);
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.enableVertexAttribArray(P.aPos); gl.vertexAttribPointer(P.aPos, 2, gl.FLOAT, false, 0, 0);
    const L = P.loc;
    gl.uniform2f(L.uRes, canvas.width, canvas.height);
    gl.uniform1f(L.uT, t); gl.uniform1f(L.uQ, 1.0);
    gl.uniform1i(L.uTex0, 0); gl.uniform1i(L.uTex1, 1); gl.uniform1i(L.uTex2, 2);
    for(const [k, v] of Object.entries(u)){
      if(!L[k]) continue;
      if(Array.isArray(v)) gl.uniform3f(L[k], v[0], v[1], v[2]); else gl.uniform1f(L[k], v);
    }
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    subEl.style.opacity = (t >= 40.0 && t < 42.6) ? sstep(40.0, 40.25, t).toFixed(3) : '0';
    qEl.style.opacity = t < 2.6 ? (1 - sstep(2.2, 2.6, t)).toFixed(3) : '0';
  }
  function tick(){
    let t = (performance.now() - t0)/1000;
    if(!audio.paused && audio.currentTime > 0.05) t = audio.currentTime;
    if(t >= END){ if(LOOP){ restart(); return; } draw(0); stop(); return; }
    draw(t); raf = requestAnimationFrame(tick);
  }
  const LOOP = true;
  function restart(){ t0 = performance.now(); audio.currentTime = 0; const p = audio.play(); if(p && p.catch) p.catch(() => {}); raf = requestAnimationFrame(tick); }
  function start(){ playing = true; playBtn.hidden = true; restart(); }
  function stop(){ playing = false; cancelAnimationFrame(raf); try{ audio.pause(); }catch(e){}
    playBtn.querySelector('span').textContent = 'REPLAY'; playBtn.hidden = false; }
  playBtn.addEventListener('click', start);
  canvas.addEventListener('click', () => { if(playing) stop(); });
  fit();
  if(RENDER){ playBtn.hidden = true; window.__seek = t => { draw(t); gl.finish(); return true; }; window.__ready = true; }
  else draw(1.0);
})();
</script>
</body>
