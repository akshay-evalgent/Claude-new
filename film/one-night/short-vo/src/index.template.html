<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>One Night</title>
<meta name="description" content="A 65-second vertical short with narration, every frame raymarched in code: what if Santa's one night lasted 23 years at home?">
<style>
%%FONTS%%
  :root { color-scheme: dark; --bg:#000; --fg:#f4efe6; }
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);overflow:hidden;
    font-family:"Inter","Helvetica Neue",Helvetica,Arial,sans-serif;}
  #stage{position:fixed;inset:0;display:grid;place-items:center;background:#000;}
  #frame{position:relative;background:#000;overflow:hidden;}
  canvas{display:block;width:100%;height:100%;}
  #cap{position:absolute;left:9%;right:9%;top:64%;text-align:center;pointer-events:none;
    font-weight:600;font-size:calc(var(--fw) * .058);line-height:1.18;letter-spacing:-0.005em;color:#fbf7ef;
    text-shadow:0 calc(var(--fw)*.003) calc(var(--fw)*.012) rgba(0,0,0,.75), 0 0 calc(var(--fw)*.03) rgba(0,0,0,.35);}
  #cap.her{font-style:italic;font-weight:500;color:#ffe9cf;}
  #play{position:absolute;inset:0;display:grid;place-items:center;cursor:pointer;background:rgba(0,0,0,.65);border:0;color:var(--fg);font:inherit;}
  #play span{border:1px solid rgba(244,239,230,.6);padding:.9em 1.8em;letter-spacing:.35em;text-indent:.35em;font-size:calc(var(--fw) * .04);font-weight:300;}
  #play small{position:absolute;bottom:6%;left:0;right:0;text-align:center;letter-spacing:.2em;font-size:calc(var(--fw) * .026);opacity:.6;font-weight:300;}
  #play[hidden]{display:none;}
</style>
</head>
<body>
<div id="stage"><div id="frame">
  <canvas id="gl"></canvas>
  <div id="cap"></div>
  <button id="play" aria-label="Play"><span>PLAY</span><small>SOUND ON &middot; RENDERED LIVE &middot; NEEDS A FAST GPU</small></button>
</div></div>
<audio id="score" preload="auto" src="%%SCORE%%"></audio>
<script id="timeline" type="application/json">%%TIMELINE%%</script>
<script id="common" type="x-shader/x-fragment">%%COMMON%%</script>
<script id="s-watch" type="x-shader/x-fragment">%%WATCH%%</script>
<script id="s-ext" type="x-shader/x-fragment">%%EXT%%</script>
<script id="s-room" type="x-shader/x-fragment">%%ROOM%%</script>
<script id="s-living" type="x-shader/x-fragment">%%LIVING%%</script>
<script id="main" type="x-shader/x-fragment">%%MAIN%%</script>
<script id="post" type="x-shader/x-fragment">%%POST%%</script>
<script>
(async () => {
  // every machine that renders this must draw text with the same font files
  try { await Promise.all(['600 20px Inter', 'italic 500 20px Inter', '400 20px Inter', '20px "Liberation Serif"', 'italic 20px "Liberation Serif"',
    'bold 20px "DejaVu Sans"', '20px "DejaVu Serif"'].map(f => document.fonts.load(f))); } catch(e) {}
  const TL = JSON.parse(document.getElementById('timeline').textContent);
  const A = TL.anchors, END = A.end;
  const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
  const lerp = (a, b, k) => a + (b - a)*k;
  const L3 = (a, b, k) => [lerp(a[0], b[0], k), lerp(a[1], b[1], k), lerp(a[2], b[2], k)];
  const sstep = (a, b, x) => { const k = clamp((x - a)/(b - a), 0, 1); return k*k*(3 - 2*k); };
  const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1], a[2] - b[2]);
  const TAU = Math.PI*2;
  const RATIO = 23*365.25*86400/(6*3600);           // home seconds per second on his watch
  const REST = [-2.6, 0.0, 6.2];
  function watchAngles(sec){
    const whole = Math.floor(sec), f = sec - whole;
    const jump = f < 0.06 ? Math.sin(f/0.06*Math.PI*0.5)*1.07 : (f < 0.13 ? 1.07 - 0.07*(f - 0.06)/0.07 : 1.0);
    const s = (whole - 1) + jump;
    return { s: TAU*((s % 60 + 60) % 60)/60, m: TAU*((s/60) % 60)/60, h: TAU*((s/3600) % 12)/12 };
  }
  function shotAt(t){
    for(const s of TL.shots) if(t >= s.t0 && t < s.t1) return s;
    return TL.shots[TL.shots.length - 1];
  }
  // years at home, keyed to the words "One year", "Ten", "Twenty-three"
  function yearsAt(t){
    if(t < A.year1) return 0.004 + 0.4*sstep(A.marks, A.year1, t);
    if(t < A.ten) return 1 + 9*(t - A.year1)/(A.ten - A.year1);
    return 10 + 13*sstep(A.aged, A.t23 + 0.5, t);
  }
  function sleighLaunch(tau){
    const go = Math.max(tau - 0.3, 0);
    return { pos: [REST[0] + 1.3*Math.pow(go, 1.6), 0.05 + 0.5*(Math.exp(0.75*Math.max(tau - 0.6, 0)) - 1), REST[2]],
             pitch: 1.05*sstep(0.4, 2.6, tau) };
  }
  function sleighLanding(lt){
    if(lt < 0){ const u = -lt; return { pos: [REST[0] + 0.0 - u*5.0, 0.05 + Math.pow(u, 1.5)*3.0, REST[2]], pitch: -0.3*Math.min(1, u/2) }; }
    return { pos: [REST[0] + 1.4*(1 - Math.exp(-lt*1.6)), 0.05, REST[2]], pitch: 0 };
  }

  // ------------------------------------------------------------------ each shot: camera, scene settings, lens and grade
  let Kcur = 1;
  function shot(t){
    const s = shotAt(t), lt = t - s.t0, d = s.t1 - s.t0, k = clamp(lt/d, 0, 1);
    const u = { uYears: 0, uDawn: 0, uWarp: 0, uTimelapse: 0, uSlow: 0, uNight: 1, uFrost: 0.5, uPresentY: 0, uHandUp: 3,
      uSleigh: [REST[0], 0.05, REST[2]], uPitch: 0, uYaw: 0, uGallop: t*8.0, uSleighOn: 0, uSpray: -1, uLand: -1,
      uSkySpin: 0.3, uSkyBlur: 0, uDayAz: 0, uDayAmt: 0, uClockRate: 0.02, uHeadTurn: 0, uStoop: 0, uRoll: 0, uFov: 0.7 };
    const post = { focus: 10, aperture: 0, maxCoc: 26, expo: 1.6, warmth: 0.5, grain: 0.035, bloom: 0.1, halation: 0.04, contrast: 1.06, sat: 0.95, fade: 0 };
    let scene, pos, tgt;
    switch(s.name){
      case 'watch_open': case 'watch_end': {
        scene = 'watch';
        if(s.name === 'watch_open'){ pos = L3([0.5, 13.5, -10.2], [0.3, 10.6, -8.1], k); tgt = L3([0.2, 0.5, 1.0], [0.15, 0.6, 0.8], k); }
        else { pos = L3([0.62, 15.8, -12.0], [0.5, 13.5, -10.2], k); tgt = L3([0.22, 0.45, 1.15], [0.2, 0.5, 1.0], k); }
        const sec = s.name === 'watch_open' ? 86400 - (A.midnight - t) : 6*3600 + (t - (A.dawn + 0.5));
        const a = watchAngles(sec);
        Object.assign(u, { uWatchH: a.h, uWatchM: a.m, uWatchS: a.s, uFrost: s.name === 'watch_open' ? 0.45 : 0.95, uFov: 0.6 });
        Object.assign(post, { focus: dist(pos, [0, 0.8, 0]), aperture: 34, expo: 1.9, warmth: 0.35, bloom: 0.14 });
        break;
      }
      case 'watch_tick': {
        scene = 'watch';
        pos = L3([0.2, 6.4, -3.8], [0.14, 5.7, -3.25], k); tgt = [0.0, 0.85, 0.35];
        const a = watchAngles(3*3600 + 41*60 + 7 + (t - A.tick_second));
        Object.assign(u, { uWatchH: a.h, uWatchM: a.m, uWatchS: a.s, uFrost: 0.6, uFov: 0.6 });
        Object.assign(post, { focus: dist(pos, [0, 0.9, 0.3]), aperture: 40, expo: 2.0, warmth: 0.35 });
        break;
      }
      case 'launch': case 'warp': {
        scene = 'ext';
        const tau = t - A.midnight;
        const sl = sleighLaunch(tau);
        Object.assign(u, { uSleigh: sl.pos, uPitch: sl.pitch, uSleighOn: 1, uSpray: tau - 0.3, uGallop: tau < 0.3 ? 0.4 : (tau - 0.3)*9.0, uFov: 0.95 });
        pos = L3([1.7, 0.5, -3.9], [1.25, 0.45, -3.1], clamp(tau/10, 0, 1));
        const follow = [sl.pos[0] + 1.6, sl.pos[1] + 1.1, sl.pos[2]];
        tgt = L3([-0.9, 1.7, 7.5], follow, sstep(0.9, 3.4, tau));
        const shake = tau > 0.3 ? Math.exp(-(tau - 0.3)*3.5) : 0;
        u.uRoll = 0.025*shake*Math.sin(tau*61);
        pos = [pos[0] + 0.05*shake*Math.sin(tau*47), pos[1] + 0.06*shake*Math.sin(tau*53), pos[2]];
        const sl2 = s.name === 'launch' ? sstep(d - 1.5, d, lt)*0.3 : 0.3 + 0.7*sstep(0, 1.4, lt);
        u.uWarp = sl2;
        Object.assign(post, { focus: Math.max(2, dist(pos, sl.pos)), aperture: s.name === 'launch' ? 3.5 : 0, expo: 1.85, warmth: 0.2, bloom: 0.16, halation: 0.06 });
        break;
      }
      case 'window_normal': case 'window_day': {
        scene = 'ext';
        if(s.name === 'window_normal'){
          pos = L3([-0.75, 1.42, 5.0], [-1.02, 1.5, 6.6], k); tgt = [-1.3, 1.58, 9.5];
          Object.assign(u, { uYears: 0, uFov: 0.78 });
          Object.assign(post, { focus: dist(pos, [-1.3, 1.55, 9.5]), aperture: 16, expo: 1.9, warmth: 0.45 });
        } else {
          pos = L3([0.3, 0.9, 1.4], [0.0, 0.95, 2.6], k); tgt = L3([-0.9, 3.6, 9.5], [-1.0, 3.4, 9.5], k);
          const rate = TAU/86164*RATIO;
          Object.assign(u, { uYears: 0.004, uTimelapse: 1, uSkySpin: 0.3 + (t - s.t0)*rate, uSkyBlur: rate/48/Kcur, uFov: 0.95 });
          Object.assign(post, { focus: dist(pos, [-1.3, 1.55, 9.5]), aperture: 5, expo: 2.0, warmth: 0.35 });
        }
        break;
      }
      case 'house_aged': {
        scene = 'ext';
        const yr = yearsAt(t);
        pos = L3([1.6, 1.25, 0.4], [1.2, 1.22, 1.8], k); tgt = [-0.7, 2.3, 9.5];
        const rate = TAU/86164*RATIO*0.25;
        Object.assign(u, { uYears: yr, uStoop: 0.08*yr/23, uTimelapse: 1, uSkySpin: 1.0 + lt*rate, uSkyBlur: rate/48/Kcur, uFov: 0.9 });
        Object.assign(post, { focus: dist(pos, [-0.5, 2.0, 9.5]), aperture: 7, expo: 2.0, warmth: 0.4 });
        break;
      }
      case 'dawn': {
        scene = 'ext';
        const ltd = t - A.touchdown;
        const sl = sleighLanding(ltd);
        const gal = ltd < 0 ? t*8.0 : A.touchdown*8.0 + (1 - Math.exp(-ltd*1.4))/1.4*8.0;
        Object.assign(u, { uDawn: 1, uYears: 23, uStoop: 0.08, uSleigh: sl.pos, uPitch: sl.pitch, uSleighOn: 1, uLand: ltd, uGallop: gal, uFov: 0.9 });
        pos = L3([1.3, 0.55, -3.6], [0.95, 0.6, -2.3], k); tgt = L3([-1.6, 2.1, 8.0], [-1.0, 1.5, 8.0], sstep(0.0, 0.7, k));
        Object.assign(post, { focus: Math.max(3, dist(pos, sl.pos)), aperture: 5, expo: 0.85, warmth: 0.85, contrast: 1.12, bloom: 0.14, halation: 0.06 });
        break;
      }
      case 'clock_spin': {
        scene = 'room';
        pos = L3([1.72, 1.86, -0.42], [2.08, 1.9, -0.1], k); tgt = [2.79, 1.9, 0.2];
        Object.assign(u, { uClockRate: RATIO/3600, uDayAmt: 0.04, uFov: 0.7 });
        Object.assign(post, { focus: dist(pos, [2.79, 1.92, 0.2]), aperture: 16, expo: 2.2, warmth: 0.6 });
        break;
      }
      case 'marks': {
        scene = 'room';
        const yr = yearsAt(t);
        const yy = lerp(0.98, 1.58, sstep(0, 1, k));
        pos = [-2.2, yy - 0.04, 0.48]; tgt = [-2.97, yy, 1.16];
        Object.assign(u, { uYears: yr, uDayAz: t*TAU*1.3, uDayAmt: 0.35 + 0.3*Math.sin(TAU*yr), uClockRate: 9, uFov: 0.62 });
        Object.assign(post, { focus: dist(pos, [-2.97, yy, 1.16]), aperture: 18, expo: 2.3, warmth: 0.55 });
        break;
      }
      case 'interior': {
        scene = 'room';
        pos = L3([-3.4, 1.62, 0.62], [-2.35, 1.6, 0.95], k);
        tgt = L3([-1.9, 1.15, 2.6], [0.55, 1.32, 2.6], sstep(0.35, 1.0, k));
        const f = lerp(dist(pos, [-1.9, 1.17, 2.5]), dist(pos, [0.9, 1.5, 2.45]), sstep(0.45, 0.9, k));
        Object.assign(u, { uYears: 23, uStoop: 0.06, uDawn: 1, uDayAz: -0.3, uDayAmt: 0.85, uFov: 0.85 });
        Object.assign(post, { focus: f, aperture: 16, expo: 2.0, warmth: 0.7 });
        break;
      }
      case 'her': {
        scene = 'room';
        pos = L3([0.55, 1.5, 0.35], [0.72, 1.48, 1.0], k); tgt = [0.9, 1.43, 2.7];
        const her = TL.vo.find(v => v.id === 'L15').at;
        Object.assign(u, { uYears: 23, uStoop: 0.06, uDawn: 1, uDayAz: -0.3, uDayAmt: 0.85, uHeadTurn: 0.38*sstep(her - 0.2, her + 1.2, t), uFov: 0.75 });
        Object.assign(post, { focus: dist(pos, [0.9, 1.6, 2.47]), aperture: 24, expo: 2.0, warmth: 0.75 });
        break;
      }
      case 'present': default: {
        scene = 'living';
        pos = L3([0.75, 0.2, -0.15], [0.55, 0.18, 0.35], k); tgt = L3([0.0, 0.42, 1.5], [0.0, 0.33, 1.5], k);
        const dd = clamp(lt/3.0, 0, 1);
        Object.assign(u, { uPresentY: 0.75*Math.pow(1 - dd, 2.2), uHandUp: 1.6*Math.pow(clamp((lt - 3.2)/1.4, 0, 1), 2.0), uSlow: 1, uFov: 0.9 });
        Object.assign(post, { focus: dist(pos, [0.0, 0.2 + u.uPresentY, 1.35]), aperture: 30, expo: 0.75, warmth: 0.9, bloom: 0.16, halation: 0.07 });
        break;
      }
    }
    // falling snow outdoors, drawn in the finishing pass
    const snow = { watch: [0.1, 0.22, 0.0, [0.1, 0.11, 0.14]], ext: [0.22, 0.9, 0.0, [0.14, 0.17, 0.22]] };
    const sn = snow[scene];
    post.snow = sn && s.name !== 'warp' ? sn[0] : 0; post.snowSpeed = sn ? sn[1] : 0; post.snowStreak = 0; post.snowTint = sn ? sn[3] : [0, 0, 0];
    if(scene === 'ext' && u.uTimelapse > 0){ post.snowSpeed = 6.0; post.snowStreak = 1.2; post.snow = 0.16; }
    if(scene === 'ext' && u.uDawn > 0.5) post.snowTint = [0.2, 0.17, 0.19];
    if(s.name === 'launch') post.snow *= 1.0 - u.uWarp;
    u.uCamPos = pos; u.uCamTgt = tgt;
    return { scene, u, post, name: s.name };
  }

  // ------------------------------------------------------------------ text drawn in code
  function dialCanvas(){
    const c = document.createElement('canvas'); c.width = c.height = 1024;
    const g = c.getContext('2d');
    const grd = g.createRadialGradient(512, 470, 50, 512, 512, 520);
    grd.addColorStop(0, '#f7f2e6'); grd.addColorStop(1, '#ddd2bb');
    g.fillStyle = grd; g.fillRect(0, 0, 1024, 1024);
    g.translate(512, 512);
    g.strokeStyle = 'rgba(120,100,70,.18)'; g.lineWidth = 1.2;
    for(let i = 0; i < 90; i++){ g.beginPath(); g.arc(Math.cos(i)*14, Math.sin(i)*14, 60 + i*3.2, 0, TAU); g.stroke(); }
    g.strokeStyle = '#1b1a18'; g.fillStyle = '#1b1a18';
    g.lineWidth = 3; g.beginPath(); g.arc(0, 0, 470, 0, TAU); g.stroke();
    g.lineWidth = 2; g.beginPath(); g.arc(0, 0, 440, 0, TAU); g.stroke();
    for(let i = 0; i < 60; i++){ g.save(); g.rotate(i/60*TAU); g.lineWidth = i % 5 ? 3 : 7;
      g.beginPath(); g.moveTo(0, -470); g.lineTo(0, i % 5 ? -446 : -430); g.stroke(); g.restore(); }
    const R = ['XII','I','II','III','IIII','V','VI','VII','VIII','IX','X','XI'];
    g.font = '86px "Liberation Serif", "DejaVu Serif", Georgia, serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
    for(let i = 0; i < 12; i++){ g.save(); g.rotate(i/12*TAU); g.translate(0, -360); g.fillText(R[i], 0, 0); g.restore(); }
    g.font = '30px "Liberation Serif", "DejaVu Serif", Georgia, serif'; g.fillText('NORTH POLE', 0, -170);
    g.font = 'italic 24px "Liberation Serif", "DejaVu Serif", Georgia, serif'; g.fillText('one night', 0, 190);
    return c;
  }
  const marksCanvas = document.createElement('canvas'); marksCanvas.width = 128; marksCanvas.height = 2048;
  let marksKey = '';
  const heightAt = i => { const age = 4 + i; return age >= 18 ? 1.71 : 1.02 + 0.69*Math.pow((age - 4)/14, 0.85); };
  function drawMarks(years){
    const n = Math.min(14, Math.floor(years)), frac = n >= 14 ? 1 : years - Math.floor(years);
    const key = n + ':' + Math.round(Math.min(1, frac*4)*10);
    if(key === marksKey) return false;
    marksKey = key;
    const g = marksCanvas.getContext('2d');
    g.fillStyle = '#000'; g.fillRect(0, 0, 128, 2048);
    g.strokeStyle = '#fff'; g.fillStyle = '#fff'; g.lineWidth = 3;
    g.font = '15px "Inter", "DejaVu Sans", sans-serif'; g.textBaseline = 'bottom';
    for(let i = 0; i <= n; i++){
      const grow = i === n && n < 14 && i > 0 ? Math.min(1, frac*4) : 1;     // the newest mark is drawn as we watch
      const y = (1 - heightAt(i)/2.2)*2048 + Math.sin(i*7.3)*1.5;
      const x1 = 6 + (74 + 10*Math.sin(i*3.1))*grow;
      g.beginPath(); g.moveTo(6, y); g.lineTo(x1, y + Math.sin(i*1.9)*1.5); g.stroke();
      if(grow >= 1) g.fillText("'" + String(26 + i).padStart(2, '0'), 84, y + 6);
    }
    return true;
  }
  function screenCanvas(){
    const c = document.createElement('canvas'); c.width = 1024; c.height = 640;
    const g = c.getContext('2d');
    g.fillStyle = '#0b1016'; g.fillRect(0, 0, 1024, 640);
    g.fillStyle = '#e9edf2'; g.font = '600 42px "Inter", "DejaVu Sans", sans-serif'; g.fillText('Messages', 48, 74);
    g.fillStyle = '#7fb0e8'; g.font = '28px "Inter", "DejaVu Sans", sans-serif'; g.fillText('23 Christmases  ·  8,402 unread', 48, 118);
    const rows = [['24 Dec 2049','Still here. The lamp is lit.'],['25 Dec 2041','He has your laugh.'],['24 Dec 2038','I kept the lamp in the window.'],
      ['25 Dec 2033','He asked me if you were real.'],['25 Dec 2031','Taller than the door handle now.'],['25 Dec 2027','The little one keeps asking for you.'],['25 Dec 2026','Kettle is on. Come home.']];
    rows.forEach(([d, m], i) => { const y = 180 + i*64;
      g.fillStyle = '#16202b'; g.fillRect(36, y - 40, 952, 56);
      g.fillStyle = '#4c9cff'; g.beginPath(); g.arc(64, y - 12, 9, 0, TAU); g.fill();
      g.fillStyle = '#8796a8'; g.font = '24px "Inter", "DejaVu Sans", sans-serif'; g.fillText(d, 92, y - 4);
      g.fillStyle = '#e9edf2'; g.font = '30px "Inter", "DejaVu Sans", sans-serif'; g.fillText(m, 280, y - 2); });
    return c;
  }
  function pictureCanvas(){     // a child's crayon drawing, framed on the wall
    const c = document.createElement('canvas'); c.width = 512; c.height = 360;
    const g = c.getContext('2d');
    g.fillStyle = '#efe6d2'; g.fillRect(0, 0, 512, 360);
    g.lineCap = 'round'; g.lineWidth = 7;
    g.strokeStyle = '#2b4c8f'; g.beginPath(); g.moveTo(10, 300); g.quadraticCurveTo(250, 250, 500, 300); g.stroke();
    g.fillStyle = '#e8c547'; g.beginPath(); g.arc(420, 80, 38, 0, TAU); g.fill();
    g.strokeStyle = '#c3282d'; g.lineWidth = 9; g.beginPath(); g.moveTo(140, 190); g.lineTo(250, 190); g.lineTo(270, 160); g.stroke();
    g.strokeStyle = '#7a4a22'; g.lineWidth = 6;
    for(let i = 0; i < 2; i++){ const x = 290 + i*60; g.beginPath(); g.moveTo(x, 170); g.lineTo(x + 40, 170); g.moveTo(x + 5, 170); g.lineTo(x, 200); g.moveTo(x + 35, 170); g.lineTo(x + 40, 200); g.moveTo(x + 40, 170); g.lineTo(x + 50, 145); g.stroke(); }
    g.fillStyle = '#c3282d'; g.font = 'bold 44px "DejaVu Sans", sans-serif'; g.fillText('COME HOME', 120, 280);
    return c;
  }
  function tagCanvas(){
    const c = document.createElement('canvas'); c.width = 256; c.height = 160;
    const g = c.getContext('2d');
    g.fillStyle = '#efe4c8'; g.fillRect(0, 0, 256, 160);
    g.fillStyle = '#5a2a18'; g.font = 'italic 64px "DejaVu Serif", Georgia, serif'; g.fillText('for Sam', 20, 105);
    return c;
  }

  // ------------------------------------------------------------------ WebGL2 pipeline
  const params = new URLSearchParams(location.search);
  const RENDER = params.has('render');
  const K = parseInt(params.get('k') || (RENDER ? '0' : '1'));   // 0 = choose per shot
  const KBASE = parseInt(params.get('kbase') || '2'), KHI = parseInt(params.get('khi') || '3');   // sub-frames: most shots, and the fast ones
  const KSHOT = { launch: KHI, dawn: KHI };
  const SCALE = parseFloat(params.get('scale') || (RENDER ? '1' : '0.5'));
  const frameEl = document.getElementById('frame'), canvas = document.getElementById('gl');
  const capEl = document.getElementById('cap'), playBtn = document.getElementById('play'), audio = document.getElementById('score');
  const gl = canvas.getContext('webgl2', { preserveDrawingBuffer: true, antialias: false, alpha: false });
  const fail = msg => { console.error(msg); window.__error = String(msg); playBtn.querySelector('span').textContent = 'WEBGL2 NEEDED'; };
  if(!gl || !gl.getExtension('EXT_color_buffer_float')){ fail('webgl2 or float targets unavailable'); return; }
  gl.getExtension('OES_texture_float_linear');
  let W = 0, H = 0, IW = 0, IH = 0;
  function fit(){
    const Wd = innerWidth, Hd = innerHeight;
    let h = Hd, w = Math.round(Hd*9/16);
    if(w > Wd){ w = Wd; h = Math.round(Wd*16/9); }
    frameEl.style.width = w + 'px'; frameEl.style.height = h + 'px';
    frameEl.style.setProperty('--fw', w + 'px');
    W = w; H = h;
    canvas.width = w; canvas.height = h;
    IW = Math.round(w*SCALE); IH = Math.round(h*SCALE);
    makeTargets();
  }
  const src = id => document.getElementById(id).textContent;
  const VS = '#version 300 es\nin vec2 aPos; out vec2 vUV; void main(){ vUV = aPos*0.5 + 0.5; gl_Position = vec4(aPos, 0.0, 1.0); }';
  function compile(type, text){
    const sh = gl.createShader(type); gl.shaderSource(sh, text); gl.compileShader(sh);
    if(!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(sh));
    return sh;
  }
  function program(fsText, name){
    const p = gl.createProgram();
    gl.attachShader(p, compile(gl.VERTEX_SHADER, VS)); gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fsText));
    gl.bindAttribLocation(p, 0, 'aPos'); gl.linkProgram(p);
    if(!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(name + ': ' + gl.getProgramInfoLog(p));
    const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS), loc = {};
    for(let i = 0; i < n; i++){ const info = gl.getActiveUniform(p, i); loc[info.name] = gl.getUniformLocation(p, info.name); }
    return { p, loc };
  }
  const progs = {};
  try {
    for(const [name, id] of [['watch','s-watch'],['ext','s-ext'],['room','s-room'],['living','s-living']])
      progs[name] = program('#version 300 es\n' + src('common') + '\n' + src(id) + '\n' + src('main'), name);
    for(const pass of [1, 2, 3]) progs['post' + pass] = program('#version 300 es\n#define PASS ' + pass + '\n' + src('post'), 'post' + pass);
  } catch(err){ fail(err); return; }
  const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  function tex(w, h, mips){
    const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, w, h, 0, gl.RGBA, gl.HALF_FLOAT, null);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, mips ? gl.LINEAR_MIPMAP_LINEAR : gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    const f = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, f);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0);
    return { t, f, w, h };
  }
  let acc, dof, bright;
  function makeTargets(){
    acc = tex(IW, IH, true);
    dof = tex(Math.max(1, IW >> 1), Math.max(1, IH >> 1), false);
    bright = tex(Math.max(1, IW >> 1), Math.max(1, IH >> 1), true);
  }
  function imgTex(unit, source){
    const t = gl.createTexture(); gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, source);
    gl.generateMipmap(gl.TEXTURE_2D);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    return t;
  }
  const T = { dial: imgTex(5, dialCanvas()), screen: imgTex(5, screenCanvas()), picture: imgTex(5, pictureCanvas()), tag: imgTex(5, tagCanvas()) };
  drawMarks(0); T.marks = imgTex(5, marksCanvas);

  function setU(L, name, v){ const l = L[name]; if(!l) return; if(Array.isArray(v)) gl.uniform3fv(l, v); else gl.uniform1f(l, v); }
  function bindTex(unit, t){ gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, t); }

  let lastT = 0;
  function draw(t){
    lastT = t;
    Kcur = K > 0 ? K : (KSHOT[shotAt(t).name] || KBASE);
    const KF = Kcur;
    const JIT = KF === 1 ? [[0, 0]] : KF === 2 ? [[-0.25, -0.25], [0.25, 0.25]] : KF === 3 ? [[-0.33, -0.1], [0.33, -0.2], [0.0, 0.33]] :
      KF === 4 ? [[-0.375, -0.125], [0.125, -0.375], [0.375, 0.125], [-0.125, 0.375]] :
      Array.from({ length: KF }, (_, i) => [((i*0.618034) % 1) - 0.5, ((i + 0.5)/KF) - 0.5]);
    const mid = shot(t);
    // 1. accumulate the sub-frames across a 180-degree shutter
    gl.bindFramebuffer(gl.FRAMEBUFFER, acc.f); gl.viewport(0, 0, IW, IH);
    gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
    gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE);
    for(let i = 0; i < KF; i++){
      const ts = Math.min(t + ((i + 0.5)/KF - 0.5)/48, END - 1e-4);
      const S = shot(ts);
      if(S.scene === 'room' && drawMarks(S.u.uYears)){ gl.activeTexture(gl.TEXTURE5); gl.bindTexture(gl.TEXTURE_2D, T.marks);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, marksCanvas); gl.generateMipmap(gl.TEXTURE_2D); }
      const P = progs[S.scene]; gl.useProgram(P.p);
      bindTex(0, T.dial); bindTex(1, T.marks); bindTex(2, T.screen); bindTex(3, S.scene === 'living' ? T.tag : T.picture);
      for(let j = 0; j < 4; j++) if(P.loc['uTex' + j]) gl.uniform1i(P.loc['uTex' + j], j);
      gl.uniform2f(P.loc.uRes, IW, IH);
      if(P.loc.uJitter) gl.uniform2f(P.loc.uJitter, JIT[i][0], JIT[i][1]);
      setU(P.loc, 'uT', ts); setU(P.loc, 'uK', KF);
      for(const [k2, v] of Object.entries(S.u)) setU(P.loc, k2, v);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    }
    gl.disable(gl.BLEND);
    const pp = mid.post, sc = IW/1080;
    const postU = (L) => {
      gl.uniform2f(L.uSrcRes, IW, IH);
      for(const [k2, v] of Object.entries({ uFocus: pp.focus, uAperture: pp.aperture*sc, uMaxCoc: pp.maxCoc*sc, uExpo: pp.expo, uWarmth: pp.warmth, uT: t,
        uGrain: pp.grain, uBloomAmt: pp.bloom, uHalation: pp.halation, uContrast: pp.contrast, uSat: pp.sat, uFade: pp.fade,
        uSnow: pp.snow, uSnowSpeed: pp.snowSpeed, uSnowStreak: pp.snowStreak })) if(L[k2]) gl.uniform1f(L[k2], v);
      if(L.uSnowTint) gl.uniform3fv(L.uSnowTint, pp.snowTint);
      if(L.uRes) gl.uniform2f(L.uRes, W, H);
    };
    gl.bindTexture(gl.TEXTURE_2D, acc.t); gl.generateMipmap(gl.TEXTURE_2D);
    // 2. depth of field at half resolution
    let P = progs.post1; gl.useProgram(P.p);
    gl.bindFramebuffer(gl.FRAMEBUFFER, dof.f); gl.viewport(0, 0, dof.w, dof.h);
    bindTex(0, acc.t); gl.uniform1i(P.loc.uAcc, 0); postU(P.loc);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    // 3. bright pass and its mip chain
    P = progs.post2; gl.useProgram(P.p);
    gl.bindFramebuffer(gl.FRAMEBUFFER, bright.f); gl.viewport(0, 0, bright.w, bright.h);
    bindTex(1, dof.t); gl.uniform1i(P.loc.uDof, 1); postU(P.loc);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    gl.bindTexture(gl.TEXTURE_2D, bright.t); gl.generateMipmap(gl.TEXTURE_2D);
    // 4. composite to the screen
    P = progs.post3; gl.useProgram(P.p);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, W, H);
    bindTex(0, acc.t); bindTex(1, dof.t); bindTex(2, bright.t);
    gl.uniform1i(P.loc.uAcc, 0); gl.uniform1i(P.loc.uDof, 1); gl.uniform1i(P.loc.uBloom, 2); postU(P.loc);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    // captions
    const c = TL.captions.find(c => t >= c.t0 && t < c.t1 + 0.12);
    capEl.textContent = c ? c.text : '';
    capEl.className = c && c.who === 'her' ? 'her' : '';
  }
  let playing = false, t0 = 0, raf = 0;
  function tick(){
    let t = (performance.now() - t0)/1000;
    if(!audio.paused && audio.currentTime > 0.05) t = audio.currentTime;
    if(t >= END){ t0 = performance.now(); audio.currentTime = 0; audio.play().catch(() => {}); t = 0; }
    draw(t); raf = requestAnimationFrame(tick);
  }
  function start(){ playing = true; playBtn.hidden = true; t0 = performance.now(); audio.currentTime = 0; audio.play().catch(() => {}); raf = requestAnimationFrame(tick); }
  function stop(){ playing = false; cancelAnimationFrame(raf); try{ audio.pause(); }catch(e){} playBtn.querySelector('span').textContent = 'PLAY'; playBtn.hidden = false; }
  playBtn.addEventListener('click', start);
  canvas.addEventListener('click', () => { if(playing) stop(); });
  addEventListener('resize', () => { fit(); if(!playing) draw(lastT); });
  fit();
  if(RENDER){ playBtn.hidden = true; window.__seek = t => { draw(t); gl.finish(); return true; }; window.__ready = true; }
  else draw(1.5);
})();
</script>
</body>
</html>
