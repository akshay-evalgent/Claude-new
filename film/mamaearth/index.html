// ---------- timeline (all on the 0.6 s beat grid) ----------
const T = {

// ---------- Three.js scene ----------
const glCanvas = document.getElementById('gl');

// Bottle group
const bottle = new THREE.Group();

}
const bodyProfile = [[0, -1.6], [0.55, -1.6], [0.70, -1.56], [0.76, -1.46], [0.78, -1.2], [0.78, 0.55], [0.76, 0.85], [0.68, 1.05], [0.54, 1.18], [0.42, 1.25], [0.36, 1.3], [0.36, 1.62], [0, 1.62]];

const capProfile = [[0, 1.3], [0.40, 1.3], [0.43, 1.34], [0.43, 1.82], [0.40, 1.9], [0.30, 1.95], [0, 1.95]];

// Label texture (drawn in 2D, wrapped on a cylinder band)

  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillStyle = GREEN; g.font = '900 96px Nunito'; g.fillText('mamaearth', px, py - 250);
  // small onion drawing
  g.strokeStyle = PLUM; g.lineWidth = 9; g.lineCap = 'round'; g.lineJoin = 'round';
  drawOnionPath(g, px, py - 40, 120, 1, 0, 0);
  g.fillStyle = PLUM; g.font = '800 92px Nunito'; g.fillText('Onion', px, py + 160);
  g.font = '700 64px Nunito'; g.fillText('Hair Oil', px, py + 245);
  g.fillStyle = '#8a7a6a'; g.font = '700 34px Nunito'; g.fillText('150 ml', px, py + 320);

}

const labelGeo = new THREE.CylinderGeometry(0.792, 0.792, 1.65, 96, 1, true);
const labelMat = new THREE.MeshPhysicalMaterial({ map: null, roughness: 0.6, metalness: 0, clearcoat: 0.15, transparent: true, opacity: 1 });
const label = new THREE.Mesh(labelGeo, labelMat); label.position.y = -0.3; label.rotation.y = Math.PI; bottle.add(label);

// contact shadow

  const gr = g.createRadialGradient(256, 256, 20, 256, 256, 256); gr.addColorStop(0, 'rgba(60,40,30,0.55)'); gr.addColorStop(0.5, 'rgba(60,40,30,0.18)'); gr.addColorStop(1, 'rgba(60,40,30,0)');

}
const shadowMat = new THREE.MeshBasicMaterial({ map: makeShadowTexture(), transparent: true, opacity: 1, depthWrite: false });
const shadow = new THREE.Mesh(new THREE.PlaneGeometry(2.6, 1.3), shadowMat); shadow.rotation.x = -Math.PI / 2; shadow.position.y = -1.6; bottle.add(shadow);

// Onion (the ingredient that drops in)
function makeOnionTexture() {
  const c = document.createElement('canvas'); c.width = 1024; c.height = 512; const g = c.getContext('2d');
  g.fillStyle = '#B98AC9'; g.fillRect(0, 0, c.width, c.height);
  for (let i = 0; i < 28; i++) { const x = i * (1024 / 28); g.fillStyle = i % 2 ? '#8E5AA6' : '#C9A0D6'; g.fillRect(x, 0, 1024 / 28 * 0.5, 512); }

}
const onionProfile = [[0, -0.55], [0.28, -0.52], [0.50, -0.32], [0.58, 0.0], [0.50, 0.36], [0.30, 0.58], [0.14, 0.78], [0.07, 0.98], [0, 1.05]];

const onionMat = new THREE.MeshPhysicalMaterial({ map: makeOnionTexture(), roughness: 0.5, clearcoat: 0.4, clearcoatRoughness: 0.4 });
const onion = new THREE.Mesh(onionGeo, onionMat);
const sprout = new THREE.Mesh(new THREE.ConeGeometry(0.05, 0.45, 12), new THREE.MeshStandardMaterial({ color: 0x4F9A5E, roughness: 0.7 }));
sprout.position.y = 1.2; onion.add(sprout);
onion.scale.setScalar(0.85);
scene.add(onion);

// Droplet particles
const N = 640;
const partGeo = new THREE.SphereGeometry(1, 10, 8);
const partMat = new THREE.MeshPhysicalMaterial({ roughness: 0.25, clearcoat: 0.8, clearcoatRoughness: 0.2, vertexColors: false });
const parts = new THREE.InstancedMesh(partGeo, partMat, N);
parts.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
scene.add(parts);
const P = []; // per-particle static params
{
  const rnd = mulberry32(1234);
  const pos = bodyGeo.attributes.position; const nv = pos.count;
  const col = new THREE.Color();
  for (let i = 0; i < N; i++) {
    // burst direction, biased upward
    const th = rnd() * Math.PI * 2, ph = Math.acos(lerp(-0.25, 1, rnd()));
    const dir = new THREE.Vector3(Math.sin(ph) * Math.cos(th), Math.cos(ph), Math.sin(ph) * Math.sin(th));
    const speed = lerp(0.7, 2.3, rnd());
    // target on the bottle surface (sample a vertex, push slightly out)
    let vi = Math.floor(rnd() * nv); let tgt = new THREE.Vector3(pos.getX(vi), pos.getY(vi), pos.getZ(vi));
    if (tgt.y > 1.3) tgt.y = lerp(-1.5, 1.2, rnd());
    const rT = Math.hypot(tgt.x, tgt.z) + 0.03; const aT = Math.atan2(tgt.z, tgt.x);
    const size = lerp(0.016, 0.046, Math.pow(rnd(), 1.5));
    const c = rnd(); if (c < 0.55) col.set(PLUM); else if (c < 0.8) col.set('#B98AC9'); else col.set('#F3E7F6');
    P.push({ dir, speed, rT, aT, yT: tgt.y, size, turns: lerp(1.5, 2.5, rnd()), phase: rnd() * Math.PI * 2, color: col.clone() });
    parts.setColorAt(i, col);
  }
  parts.instanceColor.needsUpdate = true;
}
const _m = new THREE.Matrix4(), _p = new THREE.Vector3(), _q = new THREE.Quaternion(), _s = new THREE.Vector3();
const IMPACT = new THREE.Vector3(0, -0.75, 0);

function setParticles(t) {

  parts.visible = true;
  for (let i = 0; i < N; i++) {
    const p = P[i]; let x, y, z, s = p.size;
    if (t < T.burstEnd) {
      const u = seg(t, T.dropEnd, T.burstEnd); const e = 1 - Math.pow(1 - u, 2);
      x = IMPACT.x + p.dir.x * p.speed * e * 0.9; z = IMPACT.z + p.dir.z * p.speed * e * 0.9;
      y = IMPACT.y + p.dir.y * p.speed * e * 0.9 - 2.2 * u * u;

      const bx = IMPACT.x + p.dir.x * p.speed * 0.9, bz = IMPACT.z + p.dir.z * p.speed * 0.9, by = IMPACT.y + p.dir.y * p.speed * 0.9 - 2.2;

}

// ---------- 2D layers ----------
const bg = document.getElementById('bg').getContext('2d');
const ui = document.getElementById('ui').getContext('2d');

// paper grain, generated once
const grain = document.createElement('canvas'); grain.width = W; grain.height = H;
{
  const g = grain.getContext('2d'); const img = g.createImageData(W, H); const rnd = mulberry32(99);
  for (let i = 0; i < img.data.length; i += 4) { const v = 110 + Math.floor(rnd() * 90); img.data[i] = v; img.data[i + 1] = v; img.data[i + 2] = v; img.data[i + 3] = 255; }
  g.putImageData(img, 0, 0);
}

// --- botanical ink paths (polylines generated from parametric curves) ---
function sampleQuad(p0, c, p1, n) { const out = []; for (let i = 0; i <= n; i++) { const u = i / n; out.push([(1 - u) * (1 - u) * p0[0] + 2 * (1 - u) * u * c[0] + u * u * p1[0], (1 - u) * (1 - u) * p0[1] + 2 * (1 - u) * u * c[1] + u * u * p1[1]]); } return out; }
function leafPolys(base, tip, bulge) {

    const u = (i + 1) / (leaves + 1); const k = Math.round(u * 40); const p = stem[k]; const pn = stem[Math.min(40, k + 1)];
    const tx = pn[0] - p[0], ty = pn[1] - p[1]; const L = Math.hypot(tx, ty) || 1; const ang = Math.atan2(ty, tx) + (i % 2 ? 1 : -1) * 0.95 * side;

function onionPolys(cx, cy, s) {

  polys.push(sampleQuad([cx + 0.12 * s, cy - 0.55 * s], [cx + 0.95 * s, cy - 0.2 * s], [cx + 0.15 * s, cy + 0.62 * s], 30));
  polys.push(sampleQuad([cx - 0.15 * s, cy + 0.62 * s], [cx, cy + 0.7 * s], [cx + 0.15 * s, cy + 0.62 * s], 10));

  polys.push(sampleQuad([cx + 0.06 * s, cy - 0.5 * s], [cx + 0.55 * s, cy - 0.1 * s], [cx + 0.08 * s, cy + 0.55 * s], 24));

  polys.push(sampleQuad([cx - 0.1 * s, cy - 0.55 * s], [cx - 0.25 * s, cy - 0.95 * s], [cx - 0.05 * s, cy - 1.15 * s], 14));

// the botanical set, each item: polys + [start,end] of the global draw progress + alpha weight
const BOTANICALS = [
  { polys: sprig([70, 1800], [300, 1120], [60, 1420], 6, 120, 1), range: [0.0, 0.5] },
  { polys: sprig([1020, 330], [820, 950], [1070, 700], 5, 105, -1), range: [0.1, 0.55], calloutDim: true },
  { polys: onionPolys(900, 1640, 150), range: [0.35, 0.8] },

function botanicalProgress(t) {

  if (t < T.bottleIn1) return lerp(0.15, 0.55, easeOutCubic(seg(t, T.burstEnd, T.bottleIn1)));

// ---------- type ----------
function layoutWords(g, text, size, weight, maxWidth, family = 'Nunito') {

  for (const w of words) { const test = cur ? cur + ' ' + w : w; if (g.measureText(test).width > maxWidth && cur) { lines.push([w]); cur = w; } else { lines[lines.length - 1].push(w); cur = test; } }
  return lines;
}

function drawClaim(g, text, cx, cy, size, color, tIn, tOut, t, opts = {}) {

  let wi = 0;
  for (const line of lines) {

    let x = cx - lineW / 2;

}

  if (t < T.dropEnd) { dist = 5.6; az = 0.12; elev = -0.02; lookY = -0.55; }
  else if (t < T.bottleIn1) { const u = easeInOutCubic(seg(t, T.dropEnd, T.bottleIn1)); dist = lerp(5.6, 8.2, u); az = lerp(0.12, -0.17, u); elev = lerp(-0.02, 0.04, u); lookY = lerp(-0.55, 0, u); }
  else if (t < T.heroEnd) { const u = easeInOutCubic(seg(t, T.bottleIn1, T.heroEnd)); dist = lerp(8.2, 7.9, u); az = lerp(-0.17, 0.17, u); elev = 0.04 + 0.03 * Math.sin(u * Math.PI); lookY = 0; }
  else if (t < T.calloutEnd) { const u = easeInOutCubic(seg(t, T.heroEnd, T.heroEnd + 0.7)); dist = lerp(7.9, 8.2, u); az = lerp(0.17, 0.05, u); elev = 0.04; lookY = 0; }
  else if (t < T.settleEnd) { const u = easeInOutCubic(seg(t, T.calloutEnd, T.calloutEnd + 0.8)); dist = 8.2; az = lerp(0.05, -0.02, u) - 0.02 * (t - T.calloutEnd); elev = 0.04; lookY = 0; }
  else { const u = easeInOutCubic(seg(t, T.settleEnd, T.settleEnd + 0.8)); dist = lerp(8.2, 8.0, u) - 0.03 * (t - T.settleEnd); az = -0.02 - 0.02 * (T.settleEnd - T.calloutEnd) + 0.012 * (t - T.settleEnd); elev = 0.04; lookY = 0; }
  camera.position.set(Math.sin(az) * dist, elev * dist + lookY, Math.cos(az) * dist);
  camera.lookAt(0, lookY, 0); camera.updateMatrixWorld();

  // bottle placement (x, y, scale, spin)
  let bx = 0, by = -0.6, bs = 0.85, spin = 0;
  if (t < T.heroEnd) { bx = 0; by = -0.6; bs = 0.85; spin = 0.0; }
  else if (t < T.calloutEnd) { const u = easeInOutCubic(seg(t, T.heroEnd, T.heroEnd + 0.7)); bx = lerp(0, -0.72, u); by = lerp(-0.6, -0.55, u); bs = lerp(0.85, 0.70, u); spin = lerp(0, -0.35, u); }
  else if (t < T.settleEnd) { const u = easeInOutCubic(seg(t, T.calloutEnd, T.calloutEnd + 0.8)); bx = lerp(-0.72, 0, u); by = lerp(-0.55, -0.6, u); bs = lerp(0.70, 0.9, u); spin = lerp(-0.35, 0.08, u) + 0.04 * (t - T.calloutEnd); }
  else { const u = easeInOutCubic(seg(t, T.settleEnd, T.settleEnd + 0.8)); bx = 0; by = lerp(-0.6, -1.28, u); bs = lerp(0.9, 0.46, u); spin = 0.08 + 0.04 * (T.settleEnd - T.calloutEnd) + 0.05 * (t - T.settleEnd); }
  const alive = smooth(seg(t, T.bottleIn1, T.bottleIn1 + 0.6));
  const sway = alive * 0.11 * Math.sin((t - T.bottleIn1) * 1.25), bob = alive * 0.035 * Math.sin((t - T.bottleIn1) * 0.9 + 1.0), tilt = alive * 0.012 * Math.sin((t - T.bottleIn1) * 0.7);
  bottle.position.set(bx, by + bob, 0); bottle.scale.setScalar(bs); bottle.rotation.set(tilt, spin + sway, 0);

  // bottle opacity (fades in while the droplets become the bottle)
  const op = smooth(seg(t, T.bottleIn0, T.bottleIn1));
  bodyMat.opacity = op; capMat.opacity = op; labelMat.opacity = op; shadowMat.opacity = op;
  bottle.visible = op > 0.001;

  // onion drop (0 -> impact), tumbling; vanishes at impact
  if (t < T.dropEnd) {
    onion.visible = true; const u = seg(t, 0, T.dropEnd); const e = easeInQuad(u);
    const ee = 0.35 * u + 0.65 * u * u; onion.position.set(IMPACT.x + 0.25 * (1 - u), lerp(1.75, IMPACT.y, ee), IMPACT.z);
    onion.rotation.z = lerp(-0.6, 0.35, u); onion.rotation.x = lerp(0.3, -0.2, u); onion.rotation.y = u * 1.4;
    const sq = 1 - 0.0; onion.scale.set(0.85 * sq, 0.85 * sq, 0.85 * sq);
  } else { onion.visible = false; }

  setParticles(t);
}

function project(v3) { const v = v3.clone().project(camera); return [(v.x * 0.5 + 0.5) * W, (-v.y * 0.5 + 0.5) * H]; }

// ---------- frame ----------
function renderFrame(t) {
  t = Math.max(0, Math.min(DUR, t));
  const frame = Math.round(t * FPS); const boilSeed = Math.floor(frame / 3);
  stage(t);

  // ----- background layer -----
  bg.setTransform(1, 0, 0, 1, 0, 0); bg.globalAlpha = 1; bg.globalCompositeOperation = 'source-over';
  bg.fillStyle = CREAM; bg.fillRect(0, 0, W, H);

  // plum fill circle (grows behind the bottle in the settle beat, then becomes the badge)
  const bottleCenter = project(new THREE.Vector3(bottle.position.x, bottle.position.y + 0.15 * bottle.scale.x, 0));
  let circleR = 0, circleC = bottleCenter;
  if (t >= T.calloutEnd && t < T.settleEnd) { circleR = 1380 * easeInOutCubic(seg(t, T.calloutEnd, T.calloutEnd + 1.0)); }
  else if (t >= T.settleEnd) { const u = easeInOutCubic(seg(t, T.settleEnd, T.settleEnd + 0.8)); circleR = lerp(1380, 330, u) * (1 + 0.012 * Math.sin((t - T.settleEnd) * 1.7)); }

  // botanicals (ink), dimmed for sprig B during callouts, overall fade after settle
  const prog = botanicalProgress(t);
  const botAlphaGlobal = t > T.settleEnd ? lerp(0.6, 0.38, seg(t, T.settleEnd, T.settleEnd + 0.8)) : 0.6;
  const drawBotanicals = (g, color) => {
    g.lineWidth = 3.2; g.lineCap = 'round'; g.lineJoin = 'round'; g.strokeStyle = color;
    for (const b of BOTANICALS) {
      const [a0, a1] = b.range; const p = clamp01((prog - a0) / (a1 - a0)); if (p <= 0) continue;
      let alpha = botAlphaGlobal; if (b.calloutDim && t > T.heroEnd && t < T.calloutEnd + 0.4) alpha *= lerp(1, 0.25, smooth(seg(t, T.heroEnd, T.heroEnd + 0.5)) * (1 - smooth(seg(t, T.calloutEnd, T.calloutEnd + 0.4))));
      g.globalAlpha = alpha; strokePolys(g, b.polys, p, boilSeed, 2.2);
    }
    g.globalAlpha = 1;
  };
  drawBotanicals(bg, INK);
  if (circleR > 0) {
    bg.fillStyle = PLUM; bg.beginPath(); bg.arc(circleC[0], circleC[1], circleR, 0, Math.PI * 2); bg.fill();
    bg.save(); bg.beginPath(); bg.arc(circleC[0], circleC[1], circleR, 0, Math.PI * 2); bg.clip(); drawBotanicals(bg, CREAM_TYPE); bg.restore();
  }

  // ----- 3D layer -----
  renderer.render(scene, camera);

  // ----- UI layer -----
  ui.setTransform(1, 0, 0, 1, 0, 0); ui.globalCompositeOperation = 'source-over'; ui.globalAlpha = 1; ui.clearRect(0, 0, W, H);
  ui.textAlign = 'left';

  // "Nature. Bottled." (beat 2)
  drawClaim(ui, 'Nature. Bottled.', 540, 300, 156, PLUM, T.burstEnd, T.bottleIn1 - 0.15, t);
  // claim 1 (hero orbit)
  drawClaim(ui, 'The goodness of onion.', 540, 300, 150, PLUM, T.bottleIn1, T.heroEnd - 0.3, t);
  // claim 2 (callouts)
  drawClaim(ui, 'Toxin-free, always.', 540, 300, 150, PLUM, T.heroEnd, T.calloutEnd - 0.3, t);
  // claim 3 (settle, cream on plum)
  drawClaim(ui, 'For stronger, happier hair.', 540, 320, 150, CREAM_TYPE, T.calloutEnd, T.settleEnd - 0.25, t);

  // callouts: three ink icons with one-word labels, on the beat
  if (t >= T.heroEnd && t < T.calloutEnd + 0.3) {
    const items = [
      { label: 'Onion', y: 860, draw: (g, p) => drawOnionPath(g, 680, 860, 62, p, boilSeed, 1.6) },
      { label: 'Almond', y: 1120, draw: (g, p) => strokePolys(g, leafPolys([630, 1160], [730, 1080], 26).concat([sampleQuad([650, 1150], [680, 1118], [712, 1092], 10)]), p, boilSeed, 1.6) },
      { label: 'Bhringraj', y: 1380, draw: (g, p) => strokePolys(g, sprig([625, 1430], [735, 1330], [650, 1350], 3, 48, 1), p, boilSeed, 1.6) },
    ];
    items.forEach((it, i) => {
      const tIn = T.heroEnd + i * BEAT; const u = seg(t, tIn, tIn + 0.55); if (u <= 0) return;
      const exit = seg(t, T.calloutEnd - 0.3, T.calloutEnd);
      ui.save(); ui.globalAlpha = (1 - exit); ui.strokeStyle = PLUM_DEEP; ui.lineWidth = 4; ui.lineCap = 'round'; ui.lineJoin = 'round';
      it.draw(ui, easeOutCubic(u));
      const su = seg(t, tIn + 0.15, tIn + 0.55); ui.globalAlpha = su * (1 - exit); ui.fillStyle = PLUM_DEEP; ui.font = '800 58px Nunito'; ui.textBaseline = 'middle'; ui.textAlign = 'left';
      ui.fillText(it.label, 765 + (1 - easeOutCubic(su)) * 30, it.y + 8);
      ui.restore();
    });
  }

  // logo beat: wordmark + tagline above the badge, bottle sits in the badge
  if (t >= T.settleEnd) {
    const u = seg(t, T.settleEnd + 0.25, T.settleEnd + 0.9); const e = easeOutBack(u);
    ui.save(); ui.globalAlpha = Math.min(1, u / 0.35); ui.textAlign = 'center'; ui.textBaseline = 'alphabetic';
    ui.fillStyle = GREEN; ui.font = '900 170px Nunito'; ui.translate(540, 760 + (1 - e) * 40); ui.fillText('mamaearth', 0, 0); ui.restore();
    const u2 = seg(t, T.settleEnd + 0.55, T.settleEnd + 1.15);
    ui.save(); ui.globalAlpha = u2; ui.textAlign = 'center'; ui.fillStyle = PLUM; ui.font = '700 104px Caveat'; ui.fillText('Goodness Inside', 540 + (1 - easeOutCubic(u2)) * 20, 900); ui.restore();
    const u3 = seg(t, T.settleEnd + 1.0, T.settleEnd + 1.5);
    ui.save(); ui.globalAlpha = u3 * 0.9; ui.textAlign = 'center'; ui.fillStyle = '#6b5d50'; ui.font = '700 44px Nunito'; ui.fillText('Shop the Onion range', 540, 1860); ui.restore();
  }

  // paper grain on top of everything
  ui.globalAlpha = 0.055; ui.drawImage(grain, 0, 0); ui.globalAlpha = 1;
}

// ---------- boot ----------
let ready = false;
async function boot() {
  await Promise.all([
    document.fonts.load('900 100px Nunito'), document.fonts.load('800 100px Nunito'), document.fonts.load('700 100px Nunito'), document.fonts.load('400 100px Nunito'), document.fonts.load('700 100px Caveat'),
  ]);
  labelMat.map = makeLabelTexture(); labelMat.needsUpdate = true;
  renderFrame(0); // warm up shaders
  ready = true;
  window.__ready = true;
  if (location.search.includes('play')) {
    const t0 = performance.now();
    const loop = () => { const t = ((performance.now() - t0) / 1000) % DUR; renderFrame(t); requestAnimationFrame(loop); };
    loop();
  } else if (location.search.includes('t=')) {
    renderFrame(parseFloat(new URLSearchParams(location.search).get('t')));
  }
}
window.renderFrame = renderFrame;
window.FILM = { FPS, DUR, W, H, T };
boot();
</script>
</body>
