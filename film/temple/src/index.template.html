<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Pool Remembers</title>
<meta name="description" content="A ten-second temple clip, every pixel generated in code, directed in the manner of Christopher Nolan: one slow push-in, one drop, time runs backward.">
<style>
  :root { color-scheme: dark; --bg:#000; --fg:#f2f1ec; }
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);overflow:hidden;
    font-family:"Helvetica Neue",Helvetica,Arial,"Liberation Sans",sans-serif;}
  #stage{position:fixed;inset:0;display:grid;place-items:center;background:#000;}
  #frame{position:relative;background:#000;}
  canvas{display:block;width:100%;height:100%;}
  #title{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;
    opacity:0;letter-spacing:.62em;text-indent:.62em;font-weight:300;
    font-size:calc(var(--fh) * .034);color:var(--fg);}
  #play{position:absolute;inset:0;display:grid;place-items:center;cursor:pointer;
    background:rgba(0,0,0,.72);border:0;color:var(--fg);font:inherit;}
  #play span{border:1px solid rgba(242,241,236,.6);padding:.9em 1.8em;letter-spacing:.35em;
    text-indent:.35em;font-size:calc(var(--fh) * .016);font-weight:300;}
  #play small{position:absolute;bottom:6%;left:0;right:0;text-align:center;letter-spacing:.2em;
    font-size:calc(var(--fh) * .011);opacity:.5;font-weight:300;}
  #play[hidden]{display:none;}
</style>
</head>
<body>
<div id="stage"><div id="frame">
  <canvas id="gl"></canvas>
  <div id="title">TEMPLE</div>
  <button id="play" aria-label="Play"><span>PLAY</span><small>SOUND ON &middot; 10 S &middot; RENDERED LIVE</small></button>
</div></div>
<audio id="score" preload="auto" src="%%SCORE%%"></audio>

<script id="vs" type="x-shader/x-vertex">
attribute vec2 aPos; varying vec2 vUV;
void main(){ vUV = aPos*0.5+0.5; gl_Position = vec4(aPos,0.0,1.0); }
</script>
<script id="fs" type="x-shader/x-fragment">
precision highp float;
varying vec2 vUV;
uniform vec2 uRes;
uniform float uT;      // clock time
uniform float uS;      // story time 0..5.3
uniform float uRev;    // inversion amount
uniform float uCut;    // picture on/off
uniform float uQ;      // quality 0..1 (step counts)
uniform float uDbg;
const float S_MAX = 5.3;
const float WATER_Y = -0.42;
const vec3 SUN = normalize(vec3(0.70, 0.50, 0.42));   // toward the sun: behind the temple, upper right
const vec3 SUNCOL = vec3(1.0, 0.92, 0.78)*3.2;
const vec3 SKYCOL = vec3(0.26, 0.34, 0.30);
const vec3 FOGCOL = vec3(0.36, 0.44, 0.37);

// ------------------------------------------------------------------ noise
float hash(vec2 p){ p = fract(p*vec2(123.34, 456.21)); p += dot(p, p+45.32); return fract(p.x*p.y); }
float hash3(vec3 p){ p = fract(p*0.3183099 + 0.1); p *= 17.0; return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }
float vnoise(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f);
  return mix(mix(hash(i),hash(i+vec2(1,0)),f.x), mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x), f.y); }
float vnoise3(vec3 p){ vec3 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f);
  return mix(mix(mix(hash3(i),hash3(i+vec3(1,0,0)),f.x), mix(hash3(i+vec3(0,1,0)),hash3(i+vec3(1,1,0)),f.x),f.y),
             mix(mix(hash3(i+vec3(0,0,1)),hash3(i+vec3(1,0,1)),f.x), mix(hash3(i+vec3(0,1,1)),hash3(i+vec3(1,1,1)),f.x),f.y), f.z); }
float fbm(vec2 p){ float a=0.5, s=0.0; for(int i=0;i<4;i++){ s+=a*vnoise(p); p=p*2.03+vec2(1.7,9.2); a*=0.5; } return s; }
float fbm3(vec3 p){ float a=0.5, s=0.0; for(int i=0;i<3;i++){ s+=a*vnoise3(p); p=p*2.05+1.3; a*=0.5; } return s; }

// ------------------------------------------------------------------ sdf
float sdBox(vec3 p, vec3 b){ vec3 q=abs(p)-b; return length(max(q,0.0))+min(max(q.x,max(q.y,q.z)),0.0); }
float sdEll(vec3 p, vec3 r){ float k0=length(p/r); float k1=length(p/(r*r)); return k0*(k0-1.0)/k1; }
float sdCap(vec3 p, vec3 a, vec3 b, float r){ vec3 pa=p-a, ba=b-a; float h=clamp(dot(pa,ba)/dot(ba,ba),0.0,1.0); return length(pa-ba*h)-r; }
float sdTorus(vec3 p, vec2 t){ vec2 q=vec2(length(p.xz)-t.x,p.y); return length(q)-t.y; }
float sdCyl(vec3 p, float h, float r){ vec2 d=abs(vec2(length(p.xz),p.y))-vec2(r,h); return min(max(d.x,d.y),0.0)+length(max(d,0.0)); }
float smin(float a, float b, float k){ float h=clamp(0.5+0.5*(b-a)/k,0.0,1.0); return mix(b,a,h)-k*h*(1.0-h); }

// materials: 1 pavement, 2 temple stone, 3 nandi stone, 4 pool stone, 5 bark, 6 foliage wall, 7 spout water, 8 eye, 9 brass
vec2 un(vec2 a, vec2 b){ return a.x<b.x ? a : b; }

// a curvilinear shikhara: a softened-square tower that tapers with a bulge, ribbed
float sdShikhara(vec3 p, float H, float R){
  float h = clamp(p.y/H, 0.0, 1.0);
  float prof = R*pow(max(1.0 - pow(h, 2.6), 0.0), 0.72);          // the convex nagara curve
  // stepped courses up the tower, and ratha ribs round it
  prof *= 1.0 + 0.045*step(0.5, fract(p.y*1.7)) + 0.02*sin(p.y*22.0);
  float ang = atan(p.z, p.x);
  prof *= 1.0 + 0.07*(0.5+0.5*cos(ang*12.0)) + 0.05*(0.5+0.5*cos(ang*4.0 + 3.14159));
  vec2 q = abs(p.xz);
  float sq = pow(pow(q.x,3.0)+pow(q.y,3.0), 1.0/3.0);
  float d = (sq - prof)*0.7;
  d = max(d, p.y - H);
  d = max(d, -p.y - 0.1);
  // the sukanasa (a projecting front) low on the tower
  float sk = sdBox(p - vec3(0.0, H*0.25, -R*0.75), vec3(R*0.35, H*0.22, R*0.35));
  d = min(d, sk);
  float am = sdTorus(p - vec3(0.0, H+0.08, 0.0), vec2(R*0.30, R*0.14));
  float ka = sdCap(p, vec3(0.0, H+0.1, 0.0), vec3(0.0, H+0.7, 0.0), R*0.1);
  ka = min(ka, length(p - vec3(0.0, H+0.42, 0.0)) - R*0.16);
  return min(d, min(am, ka));
}

vec2 mapAll(vec3 p, bool fol){
  // ---- ground and tank -------------------------------------------------
  vec3 pc = p - vec3(4.0, 0.0, 5.85);
  float tank = sdBox(pc - vec3(0.0, -0.9, 0.0), vec3(4.5, 1.1, 3.65));   // the cavity (rises above y=0 so no membrane is left)
  float ground = max(p.y, -tank);
  // the stone pavement is cracked into slabs: lower the joints a little
  vec2 res = vec2(ground, 1.0);
  if(tank < 0.0 && p.y < -0.02) res.y = 4.0;
  // coping around the tank
  float rim = max(sdBox(pc - vec3(0.0, 0.07, 0.0), vec3(4.95, 0.07, 4.1)), -sdBox(pc - vec3(0.0, 0.1, 0.0), vec3(4.5, 0.5, 3.65)));
  res = un(res, vec2(rim, 4.0));
  // the far wall of the tank with its two spouts
  float wall = sdBox(pc - vec3(0.0, 0.33, 3.9), vec3(4.95, 0.33, 0.25));
  res = un(res, vec2(wall, 4.0));
  for(int i=0;i<2;i++){
    vec3 sp = vec3(i==0 ? 1.2 : 6.6, 0.22, 9.45);
    float head = sdEll(p - sp, vec3(0.26, 0.2, 0.2));
    head = min(head, sdBox(p - sp - vec3(0.0, -0.05, -0.2), vec3(0.14, 0.1, 0.14)));
    res = un(res, vec2(head, 4.0));
    // falling water
    float jet = sdCap(p, sp + vec3(0.0, -0.1, -0.3), vec3(sp.x, WATER_Y-0.1, sp.z-0.5), 0.022);
    res = un(res, vec2(jet, 7.0));
  }

  // ---- Nandi on his plinth -----------------------------------------------
  vec3 n = p - vec3(-2.3, 0.0, 2.9);
  float plinth = sdBox(n - vec3(0.0, 0.17, 0.0), vec3(2.35, 0.17, 1.75));
  plinth = min(plinth, sdBox(n - vec3(0.0, 0.5, 0.0), vec3(2.0, 0.17, 1.45)));
  res = un(res, vec2(plinth, 4.0));
  vec3 b = n - vec3(0.0, 1.3, 0.0);                       // body origin, bull faces +x
  float body = sdEll(b, vec3(1.45, 0.64, 0.70));
  body = smin(body, sdEll(b - vec3(-0.55, 0.52, 0.0), vec3(0.6, 0.40, 0.42)), 0.28);    // hump
  body = smin(body, sdCap(b, vec3(1.05, 0.12, 0.0), vec3(1.7, 0.55, 0.0), 0.36), 0.22);  // neck
  body = smin(body, sdEll(b - vec3(1.98, 0.70, 0.0), vec3(0.42, 0.33, 0.27)), 0.10);    // skull
  body = smin(body, sdEll(b - vec3(2.42, 0.52, 0.0), vec3(0.40, 0.24, 0.21)), 0.08);    // long muzzle
  body = smin(body, sdEll(b - vec3(1.45, -0.08, 0.0), vec3(0.6, 0.30, 0.34)), 0.2);     // dewlap
  body = smin(body, sdCap(b, vec3(0.9, -0.55, 0.45), vec3(1.75, -0.55, 0.5), 0.19), 0.12);   // folded forelegs
  body = smin(body, sdCap(b, vec3(0.9, -0.55, -0.45), vec3(1.75, -0.55, -0.5), 0.19), 0.12);
  body = smin(body, sdCap(b, vec3(-1.0, -0.55, 0.55), vec3(-1.8, -0.5, 0.45), 0.2), 0.12);   // hind leg
  body = smin(body, sdCap(b, vec3(-1.5, 0.2, -0.3), vec3(-1.3, -0.55, -0.9), 0.07), 0.05);  // tail
  vec3 bm = vec3(b.x, b.y, abs(b.z));
  // horns: a crescent, thick at the root, curving up and in
  float horn = sdCap(bm, vec3(1.88, 0.95, 0.18), vec3(2.02, 1.18, 0.36), 0.085);
  horn = min(horn, sdCap(bm, vec3(2.02, 1.18, 0.36), vec3(2.24, 1.34, 0.30), 0.055));
  horn = min(horn, sdCap(bm, vec3(2.24, 1.34, 0.30), vec3(2.40, 1.40, 0.20), 0.03));
  // ears: flat leaves pointing sideways
  float ear = sdEll(bm - vec3(1.78, 0.76, 0.46), vec3(0.13, 0.07, 0.24));
  body = smin(body, min(horn, ear), 0.04);
  res = un(res, vec2(body, 3.0));
  // the ceremonial cloth over the back, with a thick border
  float cloth = sdEll(b - vec3(-0.35, 0.18, 0.0), vec3(1.25, 0.66, 0.78));
  cloth = max(cloth, -sdEll(b - vec3(-0.35, 0.18, 0.0), vec3(1.2, 0.62, 0.74)));
  cloth = max(cloth, b.y - 0.9);                          // only drapes down the flanks
  cloth = max(cloth, -(b.y + 0.15));
  res = un(res, vec2(cloth, 9.0));
  // two garlands round the neck, with bells on the lower one
  vec3 g = b - vec3(1.25, 0.25, 0.0);
  float gar = sdTorus(vec3(g.y, g.x, g.z), vec2(0.60, 0.07));
  vec3 g2 = b - vec3(0.95, 0.2, 0.0);
  gar = min(gar, sdTorus(vec3(g2.y, g2.x*1.1, g2.z), vec2(0.72, 0.055)));
  res = un(res, vec2(gar, 9.0));
  float bells = 1e9;
  for(int i=0;i<5;i++){
    float a = -0.9 + 0.45*float(i);
    vec3 bp = g - vec3(-0.05, -0.60*cos(a), 0.60*sin(a));
    bells = min(bells, length(bp - vec3(0.0,-0.10,0.0)) - 0.07);
  }
  res = un(res, vec2(bells, 9.0));
  res = un(res, vec2(length(bm - vec3(2.14, 0.80, 0.24)) - 0.045, 8.0));   // eye
  // fallen leaves on the plinth and pavement
  float leaves = 1e9;
  for(int i=0;i<6;i++){
    float fi = float(i);
    vec3 lp = vec3(-3.6 + 1.1*fi + 0.4*sin(fi*5.0), 0.0, 0.6 + 0.9*hash(vec2(fi, 2.0)));
    float ly = (lp.x > -4.3 && lp.x < -0.3) ? 0.34 : 0.0;
    if(abs(lp.z - 2.9) > 1.75) ly = 0.0;
    leaves = min(leaves, sdEll(p - vec3(lp.x, ly + 0.012, lp.z), vec3(0.11, 0.012, 0.06)));
  }
  res = un(res, vec2(leaves, 10.0));

  // ---- the temple ----------------------------------------------------------
  vec3 tp = p - vec3(2.6, 0.0, 17.5);
  float hall = sdBox(tp - vec3(0.0, 1.9, -1.5), vec3(3.6, 1.9, 2.4));
  // horizontal mouldings
  hall = min(hall, sdBox(tp - vec3(0.0, 0.5, -1.5), vec3(3.78, 0.16, 2.58)));
  hall = min(hall, sdBox(tp - vec3(0.0, 1.35, -1.5), vec3(3.7, 0.08, 2.5)));
  hall = min(hall, sdBox(tp - vec3(0.0, 3.6, -1.5), vec3(3.8, 0.2, 2.6)));
  // pilasters on the front
  vec3 pil = tp - vec3(0.0, 1.9, -3.9);
  pil.x = abs(pil.x) - 1.9; pil.x = abs(pil.x) - 0.95;
  hall = min(hall, sdBox(pil, vec3(0.2, 1.9, 0.14)));
  // niches between pilasters
  vec3 ni = tp - vec3(0.0, 1.9, -3.9); ni.x = abs(ni.x) - 1.9;
  hall = max(hall, -sdBox(ni - vec3(0.0, 0.1, -0.1), vec3(0.45, 0.9, 0.3)));
  // the doorway: deep and dark
  float door = sdBox(tp - vec3(0.0, 1.45, -3.9), vec3(0.72, 1.45, 1.2));
  hall = max(hall, -door);
  // stepped pyramidal roof
  for(int i=0;i<6;i++){
    float fi = float(i);
    hall = min(hall, sdBox(tp - vec3(0.0, 4.05 + 0.5*fi, -1.5), vec3(3.3 - 0.45*fi, 0.25, 2.2 - 0.3*fi)));
  }
  hall = min(hall, sdCap(tp, vec3(0.0, 7.0, -1.5), vec3(0.0, 7.7, -1.5), 0.18));
  // steps
  hall = min(hall, sdBox(tp - vec3(0.0, 0.15, -4.5), vec3(2.4, 0.15, 0.6)));
  hall = min(hall, sdBox(tp - vec3(0.0, 0.45, -4.2), vec3(2.0, 0.15, 0.3)));
  res = un(res, vec2(hall, 2.0));
  res = un(res, vec2(sdBox(tp - vec3(0.0, 1.45, -3.2), vec3(0.6, 1.3, 0.3)), 11.0));   // the dark interior
  float tw = sdShikhara(tp - vec3(0.0, 0.0, 1.5), 11.5, 2.5);
  float tw2 = sdShikhara(p - vec3(8.6, 0.0, 16.5), 7.5, 1.7);
  res = un(res, vec2(min(tw, tw2), 2.0));
  float sh = sdBox(p - vec3(-4.8, 1.4, 16.0), vec3(1.5, 1.4, 1.5));
  sh = min(sh, sdShikhara(p - vec3(-4.8, 2.8, 16.0), 4.0, 1.25));
  res = un(res, vec2(sh, 2.0));

  // ---- trees: trunks, the banyan with hanging roots ---------------------
  float trunk = sdCap(p, vec3(-6.2, -1.0, 9.0), vec3(-6.6, 12.0, 9.8), 0.42);
  trunk = min(trunk, sdCap(p, vec3(11.0, -1.0, 12.0), vec3(11.6, 12.0, 11.0), 0.75));
  trunk = min(trunk, sdCap(p, vec3(11.0, 6.0, 12.0), vec3(6.5, 10.5, 10.0), 0.30));      // big limb
  trunk = min(trunk, sdCap(p, vec3(-6.4, 7.0, 9.4), vec3(-2.0, 10.5, 11.0), 0.22));
  trunk = min(trunk, sdCap(p, vec3(14.0, -1.0, 20.0), vec3(13.5, 12.0, 20.0), 0.5));
  trunk = min(trunk, sdCap(p, vec3(-10.0, -1.0, 18.0), vec3(-9.5, 12.0, 18.0), 0.5));
  // hanging aerial roots under the banyan limb
  for(int i=0;i<5;i++){
    float fi = float(i);
    vec3 top = mix(vec3(11.0, 6.0, 12.0), vec3(6.5, 10.5, 10.0), 0.15 + 0.18*fi);
    vec3 bot = vec3(top.x + 0.3*sin(fi*2.1), 0.0, top.z + 0.3*cos(fi*1.7));
    trunk = min(trunk, sdCap(p, top, bot, 0.035 + 0.02*hash(vec2(fi, 3.0))));
  }
  res = un(res, vec2(trunk, 5.0));
  if(!fol) return res;
  // canopies: blobs of leaves displaced by noise
  float can = length(p - vec3(10.0, 8.8, 11.0)) - 3.6;
  can = smin(can, length(p - vec3(6.8, 10.2, 9.5)) - 2.8, 1.0);
  can = smin(can, length(p - vec3(13.0, 10.5, 15.0)) - 3.4, 1.0);
  can = smin(can, length(p - vec3(-6.5, 9.6, 9.5)) - 3.2, 1.0);
  can = smin(can, length(p - vec3(-3.0, 11.0, 11.5)) - 2.6, 1.0);
  can = smin(can, length(p - vec3(-9.5, 10.5, 18.0)) - 3.6, 1.0);
  can = smin(can, length(p - vec3(13.5, 11.0, 20.0)) - 3.8, 1.0);
  if(can < 1.5) can += 0.5*fbm3(p*1.6) - 0.25;
  res = un(res, vec2(can*0.8, 6.0));
  // the forest behind, a wall of foliage
  float wallF = 27.0 - p.z - 1.8*fbm(p.xy*0.35) + 0.3*p.y;
  res = un(res, vec2(wallF*0.6, 6.0));
  return res;
}
vec2 mapScene(vec3 p){ return mapAll(p, true); }
// the canopy casts its light through the noise mask, so shadow rays ignore the leaf blobs
float mapSolid(vec3 p){ return mapAll(p, false).x; }

// ------------------------------------------------------------------ canopy (sky) and shadows cast by it
float canopyMask(vec2 xz){
  float n = fbm(xz*0.16 + vec2(3.1, 7.7));
  float n2 = vnoise(xz*0.9);
  return smoothstep(0.42, 0.56, n + 0.12*n2 - 0.04);   // 1 = leaves, 0 = sky gap
}
// project a point along the sun to the canopy plane (y = 13) and read occlusion
float canopyShadow(vec3 p){
  float t = (13.0 - p.y)/SUN.y;
  vec3 q = p + SUN*t;
  float n = fbm(q.xz*0.16 + vec2(3.1, 7.7));
  float leaves = smoothstep(0.46, 0.58, n + 0.12*vnoise(q.xz*0.9) - 0.04);
  return 1.0 - leaves*0.88;
}

vec2 march(vec3 ro, vec3 rd, float maxd, int steps){
  float t = 0.02; float m = -1.0;
  for(int i=0;i<160;i++){
    if(i >= steps) break;
    vec3 p = ro + rd*t;
    vec2 h = mapScene(p);
    if(h.x < 0.0012*t){ m = h.y; break; }
    t += h.x*0.9;
    if(t > maxd) break;
  }
  return vec2(t, t>maxd ? -1.0 : m);
}
vec3 normalAt(vec3 p){
  vec2 e = vec2(0.0015, 0.0);
  return normalize(vec3(mapScene(p+e.xyy).x - mapScene(p-e.xyy).x,
                        mapScene(p+e.yxy).x - mapScene(p-e.yxy).x,
                        mapScene(p+e.yyx).x - mapScene(p-e.yyx).x));
}
float softShadow(vec3 ro, vec3 rd, int steps){
  float res = 1.0, t = 0.05;
  for(int i=0;i<40;i++){
    if(i >= steps) break;
    float h = mapSolid(ro + rd*t);
    res = min(res, 9.0*h/t);
    t += clamp(h, 0.03, 0.6);
    if(res < 0.01 || t > 24.0) break;
  }
  return clamp(res, 0.0, 1.0)*canopyShadow(ro);
}
float ao(vec3 p, vec3 n){
  float occ = 0.0, sca = 1.0;
  for(int i=0;i<5;i++){
    float h = 0.02 + 0.14*float(i);
    occ += (h - mapSolid(p + n*h))*sca; sca *= 0.75;
  }
  return clamp(1.0 - 1.6*occ, 0.0, 1.0);
}

// ------------------------------------------------------------------ water
float ringPacket(vec2 q, vec2 c, float age, float speed, float width, float decay){
  if(age <= 0.0) return 0.0;
  float r = length(q - c), R = age*speed, w = width + age*0.05;
  return exp(-pow((r - R)/w, 2.0))*sin((r - R)*26.0)*exp(-age*decay);
}
float waterHeight(vec2 q, float s){
  float h = 0.0;
  for(int i=0;i<2;i++){
    vec2 c = i==0 ? vec2(1.2, 8.95) : vec2(6.6, 8.95);
    float r = length(q - c);
    h += 0.012*sin(r*22.0 - s*7.5)*exp(-r*1.6)*(i==0 ? 1.0 : 0.7);
  }
  h += 0.030*ringPacket(q, vec2(3.9, 5.6), s - 1.4, 0.42, 0.05, 0.45);
  h += 0.012*ringPacket(q, vec2(3.9, 5.6), s - 1.55, 0.28, 0.04, 0.6);
  h += 0.004*sin(q.x*3.1 + q.y*2.3 + s*0.9) + 0.003*sin(q.x*5.2 - q.y*3.7 - s*0.7);
  return h;
}

// ------------------------------------------------------------------ materials
vec3 stoneColor(vec3 p, vec3 n, float id){
  float mottle = fbm3(p*2.3);
  float fine = vnoise3(p*14.0);
  vec3 col;
  if(id == 1.0){                                            // pavement slabs
    vec2 cell = floor(p.xz/0.9); vec2 f = fract(p.xz/0.9);
    float joint = smoothstep(0.0, 0.05, min(min(f.x, 1.0-f.x), min(f.y, 1.0-f.y)));
    col = mix(vec3(0.20, 0.19, 0.16), vec3(0.30, 0.28, 0.23), hash(cell))*(0.7 + 0.6*mottle);
    col *= 0.45 + 0.55*joint;
    col = mix(col, vec3(0.14, 0.20, 0.09), smoothstep(0.5, 0.8, mottle)*0.7);   // moss
    col = mix(col, vec3(0.12, 0.17, 0.08), (1.0-joint)*0.6);                     // moss in the joints
  } else if(id == 2.0){                                     // temple stone, carved
    col = vec3(0.30, 0.27, 0.22)*(0.65 + 0.7*mottle);
    float carve = 0.5 + 0.5*sin(p.y*18.0)*sin(p.x*9.0 + p.z*9.0);
    col *= 0.65 + 0.5*smoothstep(0.3, 0.7, carve*fine);
    col = mix(col, vec3(0.17, 0.24, 0.12), smoothstep(0.5, 0.85, mottle*(1.0 - n.y*0.5))*0.7);
  } else if(id == 3.0){                                     // Nandi, dark grey-blue granite with lichen
    col = vec3(0.20, 0.22, 0.23)*(0.75 + 0.5*mottle);
    float lichen = smoothstep(0.70, 0.78, vnoise3(p*11.0 + 3.0))*smoothstep(0.35, 0.65, fbm3(p*1.4));
    col = mix(col, vec3(0.42, 0.45, 0.34), lichen*0.3);
    float carve = smoothstep(0.45, 0.55, abs(sin(p.y*22.0 + 2.0*sin(p.x*5.0)))*fine*1.6);
    col *= 0.85 + 0.3*carve;
  } else if(id == 4.0){                                     // tank stone, wet and mossy
    col = vec3(0.28, 0.28, 0.24)*(0.7 + 0.6*mottle);
    float wet = smoothstep(0.6, -0.2, p.y);
    col *= 1.0 - 0.45*wet;
    col = mix(col, vec3(0.18, 0.27, 0.12), smoothstep(0.45, 0.75, mottle + 0.2*wet)*0.75);
  } else if(id == 5.0){                                     // bark
    col = vec3(0.26, 0.22, 0.18)*(0.6 + 0.8*fbm3(p*vec3(6.0, 1.5, 6.0)));
    col = mix(col, vec3(0.22, 0.30, 0.14), smoothstep(0.55, 0.8, mottle)*0.5);
  } else if(id == 6.0){                                     // distant foliage
    col = mix(vec3(0.10, 0.17, 0.08), vec3(0.32, 0.42, 0.20), fbm3(p*1.2));
  } else if(id == 7.0){                                     // falling water
    col = vec3(0.55, 0.65, 0.65);
  } else if(id == 8.0){                                     // eye
    col = vec3(0.05, 0.05, 0.05);
  } else if(id == 10.0){                                    // fallen leaves
    col = mix(vec3(0.45, 0.42, 0.12), vec3(0.30, 0.20, 0.08), hash(floor(p.xz*3.0)));
  } else if(id == 11.0){                                    // the dark interior of the shrine
    col = vec3(0.0);
  } else {                                                  // carved stone ornament (garlands, cloth), slightly warmer
    float bead = 0.5 + 0.5*sin(p.x*40.0)*sin(p.z*40.0 + p.y*30.0);
    col = vec3(0.24, 0.23, 0.20)*(0.7 + 0.6*mottle)*(0.8 + 0.35*bead);
  }
  return col;
}

vec3 skyColor(vec3 rd){
  // bright, hazy sky seen through a canopy of leaves
  vec3 sky = mix(vec3(0.70, 0.78, 0.72), vec3(1.1, 1.12, 1.05), smoothstep(-0.1, 0.5, rd.y));
  float sunAmt = pow(max(dot(rd, SUN), 0.0), 8.0);
  sky += vec3(1.0, 0.9, 0.7)*sunAmt*0.6;
  if(rd.y > 0.02){
    float t = (13.0)/rd.y;                                   // canopy plane at y = 13 (camera is near y = 1)
    vec2 xz = rd.xz*t;
    float leaves = canopyMask(xz);
    float leafShade = 0.6 + 0.4*fbm(xz*0.8);
    vec3 leaf = vec3(0.07, 0.12, 0.05)*leafShade + vec3(0.25, 0.35, 0.12)*pow(max(dot(rd, SUN),0.0), 3.0)*0.6;
    float fade = smoothstep(0.02, 0.18, rd.y);              // trees at the horizon dissolve into haze
    sky = mix(sky, leaf, leaves*fade);
  }
  return sky;
}

vec3 shade(vec3 p, vec3 n, vec3 rd, float id, int shSteps){
  vec3 alb = stoneColor(p, n, id);
  float sh = softShadow(p + n*0.02, SUN, shSteps);
  float dif = max(dot(n, SUN), 0.0);
  float occ = ao(p, n);
  float skyd = 0.5 + 0.5*n.y;
  vec3 col = alb*(SUNCOL*dif*sh + SKYCOL*skyd*occ + vec3(0.10, 0.11, 0.08)*occ*(1.0-skyd));
  // bounce from the sunlit side
  col += alb*vec3(0.5, 0.45, 0.35)*max(dot(n, vec3(SUN.x, 0.0, SUN.z)), 0.0)*occ*0.35;
  float spec = pow(max(dot(reflect(rd, n), SUN), 0.0), 24.0)*sh;
  col += spec*SUNCOL*0.06*(id == 4.0 ? 3.0 : 1.0);
  if(id == 7.0) col = alb*(0.4 + 0.8*sh) + SKYCOL*0.5;
  if(id == 11.0) col = vec3(0.004, 0.006, 0.004);
  return col;
}

vec3 applyFog(vec3 col, float d, vec3 rd){
  float f = 1.0 - exp(-d*0.013);
  float sunAmt = pow(max(dot(rd, SUN), 0.0), 4.0);
  vec3 fog = mix(FOGCOL, vec3(0.95, 0.9, 0.78), sunAmt*0.5);
  return mix(col, fog, f);
}

// light shafts: scatter along the ray where the canopy lets the sun through
vec3 volumetric(vec3 ro, vec3 rd, float dist, float s){
  float phase = 0.3 + 0.7*pow(max(dot(rd, SUN), 0.0), 2.0);
  float acc = 0.0;
  const int N = 14;
  float dt = min(dist, 34.0)/float(N);
  float jitter = hash(gl_FragCoord.xy + s)*0.8;
  for(int i=0;i<N;i++){
    float t = (float(i) + jitter)*dt;
    vec3 q = ro + rd*t;
    float dens = exp(-max(q.y, 0.0)*0.16)*(0.6 + 0.4*fbm3(q*0.25 + vec3(0.0, 0.0, -s*0.08)));
    float lit = pow(canopyShadow(q), 5.0);
    // the temple and the trees block the sun too: a cheap two-sample test along the sun
    lit *= smoothstep(0.0, 0.6, mapSolid(q + SUN*2.5))*smoothstep(0.0, 0.6, mapSolid(q + SUN*7.0));
    acc += lit*dens*dt;
  }
  float breath = 0.85 + 0.15*sin(s*0.9 + 0.6);
  return SUNCOL*acc*0.0095*phase*breath;
}

void main(){
  if(uCut < 0.5){ gl_FragColor = vec4(0.0,0.0,0.0,1.0); return; }
  vec2 uv = vUV;
  vec2 ndc = (uv - 0.5)*vec2(uRes.x/uRes.y, 1.0);

  // ---- camera: one constant-velocity push toward Nandi's eye --------------
  vec3 cam0 = vec3(0.7, 1.35, -2.4);
  vec3 target = vec3(2.3, 1.3, 7.5);
  vec3 fwd = normalize(target - cam0);
  vec3 ro = cam0 + fwd*0.75*(uS/S_MAX);
  vec3 right = normalize(cross(vec3(0.0,1.0,0.0), fwd));
  vec3 up = cross(fwd, right);
  float focal = 1.35;                                   // ~ 40 mm on a 65 mm frame
  vec3 rd = normalize(fwd*focal + right*ndc.x + up*ndc.y);

  int steps = int(mix(90.0, 150.0, uQ));
  int shSteps = int(mix(14.0, 32.0, uQ));

  vec2 hit = march(ro, rd, 60.0, steps);
  float dist = hit.x;
  vec3 col;

  // ---- the water surface: an analytic plane inside the tank ---------------
  float tw = (WATER_Y - ro.y)/rd.y;
  bool waterHit = false;
  if(rd.y < 0.0 && tw > 0.0 && tw < dist){
    vec3 wp = ro + rd*tw;
    if(wp.x > -0.5 && wp.x < 8.5 && wp.z > 2.2 && wp.z < 9.5){ waterHit = true; dist = tw; }
  }

  if(waterHit){
    vec3 wp = ro + rd*dist;
    float e = 0.02;
    float h0 = waterHeight(wp.xz, uS);
    vec2 g = vec2(waterHeight(wp.xz + vec2(e,0.0), uS) - h0, waterHeight(wp.xz + vec2(0.0,e), uS) - h0)/e;
    vec3 n = normalize(vec3(-g.x, 1.0, -g.y));
    // reflection
    vec3 rr = reflect(rd, n);
    vec2 rh = march(wp + n*0.02, rr, 45.0, steps/2);
    vec3 refl;
    if(rh.y > 0.0){ vec3 rp = wp + rr*rh.x; vec3 rn = normalAt(rp); refl = applyFog(shade(rp, rn, rr, rh.y, shSteps/2), rh.x, rr); }
    else refl = skyColor(rr);
    // refraction: the tiled tank floor, seen through green water
    vec3 rt = refract(rd, n, 1.0/1.33);
    float tf = (-2.0 - wp.y)/rt.y;
    vec3 fp = wp + rt*tf;
    vec3 floorCol = stoneColor(vec3(fp.x, -2.0, fp.z), vec3(0.0,1.0,0.0), 1.0)*0.9;
    float caustic = pow(vnoise(fp.xz*3.0 + vec2(uS*0.4, -uS*0.3))*vnoise(fp.xz*3.0 - vec2(uS*0.35, uS*0.25))*4.0, 1.5);
    floorCol *= (0.5 + 0.5*canopyShadow(fp))*(0.8 + 0.5*caustic)*SUNCOL*0.45 + SKYCOL*0.5;
    vec3 deep = vec3(0.045, 0.16, 0.13);
    float depthAtten = 1.0 - exp(-tf*0.55);
    vec3 through = mix(floorCol, deep, depthAtten);
    float fres = 0.04 + 0.96*pow(1.0 - max(dot(-rd, n), 0.0), 5.0);
    fres = clamp(fres*1.6, 0.05, 0.9);
    col = mix(through, refl, fres);
    // sun glints on the wave crests
    float glint = pow(max(dot(rr, SUN), 0.0), 180.0)*canopyShadow(wp);
    col += SUNCOL*glint*0.35;
    col = applyFog(col, dist, rd);
  } else if(hit.y > 0.0){
    vec3 p = ro + rd*dist;
    vec3 n = normalAt(p);
    col = shade(p, n, rd, hit.y, shSteps);
    col = applyFog(col, dist, rd);
  } else {
    col = skyColor(rd);
    dist = 40.0;
  }

  if(uDbg > 0.5){
    if(uDbg < 1.5) col = skyColor(rd);
    else if(uDbg < 2.5) col = vec3(hit.y > 0.0 ? hit.y/9.0 : 0.0, waterHit ? 1.0 : 0.0, clamp(dist/40.0, 0.0, 1.0));
    else if(uDbg < 3.5) col = volumetric(ro, rd, dist, uS)*4.0;
    else if(uDbg < 4.5){ vec3 pp = ro + rd*dist; vec3 nn = normalAt(pp); float shh = softShadow(pp + nn*0.02, SUN, shSteps); col = vec3(shh, max(dot(nn,SUN),0.0), canopyShadow(pp)); }
    gl_FragColor = vec4(clamp(col,0.0,1.0),1.0); return;
  }
  col += volumetric(ro, rd, dist, uS);

  // ---- dust in the light ----------------------------------------------------
  float motes = 0.0;
  for(int L=0; L<2; L++){
    float sc = L==0 ? 24.0 : 40.0;
    // motes live in a plane a few metres out; parallax from the dolly comes from shrinking the grid with the push
    vec2 g = (uv + vec2(0.0, 0.0))*sc*(1.0 + 0.045*(uS/S_MAX)*(L==0 ? 1.4 : 0.9));
    vec2 cell = floor(g);
    for(int j=-1;j<=1;j++) for(int i=-1;i<=1;i++){
      vec2 c = cell + vec2(float(i), float(j));
      float h1 = hash(c + 3.1*float(L)), h2 = hash(c + 7.7 + 3.1*float(L)), h3 = hash(c+11.3);
      vec2 drift = vec2(sin(uS*0.35 + h1*6.283)*0.18, -uS*(0.05 + 0.07*h2));
      vec2 pos = c + fract(vec2(h1,h2) + drift);
      float d = length(g - pos)*(L==0 ? 1.0 : 1.3);
      float tw2 = 0.55 + 0.45*sin(uS*(1.5 + h3*3.0) + h3*20.0);
      motes += smoothstep(0.07, 0.0, d)*tw2*step(0.6, h3);
    }
  }
  float litRegion = smoothstep(0.3, 0.85, uv.x)*smoothstep(0.15, 0.7, uv.y);
  col += motes*litRegion*0.16*vec3(1.0, 0.95, 0.85);

  // ---- grade ----------------------------------------------------------------
  col *= 0.95;                                                  // exposure
  col = col/(1.0 + col*0.45);                                   // soft shoulder
  col = pow(max(col, 0.0), vec3(1.0/2.0));                      // to display gamma
  float luma = dot(col, vec3(0.299, 0.587, 0.114));
  col = mix(col, vec3(luma), 0.18 + 0.14*uRev);
  vec3 shadowTint = vec3(-0.02, 0.0, 0.035) + uRev*vec3(-0.02, 0.0, 0.03);
  vec3 gain = vec3(1.03, 1.0, 0.95) + uRev*vec3(-0.05, -0.01, 0.03);
  col = col*gain + shadowTint*(1.0 - luma)*(1.0 - luma);
  col = smoothstep(0.0, 1.0, col*0.92 + 0.02);                  // gentle S-curve
  col = (col - 0.5)*1.08 + 0.5;
  float v = length((uv - 0.5)*vec2(1.0, 0.85))*1.35;
  col *= 1.0 - 0.42*pow(v, 2.6);
  float frame = floor(uT*24.0);
  float gr = hash(gl_FragCoord.xy + vec2(frame*7.13, frame*3.71)) - 0.5;
  col += gr*0.05*(1.0 - 0.6*luma);
  gl_FragColor = vec4(clamp(col, 0.0, 1.0), 1.0);
}
</script>

<script>
(() => {
  const CUT_IN = 0.70, FREEZE = 6.00, FREEZE_LEN = 0.12, CUT_OUT = 8.70, TITLE = 9.00, END = 10.0;
  const S_MAX = FREEZE - CUT_IN, REV_LEN = CUT_OUT - (FREEZE + FREEZE_LEN);
  function state(t){
    let s, rev = 0, cut = 1;
    if(t < CUT_IN){ s = 0; cut = 0; }
    else if(t < FREEZE){ s = t - CUT_IN; }
    else if(t < FREEZE + FREEZE_LEN){ s = S_MAX; }
    else if(t < CUT_OUT){ const k = (t - FREEZE - FREEZE_LEN)/REV_LEN; s = S_MAX*(1-k); rev = Math.min(1, k*2.5); }
    else { s = 0; cut = 0; rev = 1; }
    const titleA = t < TITLE ? 0 : Math.min(1, (t - TITLE)/0.45);
    return { s, rev, cut, titleA };
  }

  const params = new URLSearchParams(location.search);
  const RENDER = params.has('render');
  const QUALITY = params.has('q') ? parseFloat(params.get('q')) : (RENDER ? 1.0 : 0.35);
  const DBG = params.has('dbg') ? parseFloat(params.get('dbg')) : 0;
  const MAXW = params.has('w') ? parseInt(params.get('w')) : (RENDER ? 4096 : 960);
  const frameEl = document.getElementById('frame');
  const canvas = document.getElementById('gl');
  const titleEl = document.getElementById('title');
  const playBtn = document.getElementById('play');
  const audio = document.getElementById('score');
  const gl = canvas.getContext('webgl', { preserveDrawingBuffer: true, antialias: false, alpha: false });
  if(!gl){ playBtn.querySelector('span').textContent = 'WEBGL UNAVAILABLE'; return; }

  function fit(){
    const W = innerWidth, H = innerHeight;
    let w = W, h = Math.round(W*9/16);
    if(h > H){ h = H; w = Math.round(H*16/9); }
    frameEl.style.width = w+'px'; frameEl.style.height = h+'px';
    frameEl.style.setProperty('--fh', h+'px');
    // the whole picture is raymarched per pixel, so cap the internal resolution
    const scale = Math.min(1, MAXW / w);
    canvas.width = Math.round(w*scale); canvas.height = Math.round(h*scale);
    gl.viewport(0, 0, canvas.width, canvas.height);
  }
  addEventListener('resize', () => { fit(); if(!playing) draw(lastT); });

  function shader(type, id){
    const sh = gl.createShader(type); gl.shaderSource(sh, document.getElementById(id).textContent); gl.compileShader(sh);
    if(!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(sh));
    return sh;
  }
  let prog;
  try {
    prog = gl.createProgram();
    gl.attachShader(prog, shader(gl.VERTEX_SHADER, 'vs')); gl.attachShader(prog, shader(gl.FRAGMENT_SHADER, 'fs'));
    gl.linkProgram(prog); if(!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
  } catch(err){ console.error(err); playBtn.querySelector('span').textContent = 'SHADER FAILED'; window.__error = String(err); return; }
  gl.useProgram(prog);
  const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
  const aPos = gl.getAttribLocation(prog, 'aPos'); gl.enableVertexAttribArray(aPos); gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);
  const U = {}; for(const n of ['uRes','uT','uS','uRev','uCut','uQ','uDbg']) U[n] = gl.getUniformLocation(prog, n);

  let playing = false, lastT = 0, t0 = 0, raf = 0;
  function draw(t){
    lastT = t;
    const st = state(t);
    gl.uniform2f(U.uRes, canvas.width, canvas.height);
    gl.uniform1f(U.uT, t); gl.uniform1f(U.uS, st.s); gl.uniform1f(U.uRev, st.rev); gl.uniform1f(U.uCut, st.cut); gl.uniform1f(U.uQ, QUALITY); gl.uniform1f(U.uDbg, DBG);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    titleEl.style.opacity = st.titleA.toFixed(3);
  }
  function tick(){
    let t = (performance.now() - t0)/1000;
    if(!audio.paused && !isNaN(audio.currentTime) && audio.currentTime > 0.05) t = audio.currentTime;
    if(t >= END){ draw(END); stop(); return; }
    draw(t); raf = requestAnimationFrame(tick);
  }
  function start(){
    playing = true; playBtn.hidden = true;
    t0 = performance.now();
    audio.currentTime = 0; const p = audio.play(); if(p && p.catch) p.catch(() => {});
    raf = requestAnimationFrame(tick);
  }
  function stop(){
    playing = false; cancelAnimationFrame(raf);
    try{ audio.pause(); }catch(e){}
    playBtn.querySelector('span').textContent = 'REPLAY'; playBtn.hidden = false;
  }
  playBtn.addEventListener('click', start);

  fit();
  if(RENDER){
    playBtn.hidden = true;
    window.__seek = (t) => { draw(t); gl.finish(); return true; };
    window.__ready = true;
  } else {
    draw(1.2);
  }
})();
</script>
</body>
</html>
