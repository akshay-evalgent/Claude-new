<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: Hand; src: url(fonts/PatrickHand-Regular.ttf); }
@font-face { font-family: Thumb; src: url(fonts/ArchivoBlack-Regular.ttf); }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #FBF6EC; }
svg { display: block; }
</style>
</head>
<body>
<svg id="v" xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <filter id="wob0" x="-2%" y="-2%" width="104%" height="104%"><feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="2.4" xChannelSelector="R" yChannelSelector="G"/></filter>
    <filter id="dof" x="-2%" y="-2%" width="104%" height="104%"><feGaussianBlur stdDeviation="2.6"/></filter>
    <filter id="tshadow" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="9" stdDeviation="7" flood-color="#000" flood-opacity="0.55"/></filter>
    <linearGradient id="tg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF51C"/><stop offset="0.55" stop-color="#FDE212"/><stop offset="1" stop-color="#FBC70F"/></linearGradient>
    <radialGradient id="fglow"><stop offset="0" stop-color="#FFB547" stop-opacity="0.85"/><stop offset="0.45" stop-color="#F28C28" stop-opacity="0.35"/><stop offset="1" stop-color="#F28C28" stop-opacity="0"/></radialGradient>
    <radialGradient id="lglow"><stop offset="0" stop-color="#FFF4C8" stop-opacity="0.9"/><stop offset="1" stop-color="#FFF4C8" stop-opacity="0"/></radialGradient>
    <radialGradient id="sunglow"><stop offset="0" stop-color="#FFFBE0" stop-opacity="1"/><stop offset="0.25" stop-color="#FFF3B8" stop-opacity="0.85"/><stop offset="1" stop-color="#FFF3B8" stop-opacity="0"/></radialGradient>
  </defs>
  <g id="scene"></g>
</svg>
<script src="scenes.js"></script>
<script src="thumbs.js"></script>
</body>
</html>
