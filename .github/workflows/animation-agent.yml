# Tests and evals for animation-agent. Runs when the agent's code, prompts or datasets change.
name: animation-agent

on:
  push:
    paths: ["animation-agent/**", ".github/workflows/animation-agent.yml"]
  pull_request:
    paths: ["animation-agent/**", ".github/workflows/animation-agent.yml"]

jobs:
  test-and-eval:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: animation-agent
    env:
      # Optional repository secret. Without it, only the free checks run.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install
        run: uv sync --extra dev
      - name: Unit and graph tests (fakes only, no model calls)
        run: uv run pytest -q
      - name: Retrieval eval (local embeddings, no key needed)
        run: uv run anim eval run retrieval --check
      - name: Model evals (only when ANTHROPIC_API_KEY is set)
        if: ${{ env.ANTHROPIC_API_KEY != '' }}
        env:
          LLM_PROVIDER: anthropic
        run: |
          uv sync --extra dev --extra anthropic
          uv run anim eval run triage analyst --limit 2 --check
