<title>Chimney Rush</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Chimney Rush: fly the sleigh over a snowy town and drop every gift down a chimney.">
<style>
  /* Layout: one full-screen canvas inside the safe-area gutter; the game draws everything else.
     Single dark look on purpose: the game is set on a winter night. */
  :root {
    --night: #070b24;
    --ink: #ffffff;
    --ink-dim: rgba(255, 255, 255, 0.6);
    --font-ui: 'Trebuchet MS', 'Arial Rounded MT Bold', 'Segoe UI', Verdana, sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    background: var(--night);
    color: var(--ink);
    overflow: hidden;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }
  #stage {
    position: fixed;
    inset: 0;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    background: var(--night);
  }
  #game { display: block; width: 100%; height: 100%; outline: none; touch-action: none; }
  #game:focus-visible { box-shadow: 0 0 0 2px var(--ink-dim); }
  #boot {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ink);
    font: 700 20px/1.2 var(--font-ui);
    pointer-events: none;
  }
</style>
<div id="stage"><canvas id="game" tabindex="0" aria-label="Chimney Rush game"></canvas></div>
<div id="boot">Loading...</div>
<!--SCRIPTS-->
<script src="js/config.js"></script>
<script src="js/storage.js"></script>
<script src="js/audio.js"></script>
<script src="js/art.js"></script>
<script src="js/platform.js"></script>
<script src="js/game.js"></script>
<script src="js/main.js"></script>
<!--/SCRIPTS-->
