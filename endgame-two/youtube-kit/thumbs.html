<!doctype html><meta charset="utf-8">
<style>
html,body{margin:0;background:#000}
#t{position:relative;width:1280px;height:720px;overflow:hidden;font-family:Inter,sans-serif;font-weight:900;color:#fff;background:#07080c}
#t>*{position:absolute}
.ph{top:0;width:640px;height:720px;background-repeat:no-repeat;background-color:#07080c}
.rdj{left:0;background-image:url(src/rdj.jpg);background-size:660px auto;background-position:-26px -84px}
.eva{left:640px;background-image:url(src/evans.jpg);background-size:660px auto;background-position:-9px -84px}
.tint{top:0;width:640px;height:720px;mix-blend-mode:multiply}
.seam{left:500px;top:0;width:280px;height:720px;background:linear-gradient(90deg,rgba(7,8,12,0),rgba(7,8,12,.97) 42%,rgba(7,8,12,.97) 58%,rgba(7,8,12,0))}
.vig{inset:0;background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 45%,rgba(0,0,0,.7) 100%)}
.bot{left:0;right:0;bottom:0;height:330px;background:linear-gradient(0deg,rgba(0,0,0,.94),rgba(0,0,0,0))}
.big{left:0;right:0;text-align:center;line-height:.95;letter-spacing:-2px;-webkit-text-stroke:16px #000;paint-order:stroke fill;text-transform:uppercase}
.y{color:#ffd400}.r{color:#ff3b47}.g{color:#5dff9a}
.tag{font-size:44px;padding:8px 22px;border-radius:10px;letter-spacing:1px;text-transform:uppercase;white-space:nowrap}
svg{overflow:visible}
</style>
<div id="t"></div>
<script>
const v = +new URLSearchParams(location.search).get('v') || 1, t = document.getElementById('t');
const stones = (x, y, s = 1) => `<svg style="left:${x}px;top:${y}px;transform:scale(${s});transform-origin:50% 50%" width="170" height="250" viewBox="0 0 170 250">${['#b050ff', '#3a8aff', '#ff3838', '#ffa030', '#ffe84a', '#4aff7a'].map((c, i) => `<circle cx="${45 + (i % 2) * 80}" cy="${45 + (i >> 1) * 80}" r="30" fill="${c}" stroke="#000" stroke-width="8" style="filter:drop-shadow(0 0 16px ${c})"/><circle cx="${36 + (i % 2) * 80}" cy="${36 + (i >> 1) * 80}" r="8" fill="rgba(255,255,255,.8)"/>`).join('')}</svg>`;
const faces = (lf, rf, lt, rt) => `<div class="ph rdj" style="filter:${lf}"></div><div class="ph eva" style="filter:${rf}"></div><div class="tint" style="left:0;background:${lt}"></div><div class="tint" style="left:640px;background:${rt}"></div><div class="seam"></div><div class="vig"></div><div class="bot"></div>`;
const G = 'contrast(1.2) saturate(.9) brightness(1.08)';
const arrow = (x, y, rot, col = '#ffd400') => `<svg style="left:${x}px;top:${y}px;transform:rotate(${rot}deg)" width="150" height="90" viewBox="0 0 150 90"><path d="M5 45 H105 M75 12 L112 45 L75 78" stroke="#000" stroke-width="30" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 45 H105 M75 12 L112 45 L75 78" stroke="${col}" stroke-width="16" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const V = {
  1: () => faces(G, G, '#ffd9c2', '#c4d8ff') + stones(555, 120, 0.9) + `<div class="big" style="bottom:36px;font-size:150px">Strange <span class="y">lied.</span></div>`,
  2: () => faces(G, G, '#d2ffe0', '#ffc6c0') + `<div class="tag" style="left:40px;top:34px;background:#19a85a">Lives</div><div class="tag" style="right:40px;top:34px;background:#ff3b47">Loses everything</div>` + arrow(70, 130, 40, '#19a85a') + arrow(1060, 130, 140, '#ff3b47') + `<div class="big" style="bottom:40px;font-size:128px">Tony <span class="y">or</span> powers?</div>`,
  3: () => faces('grayscale(1) contrast(1.3) brightness(1.05)', 'grayscale(1) contrast(1.3) brightness(1.05)', '#ffffff', '#ffffff') + `<div class="tag" style="left:50%;top:40px;transform:translateX(-50%) rotate(-3deg);background:#ffd400;color:#000;font-size:50px">Future 14,000,606</div>` + stones(555, 170, 0.8) + `<div class="big" style="bottom:36px;font-size:132px">There were <span class="r">two</span></div>`,
  4: () => faces(G, G, '#ffd9c2', '#c4d8ff') + `<div style="left:500px;top:110px;width:280px;height:280px;border-radius:50%;overflow:hidden;border:10px solid #c79bff;background:url(src/thanosb.jpg) -889px -266px/1900px auto;box-shadow:0 20px 50px #000"></div>` + `<div class="big" style="bottom:36px;font-size:120px">Not so<br><span class="y">inevitable</span></div>`,
  5: () => faces('contrast(1.2) saturate(1) brightness(1.1)', 'contrast(1.25) saturate(.6) brightness(.95)', '#ffe2c8', '#a9c4ff') + stones(555, 100, 0.95) + `<div class="big" style="bottom:150px;font-size:76px;letter-spacing:6px;-webkit-text-stroke:12px #000">Endgame</div><div class="big" style="bottom:30px;font-size:132px"><span class="y">He lives.</span></div>`,
};
t.innerHTML = V[v]();
document.fonts.load('900 100px Inter').then(() => window.READY = true);
</script>
