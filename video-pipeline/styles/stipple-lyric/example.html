<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stipple-lyric example</title>
<!-- A worked example of the stipple-lyric style on film.js: two lyric lines lit
     word by word, each its own shot on the same sheet, over a drawing that
     outlives both: a trail of dots that grows and a square of light the dots
     gather round.
     Preview: open this file with ?play, or ?t=4.7 to stop on a moment.
     Render:  node ../../tools/render.js example.html --out /tmp/example.mp4 -->
<link rel="stylesheet" href="stipple.css">
</head>
<body>
<main id="stage">

  <!-- 1. The whole line is on the sheet, faint, from the shot's first frame.
       data-at is when each word is spoken, in seconds from the start of this shot. -->
  <section class="shot" id="one">
    <p class="lyric">
      <span class="row"><span class="w" data-at="1.00">Slow</span> <span class="w" data-at="1.38">down</span></span>
      <span class="row"><span class="w" data-at="1.92">on</span> <span class="w" data-at="2.10">the</span> <span class="w" data-at="2.34">hill</span></span>
    </p>
  </section>

  <!-- 2. The one red word starts faint, turns full red when it is spoken and swells once.
       At the end the ink words leave and the red word stays. -->
  <section class="shot" id="two">
    <p class="lyric">
      <span class="row"><span class="w" data-at="0.40" data-out="3.0 3.4">I&rsquo;ll</span> <span class="w accent" data-at="0.72" data-pulse="0.72">wait</span></span>
      <span class="row"><span class="w" data-at="1.30" data-out="3.0 3.4">by</span> <span class="w" data-at="1.50" data-out="3.0 3.4">the</span> <span class="w" data-at="1.74" data-out="3.0 3.4">gate</span></span>
    </p>
  </section>

  <!-- The drawing sits above the shots and runs on the film's clock.
       data-grow is pairs of "time share": the dots land between them, and rest where the share repeats. -->
  <svg class="drawing" id="drawing" viewBox="0 0 1920 1080">
    <g class="stipple" id="steps" data-grow="0.2 0, 0.9 0.07, 2.0 0.2, 4.6 0.62, 7.4 1"></g>
    <g class="stipple" id="trail" data-grow="0.9 0, 3.9 0.38, 4.4 0.4, 7.6 1"></g>
    <g class="stipple" id="lamp"  data-grow="4.6 0, 5.4 0.3, 8.3 1"></g>
  </svg>

</main>

<script src="stipple.js"></script>
<script src="../../runtime/film.js"></script>
<script>
  const PATH = 'M170 930 C330 936 470 860 640 880 C800 900 860 960 1010 930 C1140 904 1250 760 1420 640';
  Stipple.beads('#steps', { d: PATH, every: 64, seed: 2 });
  Stipple.trail('#trail', { d: PATH, seed: 7 });
  Stipple.halo('#lamp', { x: 1452, y: 470, w: 92, h: 110, reach: 160, seed: 12 });

  Film.setup({ width: 1920, height: 1080, fps: 30 });
  Film.shot({ id: 'one', dur: 4.2, update: Stipple.shot(0, '#drawing') });
  Film.shot({ id: 'two', dur: 4.2, update: Stipple.shot(4.2, '#drawing') });
  Film.ready();
</script>
</body>
</html>
