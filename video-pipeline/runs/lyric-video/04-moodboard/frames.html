<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Home: key frames</title>
<!-- Five finished pictures, 2 s each, no motion. Stills are taken at 1, 3, 5, 7, 9 s:
     node video-pipeline/tools/render.js <run>/04-moodboard/frames.html --stills 1,3,5,7,9 --out <run>/04-moodboard/frames
     The sheet, the window, the road and the place of the words are the same in
     every frame. What changes: which words are on the sheet and lit, how much of
     the road is down (data-share), and how much of the dark has gathered round
     the window. In the film there is one drawing above the shots, grown with
     data-grow; here every key frame carries its own copy so each still is whole. -->
<link rel="stylesheet" href="../../../styles/stipple-lyric/stipple.css">
<style>
  /* tokens from style.json */
  :root {
    --paper: #ded0ba; --ink: #0b0100; --accent: #7a1713; --faint: 0.38;
    --lyric-size: 160px; --lyric-leading: 178px; --lyric-x: 152px; --lyric-y: 274px;
  }
</style>
</head>
<body>
<main id="stage">

  <!-- 1. title, 0.0 s: the first frame. The red word where it will sit in the line,
       the unlit window at the far right, the road's first dot. -->
  <section class="shot" id="title-0">
    <svg viewBox="0 0 1920 1080">
      <g class="stipple road" data-share="0"></g>
      <g class="stipple steps" data-share="0.01"></g>
      <g class="stipple dark" data-share="0"></g>
      <g class="stipple frame"></g>
    </svg>
    <p class="lyric">
      <span class="row"><span class="w out">Text</span> <span class="w out">me</span></span>
      <span class="row"><span class="w out">when</span> <span class="w out">you&rsquo;re</span> <span class="w accent lit">home</span></span>
    </p>
  </section>

  <!-- 2. title, 1.4 s: the whole first line on the sheet, faint, before the voice starts. Three road dots. -->
  <section class="shot" id="title">
    <svg viewBox="0 0 1920 1080">
      <g class="stipple road" data-share="0"></g>
      <g class="stipple steps" data-share="0.09"></g>
      <g class="stipple dark" data-share="0"></g>
      <g class="stipple frame"></g>
    </svg>
    <p class="lyric">
      <span class="row"><span class="w">Text</span> <span class="w">me</span></span>
      <span class="row"><span class="w">when</span> <span class="w">you&rsquo;re</span> <span class="w accent lit">home</span></span>
    </p>
  </section>

  <!-- 3. ask: the line half spoken. "Text me" said, "when you're" still to come. -->
  <section class="shot" id="ask">
    <svg viewBox="0 0 1920 1080">
      <g class="stipple road" data-share="0.08"></g>
      <g class="stipple steps" data-share="0.18"></g>
      <g class="stipple dark" data-share="0"></g>
      <g class="stipple frame"></g>
    </svg>
    <p class="lyric">
      <span class="row"><span class="w lit">Text</span> <span class="w lit">me</span></span>
      <span class="row"><span class="w">when</span> <span class="w">you&rsquo;re</span> <span class="w accent lit">home</span></span>
    </p>
  </section>

  <!-- 4. love: the payoff, one word from the end. Row one was lit in beat "asking". The road waits one
       stretch short; the window has been lit since "light" and the dark is still gathering. -->
  <section class="shot" id="love">
    <svg viewBox="0 0 1920 1080">
      <g class="stipple road" data-share="0.8"></g>
      <g class="stipple steps" data-share="0.8"></g>
      <g class="stipple dark" data-share="0.62"></g>
      <g class="stipple frame"></g>
    </svg>
    <p class="lyric">
      <span class="row"><span class="w lit">Asking</span> <span class="w lit">is</span> <span class="w lit">how</span></span>
      <span class="row"><span class="w lit">I</span> <span class="w lit">love</span> <span class="w">you.</span></span>
    </p>
  </section>

  <!-- 5. home: the last frame. The road at the sill, the lit window, and the red word reset as "Home." -->
  <section class="shot" id="home">
    <svg viewBox="0 0 1920 1080">
      <g class="stipple road" data-share="1"></g>
      <g class="stipple steps" data-share="1"></g>
      <g class="stipple dark" data-share="1"></g>
      <g class="stipple frame"></g>
    </svg>
    <p class="lyric">
      <span class="row"><span class="w out">Text</span> <span class="w out">me</span></span>
      <span class="row"><span class="w out">when</span> <span class="w out">you&rsquo;re</span> <span class="swap"><span class="w accent out">home</span><span class="w accent lit">Home.</span></span></span>
    </p>
  </section>

</main>

<script src="../../../styles/stipple-lyric/stipple.js"></script>
<script src="../../../runtime/film.js"></script>
<script>
  /* The drawing, once. The producer copies ROAD, PANE, SILL, box() and draw() unchanged. */
  const ROAD = 'M160 944 C250 920 345 908 440 884 C520 864 590 864 628 902 C656 930 700 948 760 944 C850 938 925 929 985 888 L1472 552';
  const PANE = { x: 1496, y: 372, w: 124, h: 146 };
  const SILL = [1480, 529, 156, 9];
  const box = (x, y, w, h, m) => `M${x - m} ${y - m} H${x + w + m} V${y + h + m} H${x - m} Z`;
  function draw(root) {
    // the road, and the larger steps that land ahead of it
    Stipple.trail(root.querySelector('.road'), { d: ROAD, seed: 5 });
    Stipple.beads(root.querySelector('.steps'), { d: ROAD, every: 62, r: [4.2, 5.4], seed: 9 });
    // the unlit window: a closed square of dots, a cross-bar, a sill. On the sheet from frame 0
    const frame = root.querySelector('.frame');
    Stipple.beads(frame, { d: box(PANE.x, PANE.y, PANE.w, PANE.h, 3.5), every: 9, r: [2.5, 3.2], jitter: 0.5, seed: 31 });
    Stipple.beads(frame, { d: `M${PANE.x + PANE.w / 2} ${PANE.y + 9} V${PANE.y + PANE.h - 6}`, every: 8, r: [1.7, 2.2], jitter: 0.4, seed: 32 });
    Stipple.beads(frame, { d: `M${PANE.x + 9} ${PANE.y + 62} H${PANE.x + PANE.w - 6}`, every: 8, r: [1.7, 2.2], jitter: 0.4, seed: 33 });
    Stipple.beads(frame, { d: `M${SILL[0] - 2} ${SILL[1] + SILL[3] + 4} H${SILL[0] + SILL[2] + 2}`, every: 8, r: [2.6, 3.2], jitter: 0.4, seed: 34 });
    // the dark that gathers round it from the word "light": the pane and the sill are paper left alone
    Stipple.halo(root.querySelector('.dark'), { ...PANE, bare: [SILL], reach: 150, uneven: 0.35, seed: 21 });
  }
  document.querySelectorAll('.shot').forEach(draw);

  Film.setup({ width: 1920, height: 1080, fps: 30 });
  for (const id of ['title-0', 'title', 'ask', 'love', 'home']) Film.shot({ id, dur: 2 });
  Film.ready();
</script>
</body>
</html>
